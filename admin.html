<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ChatWave Admin Panel</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #0b1220;
      color: #eef2ff;
    }
    .container { max-width: 1100px; margin: auto; padding: 24px; }
    .brand { color: #36d6a5; font-size: 27px; font-weight: 800; }
    .muted { color: #9aa8bf; }
    .panel {
      background: #141e30;
      border: 1px solid #26344a;
      border-radius: 14px;
      padding: 22px;
      margin-top: 20px;
    }
    input, button {
      width: 100%;
      padding: 13px;
      border-radius: 9px;
      font-size: 15px;
      margin-top: 10px;
    }
    input {
      color: white;
      background: #0b1220;
      border: 1px solid #34445e;
    }
    button {
      border: 0;
      cursor: pointer;
      font-weight: bold;
      background: #36d6a5;
      color: #071a16;
    }
    button.secondary {
      background: #26344a;
      color: white;
      width: auto;
      padding: 10px 15px;
    }
    .hidden { display: none !important; }
    .stats {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 14px;
      margin-top: 20px;
    }
    .stat {
      background: #141e30;
      border: 1px solid #26344a;
      border-radius: 12px;
      padding: 20px;
    }
    .number { font-size: 30px; font-weight: bold; margin-top: 10px; }
    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
    }
    .table-wrap { overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; margin-top: 16px; }
    th, td {
      text-align: left;
      padding: 13px 10px;
      border-bottom: 1px solid #26344a;
      font-size: 14px;
    }
    th { color: #9aa8bf; }
    #message { color: #ffd18a; white-space: pre-wrap; margin-top: 14px; }
    @media(max-width:650px) {
      .container { padding: 15px; }
      .stats { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="brand">ChatWave <span class="muted">Admin</span></div>
    <p class="muted">Administration dashboard</p>

    <section id="loginPanel" class="panel">
      <h2>Admin sign in</h2>
      <p class="muted">Sign in with your authorized administrator account.</p>
      <form id="loginForm">
        <input id="email" type="email" placeholder="Admin email" required>
        <input id="password" type="password" placeholder="Password" required>
        <button type="submit">Sign in</button>
      </form>
      <div id="loginMessage" role="status"></div>
    </section>

    <section id="dashboard" class="hidden">
      <div class="topbar">
        <div>
          <h2>Dashboard</h2>
          <div id="signedInAs" class="muted"></div>
        </div>
        <div>
          <button id="refreshBtn" class="secondary">Refresh</button>
          <button id="logoutBtn" class="secondary">Sign out</button>
        </div>
      </div>

      <div class="stats">
        <div class="stat">
          <div class="muted">Registered users loaded</div>
          <div id="totalUsers" class="number">—</div>
        </div>
        <div class="stat">
          <div class="muted">Verified profiles</div>
          <div id="verifiedUsers" class="number">—</div>
        </div>
        <div class="stat">
          <div class="muted">Pending profiles</div>
          <div id="pendingUsers" class="number">—</div>
        </div>
      </div>

      <div class="panel">
        <h2>User management</h2>
        <input id="search" type="search" placeholder="Search by name or email">
        <div id="message" role="status"></div>
        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th>Name</th>
                <th>Email</th>
                <th>Account status</th>
                <th>Email verified</th>
              </tr>
            </thead>
            <tbody id="userRows">
              <tr><td colspan="4">Sign in to load users.</td></tr>
            </tbody>
          </table>
        </div>
      </div>
    </section>
  </div>

  <script type="module">
    import { initializeApp } from
      "https://www.gstatic.com/firebasejs/11.6.0/firebase-app.js";
    import {
      getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut
    } from "https://www.gstatic.com/firebasejs/11.6.0/firebase-auth.js";
    import {
      getFirestore, doc, getDoc, collection, getDocs, limit, query
    } from "https://www.gstatic.com/firebasejs/11.6.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyDntETD4TqUk5qnD6hoBLcGBvq2Ty4uJvA",
      authDomain: "chat-app-fe0df.firebaseapp.com",
      projectId: "chat-app-fe0df",
      storageBucket: "chat-app-fe0df.firebasestorage.app",
      messagingSenderId: "255781243837",
      appId: "1:255781243837:web:7154aa4a0a28e773f8e0d4"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    const $ = id => document.getElementById(id);
    let users = [];

    function showMessage(message) {
      $("message").textContent = message;
    }

    function safeError(error) {
      const messages = {
        "auth/api-key-not-valid": "Firebase rejected the API key.",
        "auth/invalid-credential": "Email or password is incorrect.",
        "auth/too-many-requests": "Too many attempts. Try again later.",
        "permission-denied": "Firestore denied access. Check your security rules."
      };
      return messages[error.code] ||
        error.message ||
        "Something went wrong. Check your Firebase setup.";
    }

    $("loginForm").addEventListener("submit", async event => {
      event.preventDefault();
      $("loginMessage").textContent = "Signing in…";
      try {
        await signInWithEmailAndPassword(
          auth, $("email").value.trim(), $("password").value
        );
        $("loginMessage").textContent = "";
      } catch (error) {
        $("loginMessage").textContent = safeError(error);
      }
    });

    async function isAdmin(user) {
      const token = await user.getIdTokenResult(true);
      if (token.claims.admin === true) return true;

      const adminDoc = await getDoc(doc(db, "admins", user.uid));
      return adminDoc.exists() && adminDoc.data().active === true;
    }

    async function loadUsers() {
      showMessage("Loading user profiles…");
      $("userRows").replaceChildren();

      try {
        const result = await getDocs(
          query(collection(db, "users"), limit(200))
        );

        users = result.docs.map(snapshot => ({
          id: snapshot.id,
          ...snapshot.data()
        }));

        $("totalUsers").textContent = users.length;
        $("verifiedUsers").textContent =
          users.filter(user => user.emailVerified === true).length;
        $("pendingUsers").textContent =
          users.filter(user => user.accountStatus === "pending").length;

        renderUsers();
        showMessage(users.length === 200
          ? "Showing up to 200 profiles."
          : "Profiles loaded.");
      } catch (error) {
        showMessage(safeError(error));
      }
    }

    function renderUsers() {
      const term = $("search").value.trim().toLowerCase();
      const filtered = users.filter(user =>
        String(user.name || "").toLowerCase().includes(term) ||
        String(user.email || "").toLowerCase().includes(term)
      );

      const tbody = $("userRows");
      tbody.replaceChildren();

      if (!filtered.length) {
        const row = tbody.insertRow();
        const cell = row.insertCell();
        cell.colSpan = 4;
        cell.textContent = "No matching profiles found.";
        return;
      }

      for (const user of filtered) {
        const row = tbody.insertRow();
        [
          user.name || "—",
          user.email || "—",
          user.accountStatus || "unknown",
          user.emailVerified === true ? "Yes" : "No"
        ].forEach(value => {
          const cell = row.insertCell();
          cell.textContent = String(value);
        });
      }
    }

    $("search").addEventListener("input", renderUsers);
    $("refreshBtn").addEventListener("click", loadUsers);
    $("logoutBtn").addEventListener("click", () => signOut(auth));

    onAuthStateChanged(auth, async user => {
      $("loginPanel").classList.toggle("hidden", !!user);
      $("dashboard").classList.add("hidden");
      users = [];

      if (!user) return;

      try {
        if (!await isAdmin(user)) {
          await signOut(auth);
          $("loginPanel").classList.remove("hidden");
          $("loginMessage").textContent =
            "This account is not authorized as an administrator yet.";
          return;
        }

        $("signedInAs").textContent = user.email || "Administrator";
        $("dashboard").classList.remove("hidden");
        await loadUsers();
      } catch (error) {
        showMessage(safeError(error));
      }
    });
  </script>
</body>
</html>
