<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>ChatWave Admin</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 p-5">
<h1 class="text-3xl font-bold mb-5">ChatWave Admin Panel</h1>
<div class="grid grid-cols-3 gap-4 mb-5">
  <div class="bg-white p-5 rounded shadow"><h3>Total Users</h3><b id="totalUsers" class="text-3xl">0</b></div>
  <div class="bg-white p-5 rounded shadow"><h3>Total Chats</h3><b id="totalChats" class="text-3xl">0</b></div>
  <div class="bg-white p-5 rounded shadow"><h3>Online Now</h3><b class="text-3xl text-green-500">Live</b></div>
</div>
<h2 class="text-xl font-bold mb-3">All Users</h2>
<div id="usersTable" class="bg-white rounded shadow"></div>
<h2 class="text-xl font-bold my-3">All Messages (Recent)</h2>
<div id="messagesTable" class="bg-white rounded shadow p-3 max-h-[400px] overflow-y-auto"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getFirestore, collection, onSnapshot, getDocs } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyCOfNfS3DMUMSRHJpyW_tpSIjwFymrTt7w",
  authDomain: "chat-2c557.firebaseapp.com",
  projectId: "chat-2c557",
  storageBucket: "chat-2c557.firebasestorage.app",
  messagingSenderId: "74313204354",
  appId: "1:74313204354:web:c735269d502b88a39eea9b"
};
const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

onSnapshot(collection(db, "users"), (snap)=>{
  document.getElementById('totalUsers').innerText = snap.size;
  const table = document.getElementById('usersTable');
  table.innerHTML = `<div class="p-2 font-bold border-b grid grid-cols-3"><span>Email</span><span>UID</span><span>Action</span></div>`;
  snap.forEach(d=>{
    const u = d.data();
    const div = document.createElement('div');
    div.className = "p-2 border-b grid grid-cols-3 text-sm";
    div.innerHTML = `<span>${u.email}</span><span class="truncate">${u.uid}</span><span><button onclick="alert('${u.email}')" class="text-blue-500">View</button></span>`;
    table.appendChild(div);
  });
});
</script>
</body>
</html>
