<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#10243b">
<title>ChatWave — Connect. Chat. Share.</title>
<script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
<style>
:root{color-scheme:dark;--bg:#091727;--glass:rgba(255,255,255,.09);--line:rgba(255,255,255,.15);--muted:#a7b9cc;--mint:#52e5ce;--blue:#48a7f4;--text:#f5f8ff}
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--text);background:radial-gradient(ellipse at 15% 5%,#17436c 0,transparent 42%),radial-gradient(ellipse at 90% 90%,#07504e 0,transparent 38%),var(--bg);min-height:100dvh}
button,input,textarea{font:inherit}
button{cursor:pointer;color:inherit}
button:disabled{opacity:.5;cursor:not-allowed}
.hidden{display:none!important}
.app{max-width:760px;margin:auto;min-height:100dvh;display:flex;flex-direction:column;position:relative}
header{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:12px;padding:calc(env(safe-area-inset-top) + 15px) 18px 15px;background:rgba(16,39,63,.72);backdrop-filter:blur(25px);border-bottom:1px solid var(--line)}
.logo{width:46px;height:46px;border-radius:16px;display:grid;place-items:center;background:linear-gradient(135deg,var(--mint),var(--blue));font-size:25px;color:white}
.brand{font-weight:850;font-size:23px;letter-spacing:-.7px}.brand span{color:var(--mint)}
.header-action{margin-left:auto;width:46px;height:46px;border:1px solid var(--line);border-radius:16px;background:var(--glass);font-size:24px}
main{flex:1;padding:18px 16px 28px;min-width:0}
.panel{background:var(--glass);border:1px solid var(--line);border-radius:22px;padding:17px;backdrop-filter:blur(20px);margin-bottom:14px}
h2{font-size:24px;margin:3px 0 16px}h3{font-size:16px;margin:0 0 12px}
.muted{color:var(--muted)}.small{font-size:13px}.search,.field{width:100%;padding:14px 15px;border-radius:16px;background:rgba(255,255,255,.08);border:1px solid var(--line);color:var(--text);outline:none}.field{margin:6px 0 12px}.search{margin-bottom:20px}
.primary{border:0;background:linear-gradient(120deg,var(--mint),var(--blue));color:#072039;border-radius:15px;padding:13px 17px;font-weight:800}
.secondary{border:1px solid var(--line);background:var(--glass);border-radius:15px;padding:12px 15px}
.danger{border:1px solid rgba(255,100,115,.5);background:rgba(255,70,90,.12);color:#ffb0ba;border-radius:15px;padding:13px 15px}
.full{width:100%}
.row{display:flex;align-items:center;gap:12px}.grow{flex:1;min-width:0}
.avatar{width:54px;height:54px;flex-shrink:0;border-radius:50%;display:grid;place-items:center;background:linear-gradient(135deg,var(--mint),var(--blue));color:white;font-size:20px;font-weight:800}
.person-name{font-weight:750;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.preview{color:var(--muted);font-size:14px;margin-top:5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chat-row{display:flex;align-items:center;gap:13px;padding:13px 5px;border-bottom:1px solid rgba(255,255,255,.08);cursor:pointer}
.chat-row:last-child{border-bottom:0}
.unread{background:var(--mint);color:#07312e;border-radius:999px;min-width:23px;height:23px;padding:0 7px;display:grid;place-items:center;font-size:12px;font-weight:900}
.badge{display:inline-flex;background:var(--mint);color:#062b29;border-radius:999px;padding:3px 8px;font-size:11px;font-weight:900}
.bottom-nav{position:sticky;bottom:0;z-index:5;display:flex;justify-content:space-around;gap:8px;padding:10px 12px calc(env(safe-area-inset-bottom) + 10px);background:rgba(20,43,65,.83);backdrop-filter:blur(26px);border-top:1px solid var(--line)}
.nav-item{flex:1;border:0;background:transparent;color:var(--muted);padding:9px 4px;border-radius:15px;font-size:12px}
.nav-item .nav-icon{display:block;font-size:22px;margin-bottom:4px}
.nav-item.active{color:var(--mint);background:rgba(255,255,255,.06)}
.auth-wrap{width:100%;max-width:440px;margin:auto;padding:24px 20px}
.auth-logo{font-size:48px;text-align:center;margin-bottom:10px}.auth-title{text-align:center;font-size:29px;font-weight:850;margin:0 0 8px}.auth-sub{text-align:center;color:var(--muted);margin:0 0 26px}
#conversation{position:fixed;inset:0;z-index:10;background:radial-gradient(ellipse at 10% 10%,#17436c 0,transparent 45%),radial-gradient(ellipse at 100% 95%,#07504e 0,transparent 42%),var(--bg);display:flex;flex-direction:column;max-width:760px;margin:auto;width:100%;height:100dvh}
.chat-header{display:flex;align-items:center;gap:10px;padding:calc(env(safe-area-inset-top) + 10px) 14px 12px;background:rgba(20,47,75,.75);backdrop-filter:blur(24px);border-bottom:1px solid var(--line)}
.back{width:44px;height:44px;border-radius:15px;border:1px solid var(--line);background:var(--glass);font-size:23px}
.messages{flex:1;overflow-y:auto;padding:18px 14px 20px;display:flex;flex-direction:column;gap:13px;overscroll-behavior:contain}
.message{max-width:82%;padding:12px 14px;border:1px solid var(--line);border-radius:21px;background:rgba(255,255,255,.12);align-self:flex-start;overflow-wrap:anywhere}
.message.mine{align-self:flex-end;background:linear-gradient(135deg,rgba(76,220,196,.9),rgba(67,151,238,.95));color:#062238;border-color:transparent;border-bottom-right-radius:6px}
.message:not(.mine){border-bottom-left-radius:6px}
.message-time{font-size:11px;opacity:.72;margin-top:6px;text-align:right}
.composer{display:flex;align-items:flex-end;gap:9px;padding:10px 12px calc(env(safe-area-inset-bottom) + 12px);background:rgba(24,48,72,.9);backdrop-filter:blur(24px);border-top:1px solid var(--line)}
.composer textarea{resize:none;max-height:130px;min-height:48px;flex:1;border:1px solid var(--line);border-radius:23px;background:rgba(255,255,255,.1);padding:13px 15px;color:var(--text);outline:none}
.send{height:48px;width:50px;border:0;border-radius:17px;background:linear-gradient(135deg,var(--mint),var(--blue));color:#062238;font-size:22px}
.setting-row{display:flex;align-items:center;gap:13px;padding:15px 3px;border-bottom:1px solid rgba(255,255,255,.08);cursor:pointer}
.setting-row:last-child{border-bottom:0}.setting-icon{width:42px;height:42px;border-radius:14px;display:grid;place-items:center;background:var(--glass);font-size:20px}
.toast{position:fixed;z-index:30;bottom:calc(env(safe-area-inset-bottom) + 88px);left:50%;transform:translateX(-50%);max-width:90%;padding:12px 17px;border:1px solid var(--line);border-radius:15px;background:#193b55;box-shadow:0 8px 35px #0005}
.empty{text-align:center;color:var(--muted);padding:35px 12px}
hr{border:0;border-top:1px solid var(--line);margin:18px 0}
@media(min-width:761px){body{padding:18px 0}.app{min-height:calc(100dvh - 36px);border:1px solid var(--line);border-radius:28px;overflow:hidden}#conversation{top:18px;bottom:18px;height:calc(100dvh - 36px);border:1px solid var(--line);border-radius:28px;overflow:hidden}}
</style>
</head>
<body>
<div id="authScreen" class="auth-wrap">
  <div class="auth-logo">💬</div>
  <h1 class="auth-title">Chat<span style="color:var(--mint)">Wave</span></h1>
  <p class="auth-sub">Connect. Chat. Share.</p>
  <section class="panel">
    <div id="authHeading"><h2 id="authTitle">Welcome back</h2><p class="muted">Sign in or create your account.</p></div>
    <form id="authForm">
      <div id="nameWrap" class="hidden"><label class="small muted" for="authName">Username</label><input id="authName" class="field" autocomplete="nickname" maxlength="40" placeholder="Choose a username"></div>
      <label class="small muted" for="authEmail">Email address</label>
      <input id="authEmail" class="field" type="email" autocomplete="email" required placeholder="you@example.com">
      <label class="small muted" for="authPassword">Password</label>
      <input id="authPassword" class="field" type="password" minlength="6" autocomplete="current-password" required placeholder="At least 6 characters">
      <div id="codeWrap" class="hidden">
        <label class="small muted" for="authCode">Email verification code</label>
        <input id="authCode" class="field" inputmode="numeric" maxlength="6" placeholder="6-digit code">
      </div>
      <button id="authSubmit" class="primary full" type="submit">Sign In</button>
    </form>
    <button id="authSwitch" class="secondary full" style="margin-top:12px">Create an account</button>
    <button id="forgotBtn" class="secondary full" style="margin-top:10px">Forgot password?</button>
  </section>
  <p class="muted small" style="text-align:center">By continuing, you agree to use ChatWave respectfully.</p>
</div>

<div id="appScreen" class="app hidden">
  <header>
    <div class="logo">💬</div>
    <div class="brand">Chat<span>Wave</span></div>
    <button id="newChatBtn" class="header-action" aria-label="New chat">＋</button>
  </header>
  <main id="main"></main>
  <nav id="bottomNav" class="bottom-nav">
    <button class="nav-item active" data-page="chats"><span class="nav-icon">▤</span>Chats <span id="navUnread" class="badge hidden">0</span></button>
    <button class="nav-item" data-page="calls"><span class="nav-icon">◉</span>Calls</button>
    <button class="nav-item" data-page="settings"><span class="nav-icon">⚙</span>Settings</button>
  </nav>
</div>

<div id="conversation" class="hidden">
  <div class="chat-header">
    <button id="backChat" class="back" aria-label="Back to chats">‹</button>
    <div id="chatAvatar" class="avatar">C</div>
    <div class="grow"><div id="chatTitle" class="person-name">Conversation</div><div id="chatSubtitle" class="preview">ChatWave</div></div>
    <button id="chatMore" class="header-action" aria-label="Conversation options">⋯</button>
  </div>
  <div id="messages" class="messages"></div>
  <form id="composer" class="composer">
    <textarea id="messageInput" rows="1" placeholder="Write a message..." aria-label="Message" required></textarea>
    <button class="send" aria-label="Send message" type="submit">➤</button>
  </form>
</div>
<div id="modalHost"></div>
<div id="toast" class="toast hidden" role="status"></div>

<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/11.6.0/firebase-app.js";
import {
 getAuth,onAuthStateChanged,createUserWithEmailAndPassword,signInWithEmailAndPassword,
 sendPasswordResetEmail,updateProfile,deleteUser
} from "https://www.gstatic.com/firebasejs/11.6.0/firebase-auth.js";
import {
 getFirestore,doc,setDoc,getDoc,updateDoc,collection,query,where,
 onSnapshot,addDoc,serverTimestamp,orderBy,runTransaction,deleteDoc
} from "https://www.gstatic.com/firebasejs/11.6.0/firebase-firestore.js";

/* Your Firebase project configuration */
const firebaseConfig={
 apiKey:"AIzaSyCOfNfS3DMUMSRHJpyW_tpSIjwFymrTt7w",
 authDomain:"chat-2c557.firebaseapp.com",
 databaseURL:"https://chat-2c557-default-rtdb.firebaseio.com",
 projectId:"chat-2c557",
 storageBucket:"chat-2c557.firebasestorage.app",
 messagingSenderId:"74313204354",
 appId:"1:74313204354:web:c735269d502b88a39eea9b"
};

/* Your EmailJS configuration */
const EMAILJS_PUBLIC_KEY="OxtLjZnoiYd3ih6cm";
const EMAILJS_SERVICE_ID="service_1h2qcyj";
const EMAILJS_TEMPLATE_ID="template_g5knl87";

const app=initializeApp(firebaseConfig);
const auth=getAuth(app);
const db=getFirestore(app);
emailjs.init({publicKey:EMAILJS_PUBLIC_KEY});

const $=id=>document.getElementById(id);
let me=null,profile=null,page="chats",authMode="login",pendingCode=null;
let chats=[],people=[],currentChat=null,unsubChats=null,unsubPeople=null,unsubMessages=null;
let messageCache=[],toastTimer=null,chatOpen=false,submitting=false;

function esc(value=""){return String(value).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}
function initials(s="C"){return (s.trim().split(/\s+/).map(x=>x[0]).join("").slice(0,2)||"C").toUpperCase();}
function toast(msg){$("toast").textContent=msg;$("toast").classList.remove("hidden");clearTimeout(toastTimer);toastTimer=setTimeout(()=>$("toast").classList.add("hidden"),3000);}
function friendlyError(e){const m=e?.message||"Something went wrong.";return m.replace("Firebase: ","").replace(/\(auth\/[^)]+\)\.?/g,"").replace(/\.$/,"");}
function dateText(t){try{const d=t?.toDate?t.toDate():t?new Date(t):null;return d&&!isNaN(d)?d.toLocaleTimeString([],{hour:"2-digit",minute:"2-digit"}):"";}catch{return"";}}
function unreadFor(c){return Number(c.unreadCounts?.[me.uid]||0);}
function chatName(c){if(c.name)return c.name;const other=(c.members||[]).find(id=>id!==me.uid);const p=people.find(x=>x.uid===other);return p?.username||p?.email||"ChatWave user";}
function latestText(c){return c.lastMessage||"Start a conversation";}
function cleanListeners(){unsubChats?.();unsubPeople?.();unsubMessages?.();unsubChats=unsubPeople=unsubMessages=null;}
function showAuth(){cleanListeners();$("authScreen").classList.remove("hidden");$("appScreen").classList.add("hidden");$("conversation").classList.add("hidden");chatOpen=false;}
function showApp(){ $("authScreen").classList.add("hidden");$("appScreen").classList.remove("hidden");$("conversation").classList.add("hidden");chatOpen=false;renderPage();listenData();}
function listenData(){
 cleanListeners();
 unsubPeople=onSnapshot(collection(db,"users"),snap=>{
  people=snap.docs.map(d=>({uid:d.id,...d.data()}));
  if(!chatOpen)renderPage();
 },e=>toast("Users: "+friendlyError(e)));
 const q=query(collection(db,"chats"),where("members","array-contains",me.uid));
 unsubChats=onSnapshot(q,snap=>{
  chats=snap.docs.map(d=>({id:d.id,...d.data()}));
  chats.sort((a,b)=>(b.updatedAt?.toMillis?.()||0)-(a.updatedAt?.toMillis?.()||0));
  updateUnreadBadge();
  if(!chatOpen)renderPage();
 },e=>toast("Chats: "+friendlyError(e)));
}
function updateUnreadBadge(){
 const count=chats.reduce((sum,c)=>sum+unreadFor(c),0);
 $("navUnread").textContent=count>99?"99+":String(count);
 $("navUnread").classList.toggle("hidden",count===0);
}
function setPage(p){
 page=p;
 document.querySelectorAll(".nav-item").forEach(b=>b.classList.toggle("active",b.dataset.page===p));
 $("newChatBtn").classList.toggle("hidden",p!=="chats");
 renderPage();
}
function renderPage(){
 if(!me||chatOpen)return;
 const main=$("main");
 if(page==="chats"){
  const total=chats.reduce((sum,c)=>sum+unreadFor(c),0);
  main.innerHTML=`
   <input id="chatSearch" class="search" placeholder="⌕  Search conversations..." autocomplete="off">
   <div class="row" style="margin:3px 0 14px"><h3 style="margin:0">MESSAGES</h3><span class="badge">${total} unread</span></div>
   <section id="chatList"></section>`;
  renderChatList();
  $("chatSearch").addEventListener("input",renderChatList);
 }else if(page==="calls"){
  main.innerHTML=`<h2>Calls</h2><section class="panel"><div class="empty">Your recent calls will appear here.</div><p class="muted small">Voice and video calling need a calling service or WebRTC signalling setup. This screen does not place real calls yet.</p></section>`;
 }else{
  main.innerHTML=`
   <h2>Settings</h2>
   <section class="panel">
    <div class="row">
     <div class="avatar">${esc(initials(profile?.username||me.email))}</div>
     <div class="grow"><div class="person-name">${esc(profile?.username||me.displayName||"ChatWave user")}</div><div class="preview">${esc(me.email||"")}</div></div>
     <button class="secondary" id="editProfile">Edit</button>
    </div>
   </section>
   <section class="panel">
    <div class="setting-row" data-setting="account"><div class="setting-icon">👤</div><div class="grow"><div class="person-name">Account</div><div class="preview">Email, security and delete account</div></div>›</div>
    <div class="setting-row" data-setting="privacy"><div class="setting-icon">🔒</div><div class="grow"><div class="person-name">Privacy</div><div class="preview">Privacy preferences</div></div>›</div>
    <div class="setting-row" data-setting="chats"><div class="setting-icon">💬</div><div class="grow"><div class="person-name">Chats</div><div class="preview">Conversation preferences</div></div>›</div>
    <div class="setting-row" data-setting="notifications"><div class="setting-icon">🔔</div><div class="grow"><div class="person-name">Notifications</div><div class="preview">Notification preferences</div></div>›</div>
    <div class="setting-row" data-setting="help"><div class="setting-icon">❔</div><div class="grow"><div class="person-name">Help</div><div class="preview">About ChatWave</div></div>›</div>
   </section>`;
  $("editProfile").onclick=editProfile;
  main.querySelectorAll("[data-setting]").forEach(el=>el.onclick=()=>openSettings(el.dataset.setting));
 }
}
function renderChatList(){
 const host=$("chatList");if(!host)return;
 const term=($("chatSearch")?.value||"").trim().toLowerCase();
 const list=chats.filter(c=>(chatName(c)+" "+latestText(c)).toLowerCase().includes(term));
 if(!list.length){host.innerHTML=`<div class="empty">${term?"No matching conversations.":"No conversations yet. Tap + to start a chat."}</div>`;return;}
 host.innerHTML=list.map(c=>{
  const n=chatName(c),u=unreadFor(c);
  return `<div class="chat-row" data-chat="${esc(c.id)}">
   <div class="avatar">${esc(initials(n))}</div>
   <div class="grow"><div class="person-name">${esc(n)}</div><div class="preview">${esc(latestText(c))}</div></div>
   <div style="text-align:right;display:flex;flex-direction:column;align-items:flex-end;gap:8px"><span class="small muted">${esc(dateText(c.updatedAt))}</span>${u?`<span class="unread">${u>99?"99+":u}</span>`:""}</div>
  </div>`;
 }).join("");
 host.querySelectorAll("[data-chat]").forEach(el=>el.onclick=()=>openChat(el.dataset.chat));
}
async function editProfile(){
 const name=prompt("Choose your ChatWave username:",profile?.username||me.displayName||"");
 if(name===null)return;
 const username=name.trim();
 if(!username){toast("Username cannot be empty.");return;}
 try{await updateProfile(me,{displayName:username});await setDoc(doc(db,"users",me.uid),{username,email:me.email,updatedAt:serverTimestamp()},{merge:true});profile={...profile,username};renderPage();toast("Profile updated.");}
 catch(e){toast(friendlyError(e));}
}
function openSettings(which){
 const titles={account:"Account",privacy:"Privacy",chats:"Chats",notifications:"Notifications",help:"Help"};
 let content="";
 if(which==="account"){
  content=`<p class="muted small">Signed in as</p><p>${esc(me.email||"")}</p>
  <button class="secondary full" id="resetPassword">Send password reset email</button>
  <hr><h3>Delete account</h3><p class="muted small">This permanently deletes your Firebase login and profile document. Existing conversation records and messages may need separate cleanup by your database administrator.</p><button class="danger full" id="deleteAccount">Delete my account</button>`;
 }else if(which==="privacy"){
  content=`<p class="muted">Privacy options are currently informational. Do not assume these settings restrict data access until corresponding Firebase rules and server-side enforcement are configured.</p>`;
 }else if(which==="chats"){
  content=`<p class="muted">Unread counts update from Firestore. Open a conversation to mark it read.</p>`;
 }else if(which==="notifications"){
  content=`<p class="muted">Push notifications are not configured in this version. Browser notifications alone do not guarantee background message delivery.</p>`;
 }else{
  content=`<p>ChatWave</p><p class="muted">Connect. Chat. Share.</p><p class="muted small">For account or data issues, contact your app administrator.</p>`;
 }
 $("modalHost").innerHTML=`<div id="modalShade" style="position:fixed;inset:0;z-index:20;background:#0009;display:flex;align-items:flex-end;justify-content:center;padding:12px">
 <section class="panel" style="width:100%;max-width:520px;max-height:85dvh;overflow:auto;background:#142a40">
  <div class="row"><h2 class="grow">${esc(titles[which]||"Settings")}</h2><button id="closeModal" class="secondary">✕</button></div>${content}
 </section></div>`;
 $("closeModal").onclick=()=>$("modalHost").innerHTML="";
 $("modalShade").onclick=e=>{if(e.target.id==="modalShade")$("modalHost").innerHTML="";};
 $("resetPassword")?.addEventListener("click",async()=>{try{await sendPasswordResetEmail(auth,me.email);toast("Password reset email sent.");}catch(e){toast(friendlyError(e));}});
 $("deleteAccount")?.addEventListener("click",confirmDeleteAccount);
}
async function confirmDeleteAccount(){
 const ok=confirm("Permanently delete your ChatWave account? This cannot be undone.");
 if(!ok)return;
 const typed=prompt('Type DELETE to confirm account deletion.');
 if(typed!=="DELETE"){toast("Deletion cancelled.");return;}
 try{
  // Firebase may require a recent sign-in before deleting an account.
  // Delete the profile document first; chats/messages are not automatically erased here.
  await deleteDoc(doc(db,"users",me.uid));
  await deleteUser(me);
  $("modalHost").innerHTML="";
  toast("Account deleted.");
 }catch(e){
  toast("Could not delete account: "+friendlyError(e)+". You may need to sign in again.");
 }
}
function showModal(title,body){
 $("modalHost").innerHTML=`<div id="modalShade" style="position:fixed;inset:0;z-index:20;background:#0009;display:flex;align-items:center;justify-content:center;padding:18px"><section class="panel" style="width:100%;max-width:450px;background:#142a40"><div class="row"><h2 class="grow">${esc(title)}</h2><button id="closeModal" class="secondary">✕</button></div>${body}</section></div>`;
 $("closeModal").onclick=()=>$("modalHost").innerHTML="";
 $("modalShade").onclick=e=>{if(e.target.id==="modalShade")$("modalHost").innerHTML="";};
}
async function startNewChat(){
 const email=prompt("Enter the other person's registered email address:");
 if(email===null)return;
 const target=email.trim().toLowerCase();
 if(!target||target===me.email?.toLowerCase()){toast("Enter another user's email address.");return;}
 try{
  const user=people.find(p=>p.email?.toLowerCase()===target);
  if(!user){toast("User not found. They may need to create a ChatWave account first.");return;}
  const members=[me.uid,user.uid].sort();
  const id=members.join("_");
  const ref=doc(db,"chats",id),existing=await getDoc(ref);
  if(!existing.exists())await setDoc(ref,{members,name:"",createdAt:serverTimestamp(),updatedAt:serverTimestamp(),lastMessage:"Start a conversation",unreadCounts:{[me.uid]:0,[user.uid]:0}});
  await openChat(id);
 }catch(e){toast("Could not start chat: "+friendlyError(e));}
}
async function openChat(id){
 const c=chats.find(x=>x.id===id);
 if(!c){toast("Conversation not found.");return;}
 currentChat=c;chatOpen=true;
 $("appScreen").classList.add("hidden");$("conversation").classList.remove("hidden");
 $("chatTitle").textContent=chatName(c);$("chatAvatar").textContent=initials(chatName(c));
 const other=(c.members||[]).find(uid=>uid!==me.uid);
 $("chatSubtitle").textContent=people.find(p=>p.uid===other)?.username||"ChatWave";
 $("messages").innerHTML=`<div class="empty">Loading messages…</div>`;
 unsubMessages?.();
 unsubMessages=onSnapshot(query(collection(db,"chats",id,"messages"),orderBy("createdAt","asc")),snap=>{
  messageCache=snap.docs.map(d=>({id:d.id,...d.data()}));
  renderMessages();
 },e=>toast("Messages: "+friendlyError(e)));
 try{
  await updateDoc(doc(db,"chats",id),{[`unreadCounts.${me.uid}`]:0});
 }catch(e){console.warn("Could not clear unread count",e);}
}
function renderMessages(){
 const host=$("messages");
 if(!messageCache.length){host.innerHTML=`<div class="empty">No messages yet. Say hello 👋</div>`;return;}
 host.innerHTML=messageCache.map(m=>{
  const mine=m.senderId===me.uid;
  return `<div class="message ${mine?"mine":""}">${esc(m.text||"")}
   <div class="message-time">${esc(dateText(m.createdAt))}${mine?" · You":""}</div></div>`;
 }).join("");
 host.scrollTop=host.scrollHeight;
}
$("composer").addEventListener("submit",async e=>{
 e.preventDefault();
 const text=$("messageInput").value.trim();
 if(!text||!currentChat)return;
 const input=$("messageInput");
 input.value="";input.style.height="auto";
 try{
  const chatRef=doc(db,"chats",currentChat.id);
  const chatSnap=await getDoc(chatRef);
  if(!chatSnap.exists())throw new Error("This conversation no longer exists.");
  const data=chatSnap.data();
  await addDoc(collection(db,"chats",currentChat.id,"messages"),{text,senderId:me.uid,createdAt:serverTimestamp()});
  const counts={...(data.unreadCounts||{})};
  for(const uid of (data.members||[])){if(uid!==me.uid)counts[uid]=(Number(counts[uid])||0)+1;}
  counts[me.uid]=0;
  await updateDoc(chatRef,{lastMessage:text,updatedAt:serverTimestamp(),unreadCounts:counts});
 }catch(e){input.value=text;toast("Message not sent: "+friendlyError(e));}
});
$("messageInput").addEventListener("input",e=>{e.target.style.height="auto";e.target.style.height=Math.min(e.target.scrollHeight,130)+"px";});
$("backChat").onclick=()=>{
 chatOpen=false;currentChat=null;unsubMessages?.();unsubMessages=null;
 $("conversation").classList.add("hidden");$("appScreen").classList.remove("hidden");renderPage();updateUnreadBadge();
};
$("chatMore").onclick=()=>{
 if(!currentChat)return;
 showModal("Conversation",`<button id="clearUnread" class="secondary full">Mark as read</button><button id="closeConversation" class="secondary full" style="margin-top:10px">Close conversation</button>`);
 $("clearUnread").onclick=async()=>{try{await updateDoc(doc(db,"chats",currentChat.id),{[`unreadCounts.${me.uid}`]:0});$("modalHost").innerHTML="";toast("Marked as read.");}catch(e){toast(friendlyError(e));}};
 $("closeConversation").onclick=()=>{$("modalHost").innerHTML="";$("backChat").click();};
};
$("newChatBtn").onclick=startNewChat;
document.querySelectorAll(".nav-item").forEach(b=>b.addEventListener("click",()=>setPage(b.dataset.page)));

function setAuthMode(mode){
 authMode=mode;pendingCode=null;
 $("authTitle").textContent=mode==="login"?"Welcome back":"Create your account";
 $("nameWrap").classList.toggle("hidden",mode!=="register");
 $("codeWrap").classList.add("hidden");
 $("authCode").required=false;
 $("authSubmit").textContent=mode==="login"?"Sign In":"Send verification code";
 $("authSwitch").textContent=mode==="login"?"Create an account":"I already have an account";
 $("forgotBtn").classList.toggle("hidden",mode!=="login");
}
$("authSwitch").onclick=()=>setAuthMode(authMode==="login"?"register":"login");
$("forgotBtn").onclick=async()=>{
 const email=$("authEmail").value.trim();
 if(!email){toast("Enter your email address first.");return;}
 try{await sendPasswordResetEmail(auth,email);toast("Password reset email sent.");}catch(e){toast(friendlyError(e));}
};
$("authForm").addEventListener("submit",async e=>{
 e.preventDefault();if(submitting)return;
 const email=$("authEmail").value.trim().toLowerCase();
 const password=$("authPassword").value;
 const username=$("authName").value.trim();
 submitting=true;$("authSubmit").disabled=true;
 try{
  if(authMode==="register"&&!pendingCode){
   if(username.length<2)throw new Error("Please enter a username with at least 2 characters.");
   const code=String(Math.floor(100000+Math.random()*900000));
   // Your EmailJS template must use matching template variables:
   // to_email, verification_code, app_name
   await emailjs.send(EMAILJS_SERVICE_ID,EMAILJS_TEMPLATE_ID,{
    to_email:email,
    verification_code:code,
    app_name:"ChatWave"
   });
   pendingCode={code,email,expires:Date.now()+10*60*1000};
   $("codeWrap").classList.remove("hidden");$("authCode").required=true;
   $("authSubmit").textContent="Verify code and create account";
   toast("Verification code sent. Check your email.");
   return;
  }
  if(authMode==="register"){
   if(!pendingCode||pendingCode.email!==email||Date.now()>pendingCode.expires)throw new Error("Your verification code expired. Request a new code.");
   if($("authCode").value.trim()!==pendingCode.code)throw new Error("That verification code is incorrect.");
   const cred=await createUserWithEmailAndPassword(auth,email,password);
   await updateProfile(cred.user,{displayName:username});
   await setDoc(doc(db,"users",cred.user.uid),{username,email,createdAt:serverTimestamp(),updatedAt:serverTimestamp()});
   pendingCode=null;
  }else{
   await signInWithEmailAndPassword(auth,email,password);
  }
 }catch(e){toast(friendlyError(e));}
 finally{submitting=false;$("authSubmit").disabled=false;}
});
onAuthStateChanged(auth,async user=>{
 if(!user){me=null;profile=null;cleanListeners();showAuth();return;}
 me=user;
 try{
  const snap=await getDoc(doc(db,"users",user.uid));
  profile=snap.exists()?snap.data():{username:user.displayName||user.email?.split("@")[0]||"ChatWave user",email:user.email};
  if(!snap.exists())await setDoc(doc(db,"users",user.uid),{username:profile.username,email:user.email,createdAt:serverTimestamp()},{merge:true});
  showApp();
 }catch(e){toast("Profile could not load: "+friendlyError(e));showApp();}
});
setAuthMode("login");
</script>
</body>
