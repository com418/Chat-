<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#eaf8f3">
<title>ChatWave — Connect. Chat. Share.</title>
<style>
:root{--a:#16a085;--bg:#edf8f4;--text:#18302d;--muted:#71847f;--glass:rgba(255,255,255,.68);--border:rgba(255,255,255,.9)}
*{box-sizing:border-box}
body{margin:0;font:15px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--text);background:radial-gradient(circle at 10% 10%,#c8f3e3,transparent 35%),radial-gradient(circle at 90% 85%,#dce6ff,transparent 35%),var(--bg);background-attachment:fixed;min-height:100vh}
button,input,textarea{font:inherit}
button{cursor:pointer;border:0}
.hidden{display:none!important}
.glass{background:var(--glass);border:1px solid var(--border);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);box-shadow:0 15px 45px #204c3c14;border-radius:22px}
.btn{background:var(--a);color:white;padding:11px 15px;border-radius:13px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn.secondary,.iconbtn{background:#ffffffa8;color:var(--text);border:1px solid #ffffffdb}
.btn:disabled{opacity:.6;cursor:wait}
.iconbtn{width:42px;height:42px;border-radius:14px;display:grid;place-items:center}
.iconbtn svg{width:20px;height:20px}
.brand{display:flex;align-items:center;gap:10px;font-size:21px;font-weight:850}
.logo{width:42px;height:42px;display:grid;place-items:center;background:linear-gradient(135deg,var(--a),#7ce0c5);color:white;border-radius:15px}
.logo svg{width:24px;height:24px}
.auth{min-height:100vh;display:grid;place-items:center;padding:18px}
.authcard{width:min(100%,440px);padding:26px}
h1{font-size:28px;margin:20px 0 8px}
.muted,.note{color:var(--muted);line-height:1.5}
.field{display:grid;gap:7px;margin:14px 0}
.field label{font-size:13px;font-weight:700}
.field input,.field textarea,.search,.composer input{width:100%;padding:13px;border-radius:13px;border:1px solid #dce9e4;background:#ffffffc9;outline:none;color:var(--text)}
.field textarea{min-height:90px;resize:vertical}
.authswitch{display:flex;gap:8px;margin:18px 0}
.authswitch button{flex:1}
.app{max-width:1400px;margin:auto;padding:16px}
.topbar{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:13px 16px;margin-bottom:15px}
.topactions{display:flex;align-items:center;gap:7px}
.layout{display:grid;grid-template-columns:290px minmax(0,1fr);gap:15px;min-height:calc(100vh - 110px)}
.sidebar{padding:15px;display:flex;flex-direction:column;gap:13px;min-width:0}
.sideheading{display:flex;justify-content:space-between;align-items:center;font-size:19px;font-weight:800}
.nav{display:flex;gap:6px}
.nav button{flex:1;background:#ffffff85;color:var(--muted);border-radius:11px;padding:10px 4px;font-weight:700}
.nav button.active{background:var(--a);color:white}
.chatlist{display:flex;flex-direction:column;gap:5px;overflow:auto}
.chatitem{display:flex;align-items:center;gap:10px;padding:10px;border-radius:15px;text-align:left;background:transparent;color:var(--text);width:100%}
.chatitem:hover,.chatitem.active{background:#ffffffbd}
.avatar{height:43px;width:43px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(135deg,#bdebdc,#dbe4ff);color:#246b5b;font-weight:800;flex-shrink:0;overflow:hidden}
.avatar img{height:100%;width:100%;object-fit:cover}
.chatmeta{min-width:0;flex:1}
.chatname{font-weight:750}
.preview{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:4px}
.main{display:flex;flex-direction:column;min-width:0;overflow:hidden;min-height:60vh}
.panelhead{padding:17px 20px;display:flex;justify-content:space-between;align-items:center;gap:10px;border-bottom:1px solid #ffffffb8}
.panelhead h2{font-size:19px;margin:0}
.sub{font-size:12px;color:var(--muted);margin-top:4px}
.content{padding:20px;flex:1;overflow:auto}
.empty{min-height:300px;display:grid;place-items:center;text-align:center;color:var(--muted)}
.empty svg{width:64px;height:64px;opacity:.5;margin-bottom:12px}
.messages{display:flex;flex-direction:column;gap:10px;min-height:260px}
.bubble{max-width:80%;padding:11px 14px;border-radius:17px;background:#ffffffd9;align-self:flex-start;overflow-wrap:anywhere}
.bubble.mine{align-self:flex-end;background:color-mix(in srgb,var(--a) 18%,white);border-bottom-right-radius:5px}
.bubble time{display:block;text-align:right;font-size:10px;color:var(--muted);margin-top:5px}
.composer{display:flex;gap:8px;padding:12px;border-top:1px solid #ffffffb8}
.composer input{flex:1;min-width:0}
.card{padding:17px;border-radius:18px;border:1px solid #ffffffd9;background:#ffffff83;margin-bottom:12px}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:13px 0;border-bottom:1px solid #dfeae6}
.statusgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px}
.statuscard{padding:12px;border:1px solid white;border-radius:17px;background:#ffffffad}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#18302d;color:white;padding:12px 18px;border-radius:13px;z-index:30;max-width:90vw}
footer{text-align:center;color:var(--muted);padding:15px;font-size:11px}
</style>
</head>
<body>

<!-- SVG SPRITE -->
<svg style="display:none">
  <symbol id="i-logo" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" d="M20 11.5a7.5 7.5 0 0 1-7.5 7.5H6l-3 2 1-4A7.5 7.5 0 1 1 20 11.5Z"/><path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" d="M8 11h8M8 14h5"/></symbol>
  <symbol id="i-plus" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="2" d="M12 5v14M5 12h14"/></symbol>
  <symbol id="i-settings" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="2" d="M12 15a3 3 0 1 0 0-6 3 3 0 0 0 0 6ZM19.4 15a1.65 1.65 0 0 0.33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06A1.65 1.65 0 0 0 15 19.4a1.65 1.65 0 0 0-1.6 1.65 1.65 0 0 1-2 0 1.65 1.65 0 0 0-1-.6 1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 6.6 15a1.65 1.65 0 0 0-.6-1 1.65 1.65 0 0 1 0-2c.2-.38.44-.7.6-1A1.65 1.65 0 0 0 6.27 9.2l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 11 6.6a1.65 1.65 0 0 0 1-.6 1.65 1.65 0 0 1 2 0c.4.26.7.44 1.6a1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 11c-.26.4-.44.7-.6 1a1.65 1.65 0 0 1 0 2c.2.3.4.62.6 1Z"/></symbol>
  <symbol id="i-logout" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9"/></symbol>
  <symbol id="i-refresh" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="2" d="M21 12a9 9 0 1 1-9-9c2.5 0 4.8 1 6.4 2.6L21 8V3h-5l2.6 2.6A7 7 0 1 0 21 12Z"/></symbol>
  <symbol id="i-info" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10" fill="none" stroke="currentColor" stroke-width="2"/><path fill="none" stroke="currentColor" stroke-width="2" d="M12 16v-4M12 8h.01"/></symbol>
  <symbol id="i-chat" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="2" d="M21 11.5a8.5 8.5 0 0 1-8.5 8.5H5l-3 2 1.5-4A8.5 8.5 0 0 1 21 11.5Z"/></symbol>
  <symbol id="i-send" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" d="M22 2L11 13M22 2l-7 20-4-9-9-4Z"/></symbol>
  <symbol id="i-close" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="2" d="M18 6L6 18M6 6l12 12"/></symbol>
  <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="6" fill="none" stroke="currentColor" stroke-width="2"/><path fill="none" stroke="currentColor" stroke-width="2" d="M20 20l-4.3-4.3"/></symbol>
</svg>

<section id="authView" class="auth">
 <div class="authcard glass">
  <div class="brand"><span class="logo"><svg><use href="#i-logo"/></svg></span>ChatWave</div>
  <h1 id="authTitle">Welcome back</h1>
  <p class="muted" id="authSubtitle">Sign in to continue your conversations.</p>
  <div class="authswitch"><button class="btn" id="loginTab">Sign in</button><button class="btn secondary" id="signupTab">Create account</button></div>
  <form id="authForm">
   <div class="field hidden" id="nameField"><label>Display name</label><input id="nameInput" placeholder="Your name"></div>
   <div class="field"><label>Email</label><input id="emailInput" type="email" required placeholder="you@example.com"></div>
   <div class="field"><label>Password</label><input id="passwordInput" type="password" required minlength="6" placeholder="At least 6 characters"></div>
   <button class="btn" id="authSubmit" style="width:100%"><svg width="18" height="18"><use href="#i-logo"/></svg> <span>Sign in</span></button>
  </form>
  <button class="btn secondary" id="forgotBtn" style="width:100%;margin-top:9px">Forgot password?</button>
  <p class="note" id="authMessage"></p>
 </div>
</section>

<section id="appView" class="app hidden">
 <header class="topbar glass">
  <div class="brand"><span class="logo"><svg><use href="#i-logo"/></svg></span>ChatWave</div>
  <div class="topactions"><span id="topUser"></span><button class="iconbtn" id="newChatBtn"><svg><use href="#i-plus"/></svg></button><button class="iconbtn" id="settingsBtn"><svg><use href="#i-settings"/></svg></button><button class="iconbtn" id="signOutBtn"><svg><use href="#i-logout"/></svg></button></div>
 </header>
 <div class="layout">
  <aside class="sidebar glass">
   <div class="sideheading">Messages <button id="refreshBtn" class="iconbtn"><svg><use href="#i-refresh"/></svg></button></div>
   <div style="position:relative"><svg style="position:absolute;left:12px;top:13px;width:18px;height:18px;opacity:.5"><use href="#i-search"/></svg><input id="searchInput" class="search" style="padding-left:38px" placeholder="Search conversations…"></div>
   <nav class="nav"><button class="active" data-view="chats">Chats</button><button data-view="status">Status</button><button data-view="profile">Profile</button></nav>
   <div id="chatList" class="chatlist"></div>
  </aside>
  <main class="main glass">
   <div class="panelhead" id="mainHeader"><div><h2>Welcome to ChatWave</h2><div class="sub">Connect. Chat. Share.</div></div></div>
   <div class="content" id="mainContent"><div class="empty"><div><svg><use href="#i-chat"/></svg><h2>Your conversations start here</h2><p>Choose a chat or start a new one.</p><button class="btn" id="startChatBtn"><svg><use href="#i-plus"/></svg> Start a chat</button></div></div></div>
   <form id="composer" class="composer hidden"><input id="messageInput" maxlength="4000" placeholder="Write a message…"><button class="btn"><svg width="18" height="18"><use href="#i-send"/></svg> Send</button></form>
  </main>
 </div>
</section>

<div id="modal" class="modal hidden"><div class="modalbox glass"><div style="display:flex;justify-content:space-between;align-items:center"><h2 id="modalTitle">ChatWave</h2><button class="iconbtn" id="modalClose"><svg><use href="#i-close"/></svg></button></div><div id="modalBody"></div></div></div>
<div id="toast" class="toast hidden"></div>

<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/11.6.0/firebase-app.js";
import {getAuth,createUserWithEmailAndPassword,signInWithEmailAndPassword,signOut,onAuthStateChanged,updateProfile,sendEmailVerification,sendPasswordResetEmail} from "https://www.gstatic.com/firebasejs/11.6.0/firebase-auth.js";
import {getFirestore,collection,doc,setDoc,getDoc,getDocs,addDoc,query,where,orderBy,limit,onSnapshot,serverTimestamp,deleteDoc} from "https://www.gstatic.com/firebasejs/11.6.0/firebase-firestore.js";

const firebaseConfig={
 apiKey:"AIzaSyCOfNfS3DMUMSRHJpyW_tpSIjwFymrTt7w",
 authDomain:"chat-2c557.firebaseapp.com",
 projectId:"chat-2c557",
 storageBucket:"chat-2c557.firebasestorage.app",
 messagingSenderId:"74313204354",
 appId:"1:74313204354:web:c735269d502b88a39eea9b"
};

const app=initializeApp(firebaseConfig);
const auth=getAuth(app);
const db=getFirestore(app);
const $=id=>document.getElementById(id);
const esc=v=>String(v??"").replace(/[&<>"']/g,c=>({"&":"&lt;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
let user=null,profile={},mode="login",activeChat=null,stopChats=null,stopMessages=null,stopStatuses=null,chats=[],accent=localStorage.getItem("cw_accent")||"#16a085";
document.documentElement.style.setProperty("--a",accent);
if(localStorage.getItem("cw_dark")==="1")document.body.classList.add("dark");

function notify(m){$("toast").textContent=m;$("toast").classList.remove("hidden");clearTimeout(window.cwTimer);window.cwTimer=setTimeout(()=>$("toast").classList.add("hidden"),3500);}
function errText(e){return e.code?({"auth/email-already-in-use":"That email already has an account.","auth/invalid-credential":"Email or password incorrect."}[e.code]||e.message):e.message;}
function makeChatId(a,b){return [a,b].sort().join("_")}
function avatar(p={},name="User"){return `<div class="avatar">${p.photoURL?`<img src="${esc(p.photoURL)}">`:esc((name||"U")[0].toUpperCase())}</div>`;}
function setMode(next){mode=next;const s=mode==="signup";$("authTitle").textContent=s?"Create your account":"Welcome back";$("nameField").classList.toggle("hidden",!s);$("authSubmit").querySelector("span").textContent=s?"Create account":"Sign in";$("loginTab").className=s?"btn secondary":"btn";$("signupTab").className=s?"btn":"btn secondary";}
$("loginTab").onclick=()=>setMode("login");$("signupTab").onclick=()=>setMode("signup");
$("authForm").addEventListener("submit",async e=>{
 e.preventDefault();const b=$("authSubmit");b.disabled=true;
 try{
  const email=$("emailInput").value.trim(),password=$("passwordInput").value;
  if(mode==="signup"){
   const name=$("nameInput").value.trim();if(!name)throw new Error("Enter display name");
   const cred=await createUserWithEmailAndPassword(auth,email,password);
   await updateProfile(cred.user,{displayName:name});
   await setDoc(doc(db,"users",cred.user.uid),{uid:cred.user.uid,name,email,createdAt:serverTimestamp(),lastSeen:serverTimestamp()});
  }else await signInWithEmailAndPassword(auth,email,password);
 }catch(e){$("authMessage").textContent=errText(e);}finally{b.disabled=false;}
});
$("forgotBtn").onclick=async()=>{const email=$("emailInput").value.trim();if(!email)return notify("Enter email first");try{await sendPasswordResetEmail(auth,email);notify("Reset email sent");}catch(e){notify(errText(e));}};
$("signOutBtn").onclick=()=>signOut(auth);
$("refreshBtn").onclick=()=>loadChats();
$("newChatBtn").onclick=openNewChat;
$("startChatBtn").onclick=openNewChat;
$("settingsBtn").onclick=renderSettings;
$("searchInput").addEventListener("input",renderChatList);
$("modalClose").onclick=()=>{$("modal").classList.add("hidden");};
$("modal").addEventListener("click",e=>{if(e.target===$("modal"))$("modal").classList.add("hidden");});
document.querySelectorAll("[data-view]").forEach(b=>b.onclick=()=>{
 document.querySelectorAll("[data-view]").forEach(x=>x.classList.remove("active"));b.classList.add("active");
 if(b.dataset.view==="chats")renderHome();if(b.dataset.view==="status")renderStatus();if(b.dataset.view==="profile")renderProfile();
});
onAuthStateChanged(auth,async u=>{
 user=u;if(stopChats)stopChats();if(stopMessages)stopMessages();if(stopStatuses)stopStatuses();
 if(!u){$("authView").classList.remove("hidden");$("appView").classList.add("hidden");return;}
 try{
  const snap=await getDoc(doc(db,"users",u.uid));profile=snap.exists()?snap.data():{uid:u.uid,name:u.displayName||"User",email:u.email||""};
  if(!snap.exists())await setDoc(doc(db,"users",u.uid),{...profile,createdAt:serverTimestamp()},{merge:true});
  $("topUser").textContent=profile.name||u.displayName||"My account";$("authView").classList.add("hidden");$("appView").classList.remove("hidden");renderHome();loadChats();
 }catch(e){notify(errText(e));}
});
function renderHome(){
 $("composer").classList.add("hidden");
 $("mainHeader").innerHTML="<div><h2>Welcome to ChatWave</h2><div class='sub'>Select a conversation</div></div>";
 $("mainContent").innerHTML='<div class="empty"><div><svg><use href="#i-chat"/></svg><h2>Your conversations start here</h2><p>Chat with other registered users.</p><button class="btn" id="homeNewChat"><svg width="18" height="18"><use href="#i-plus"/></svg> Start a chat</button></div></div>';
 $("homeNewChat").onclick=openNewChat;
}
async function loadChats(){
 if(!user)return;
 const q=query(collection(db,"chats"),where("members","array-contains",user.uid));
 stopChats=onSnapshot(q,async snap=>{
  const result=await Promise.all(snap.docs.map(async d=>{
   const data=d.data(),other=(data.members||[]).find(id=>id!==user.uid);if(!other)return null;
   const us=await getDoc(doc(db,"users",other));return {id:d.id,...data,other,user:us.exists()?us.data():{uid:other,name:"ChatWave user",email:""}};
  }));chats=result.filter(Boolean);renderChatList();
 });
}
function renderChatList(){
 const needle=$("searchInput").value.trim().toLowerCase();
 const filtered=chats.filter(c=>(c.user.name||"").toLowerCase().includes(needle));
 $("chatList").innerHTML=filtered.length?"":'<p class="muted">No conversations</p>';
 filtered.forEach(c=>{
  const b=document.createElement("button");b.className="chatitem"+(activeChat?.id===c.id?" active":"");
  b.innerHTML=`${avatar(c.user,c.user.name)}<div class="chatmeta"><div class="chatname">${esc(c.user.name)}</div><div class="preview">${esc(c.user.email||"Open")}</div></div>`;
  b.onclick=()=>openChat(c);$("chatList").appendChild(b);
 });
}
async function openNewChat(){
 $("modalTitle").textContent="Start a conversation";$("modalBody").innerHTML=`<form id="findUserForm"><div class="field"><label>Find by exact email</label><input id="findUserEmail" type="email" required placeholder="friend@example.com"></div><button class="btn" style="width:100%"><svg width="18" height="18"><use href="#i-search"/></svg> Find user</button></form>`;$("modal").classList.remove("hidden");
 $("findUserForm").onsubmit=async e=>{
  e.preventDefault();const email=$("findUserEmail").value.trim().toLowerCase();
  const snap=await getDocs(query(collection(db,"users"),where("email","==",email),limit(1)));
  if(snap.empty)return notify("No account found");
  const other=snap.docs[0].data();if(other.uid===user.uid)return notify("Cannot chat with yourself");
  const id=makeChatId(user.uid,other.uid);await setDoc(doc(db,"chats",id),{members:[user.uid,other.uid],updatedAt:serverTimestamp()},{merge:true});
  $("modal").classList.add("hidden");openChat({id,members:[user.uid,other.uid],other:other.uid,user:other});
 };
}
function openChat(chat){
 activeChat=chat;renderChatList();
 $("mainHeader").innerHTML=`<div style="display:flex;align-items:center;gap:10px">${avatar(chat.user,chat.user.name)}<div><h2>${esc(chat.user.name)}</h2><div class="sub">${esc(chat.user.email)}</div></div></div><button class="iconbtn" id="chatInfoBtn"><svg><use href="#i-info"/></svg></button>`;
 $("mainContent").innerHTML='<div id="messages" class="messages"><p class="muted">Loading…</p></div>';$("composer").classList.remove("hidden");
 if(stopMessages)stopMessages();
 const q=query(collection(db,"chats",chat.id,"messages"),orderBy("createdAt","asc"),limit(200));
 stopMessages=onSnapshot(q,snap=>{
  const box=$("messages");box.innerHTML="";if(snap.empty){box.innerHTML='<p class="muted">Say hello</p>';return;}
  snap.forEach(d=>{
   const m=d.data(),mine=m.senderId===user.uid;const el=document.createElement("div");el.className="bubble"+(mine?" mine":"");
   el.innerHTML=`${esc(m.text)}<time>${m.createdAt?.toDate?m.createdAt.toDate().toLocaleTimeString([],{hour:"2-digit",minute:"2-digit"}):"…"}</time>`;box.appendChild(el);
  });box.scrollTop=box.scrollHeight;
 });
}
$("composer").addEventListener("submit",async e=>{
 e.preventDefault();if(!activeChat)return;const input=$("messageInput"),text=input.value.trim();if(!text)return;input.value="";
 await addDoc(collection(db,"chats",activeChat.id,"messages"),{text,senderId:user.uid,createdAt:serverTimestamp()});
 await setDoc(doc(db,"chats",activeChat.id),{members:[user.uid,activeChat.other],updatedAt:serverTimestamp(),lastMessage:text},{merge:true});
});
function renderProfile(){
 $("composer").classList.add("hidden");$("mainHeader").innerHTML="<div><h2>My profile</h2></div>";
 $("mainContent").innerHTML=`<div class="card"><div style="display:flex;gap:12px;align-items:center">${avatar(profile,profile.name)}<div><h2>${esc(profile.name)}</h2><div class="muted">${esc(user.email)}</div></div></div><div class="field"><label>Display name</label><input id="profileName" value="${esc(profile.name)}"></div><button class="btn" id="saveProfile"><svg width="18" height="18"><use href="#i-send"/></svg> Save profile</button></div>`;
 $("saveProfile").onclick=async()=>{
  const name=$("profileName").value.trim();if(!name)return notify("Enter name");
  await updateProfile(user,{displayName:name});await setDoc(doc(db,"users",user.uid),{name,lastSeen:serverTimestamp()},{merge:true});$("topUser").textContent=name;notify("Profile updated");
 };
}
function renderSettings(){
 $("composer").classList.add("hidden");$("mainHeader").innerHTML="<div><h2>Settings</h2></div>";
 $("mainContent").innerHTML=`<div class="card"><h3>Account</h3><div style="display:flex;gap:8px"><button class="btn secondary" id="resetPw">Reset Password</button><button class="btn secondary" id="signOutSet"><svg width="18" height="18"><use href="#i-logout"/></svg> Sign out</button></div></div>`;
 $("resetPw").onclick=async()=>{await sendPasswordResetEmail(auth,user.email);notify("Reset email sent");};$("signOutSet").onclick=()=>signOut(auth);
}
function renderStatus(){
 $("composer").classList.add("hidden");$("mainHeader").innerHTML="<div><h2>Status</h2></div><button class='btn' id='addStatus'><svg width='18' height='18'><use href='#i-plus'/></svg> Add status</button>";
 $("mainContent").innerHTML='<div id="statusGrid" class="statusgrid"></div>';$("addStatus").onclick=()=>{
  $("modalTitle").textContent="Create status";$("modalBody").innerHTML=`<form id="statusForm"><div class="field"><textarea id="statusText" maxlength="500" required placeholder="Write status…"></textarea></div><button class="btn" style="width:100%">Post</button></form>`;$("modal").classList.remove("hidden");
  $("statusForm").onsubmit=async e=>{e.preventDefault();const text=$("statusText").value.trim();if(!text)return;await addDoc(collection(db,"statuses"),{uid:user.uid,name:profile.name,text,createdAt:serverTimestamp(),expiresAt:new Date(Date.now()+86400000)});$("modal").classList.add("hidden");notify("Status posted");};
 };
 if(stopStatuses)stopStatuses();stopStatuses=onSnapshot(query(collection(db,"statuses"),orderBy("createdAt","desc"),limit(50)),snap=>{
  const grid=$("statusGrid");grid.innerHTML="";snap.docs.forEach(d=>{
   const s={id:d.id,...d.data()};const card=document.createElement("div");card.className="card";card.innerHTML=`<b>${esc(s.name)}</b><p>${esc(s.text)}</p><div class="sub">${s.createdAt?.toDate?s.createdAt.toDate().toLocaleString():"Just now"}</div>${s.uid===user.uid?`<button class="btn secondary" data-del="${s.id}" style="margin-top:8px"><svg width="16" height="16"><use href="#i-close"/></svg> Delete</button>`:""}`;grid.appendChild(card);
   card.querySelector("[data-del]")?.addEventListener("click",async()=>{await deleteDoc(doc(db,"statuses",s.id));});
  });
 });
}
</script>
</body>
</html>
