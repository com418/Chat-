<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#07111f">
<title>ChatWave — Connect. Chat. Share.</title>

<style>
:root {
  --bg:#07111f;
  --glass:rgba(255,255,255,.075);
  --glass2:rgba(255,255,255,.045);
  --border:rgba(255,255,255,.13);
  --text:#f5f7ff;
  --muted:#9aa9c0;
  --accent:#67e8f9;
  --green:#42e8a3;
  --danger:#ff647c;
  --radius:22px;
}
*{box-sizing:border-box}
body{
  margin:0;min-height:100vh;color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  background:
   radial-gradient(ellipse at 10% 0%,#153e58 0,transparent 40%),
   radial-gradient(ellipse at 100% 90%,#242052 0,transparent 42%),
   var(--bg);
}
button,input,textarea{font:inherit}
button{cursor:pointer}
button:disabled{opacity:.5;cursor:not-allowed}
svg{width:21px;height:21px;fill:none;stroke:currentColor;
stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.glass{
 background:var(--glass);border:1px solid var(--border);
 backdrop-filter:blur(28px);-webkit-backdrop-filter:blur(28px);
 box-shadow:0 12px 40px #0002;
}
.hidden{display:none!important}
.muted{color:var(--muted)}
.small{font-size:12px}
.primary{
 background:linear-gradient(135deg,#67e8f9,#42e8a3);
 color:#06151b;border:0;font-weight:750;
}
.btn{
 border:1px solid var(--border);border-radius:14px;padding:12px 15px;
 color:var(--text);background:var(--glass);
 display:inline-flex;align-items:center;justify-content:center;gap:8px;
}
.btn.primary{border:0}
.field{
 width:100%;padding:14px 15px;border-radius:14px;
 background:rgba(0,0,0,.2);border:1px solid var(--border);
 color:var(--text);outline:none;margin-top:7px;
}
.field:focus{border-color:var(--accent)}
label{display:block;font-size:13px;color:var(--muted);margin:15px 0}
a{color:var(--accent)}
#toast{
 position:fixed;bottom:25px;left:50%;transform:translateX(-50%);
 z-index:50;background:#172637;border:1px solid var(--border);
 border-radius:14px;padding:13px 18px;max-width:90vw;
 box-shadow:0 10px 35px #0005;
}
.brand{display:flex;align-items:center;gap:11px;font-size:23px;font-weight:800}
.brand-mark{
 width:43px;height:43px;border-radius:15px;display:grid;place-items:center;
 color:#07111f;background:linear-gradient(135deg,#67e8f9,#42e8a3);
}
.brand-mark svg{width:25px;height:25px}
#auth{
 min-height:100vh;display:grid;place-items:center;padding:22px;
}
.auth-card{width:min(440px,100%);padding:30px;border-radius:28px}
.auth-card h1{font-size:29px;margin:26px 0 7px}
.auth-card .submit{width:100%;margin-top:18px;padding:15px}
.auth-switch{display:flex;gap:10px;margin-top:22px}
.auth-switch button{flex:1}
#app{min-height:100vh;padding:16px}
.app-shell{
 width:min(1500px,100%);height:calc(100dvh - 32px);min-height:570px;
 margin:auto;border-radius:28px;overflow:hidden;display:grid;
 grid-template-columns:300px minmax(0,1fr);
}
.sidebar{
 display:flex;flex-direction:column;min-width:0;
 border-right:1px solid var(--border);background:var(--glass2);
}
.side-head{padding:20px 17px 13px}
.side-brand{display:flex;align-items:center;justify-content:space-between}
.icon-btn{
 width:41px;height:41px;border-radius:14px;display:grid;place-items:center;
 border:1px solid var(--border);background:var(--glass);color:var(--text);
}
.search{margin-top:17px}
.tabs{display:flex;gap:6px;padding:0 14px 12px}
.tab{flex:1;border:0;border-radius:12px;padding:10px 3px;
 background:transparent;color:var(--muted);font-size:12px}
.tab.active{background:rgba(103,232,249,.12);color:var(--accent)}
.list{overflow-y:auto;flex:1}
.person{
 display:flex;gap:11px;align-items:center;padding:14px 16px;
 border-bottom:1px solid #ffffff0a;cursor:pointer;min-width:0;
}
.person:hover,.person.selected{background:rgba(103,232,249,.08)}
.avatar{
 width:45px;height:45px;flex-shrink:0;border-radius:50%;
 display:grid;place-items:center;font-weight:800;
 background:linear-gradient(135deg,#215e77,#4b3d78);
 color:white;overflow:hidden;
}
.avatar img{width:100%;height:100%;object-fit:cover}
.person-info{min-width:0;flex:1}
.person-name{font-weight:650;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.person-last{font-size:12px;color:var(--muted);margin-top:5px;
 overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.side-foot{padding:13px;border-top:1px solid var(--border);
 display:flex;align-items:center;gap:10px}
.side-foot .who{flex:1;min-width:0}
.main{min-width:0;display:flex;flex-direction:column}
.topbar{
 height:75px;padding:13px 19px;border-bottom:1px solid var(--border);
 display:flex;align-items:center;gap:12px;
}
.top-info{flex:1;min-width:0}
.top-info strong{display:block;overflow:hidden;text-overflow:ellipsis}
.top-actions{display:flex;gap:8px}
.content{flex:1;min-height:0;display:flex;flex-direction:column}
.welcome{margin:auto;text-align:center;padding:30px;max-width:470px}
.welcome .hero-icon{
 width:90px;height:90px;border-radius:30px;display:grid;place-items:center;
 margin:0 auto 25px;background:var(--glass);border:1px solid var(--border);
 color:var(--accent);
}
.welcome .hero-icon svg{width:45px;height:45px}
.messages{
 flex:1;overflow-y:auto;padding:22px;
 display:flex;flex-direction:column;gap:12px;
}
.day-label{text-align:center;font-size:11px;color:var(--muted);margin:8px}
.bubble{
 max-width:min(76%,560px);width:fit-content;padding:11px 13px;
 border-radius:18px;background:rgba(255,255,255,.08);
 border:1px solid var(--border);overflow-wrap:anywhere;
}
.bubble.mine{
 align-self:flex-end;background:rgba(66,232,163,.13);
 border-color:rgba(66,232,163,.2);border-bottom-right-radius:5px;
}
.bubble.theirs{align-self:flex-start;border-bottom-left-radius:5px}
.bubble small{display:block;color:var(--muted);font-size:10px;margin-top:7px;text-align:right}
.composer{
 padding:13px 17px calc(13px + env(safe-area-inset-bottom));
 display:flex;align-items:flex-end;gap:9px;border-top:1px solid var(--border);
}
.composer textarea{
 flex:1;resize:none;max-height:130px;min-height:45px;
 padding:13px 15px;border-radius:17px;background:var(--glass2);
 border:1px solid var(--border);color:var(--text);outline:none;
}
.composer .send{height:45px;width:48px;border-radius:16px}
.panel{padding:23px;overflow:auto}
.panel h2{margin-top:0}
.panel-card{padding:18px;border-radius:19px;margin:15px 0}
.status-item{padding:15px 0;border-bottom:1px solid var(--border)}
.status-item p{white-space:pre-wrap;overflow-wrap:anywhere}
#mobileBack{display:none}
@media(max-width:760px){
 #app{padding:0}
 .app-shell{height:100dvh;min-height:0;border-radius:0;grid-template-columns:1fr}
 .sidebar{border-right:0}
 .main{display:none}
 .app-shell.chat-open .sidebar{display:none}
 .app-shell.chat-open .main{display:flex}
 #mobileBack{display:grid}
 .auth-card{padding:25px}
 .topbar{height:68px;padding:10px 12px}
 .messages{padding:15px}
 .composer{padding:10px 10px calc(10px + env(safe-area-inset-bottom))}
 .bubble{max-width:88%}
}
</style>
</head>

<body>
<svg xmlns="http://www.w3.org/2000/svg" style="display:none">
 <symbol id="i-chat" viewBox="0 0 24 24"><path d="M21 11.5a8.4 8.4 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.4 8.4 0 0 1-3.8-.9L3 21l1.9-5.7a8.4 8.4 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.4 8.4 0 0 1 3.8-.9h.5a8.5 8.5 0 0 1 8 8z"/></symbol>
 <symbol id="i-send" viewBox="0 0 24 24"><path d="m22 2-7 20-4-9-9-4Z"/><path d="M22 2 11 13"/></symbol>
 <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
 <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></symbol>
 <symbol id="i-settings" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="m19.4 15 .1.1 1.4 1.1-1.5 2.6-1.7-.6a8 8 0 0 1-1.8 1l-.3 1.8h-3l-.3-1.8a8 8 0 0 1-1.8-1l-1.7.6-1.5-2.6 1.4-1.1a8 8 0 0 1 0-2l-1.4-1.1 1.5-2.6 1.7.6a8 8 0 0 1 1.8-1l.3-1.8h3l.3 1.8a8 8 0 0 1 1.8 1l1.7-.6 1.5 2.6-1.4 1.1a8 8 0 0 1 0 2Z"/></symbol>
 <symbol id="i-back" viewBox="0 0 24 24"><path d="m15 18-6-6 6-6"/></symbol>
 <symbol id="i-logout" viewBox="0 0 24 24"><path d="M10 17l5-5-5-5M15 12H3"/><path d="M12 3h7a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-7"/></symbol>
 <symbol id="i-refresh" viewBox="0 0 24 24"><path d="M20 7v5h-5M4 17v-5h5"/><path d="M5.6 9a7 7 0 0 1 11.6-2L20 12M4 12l2.8 5a7 7 0 0 0 11.6-2"/></symbol>
 <symbol id="i-close" viewBox="0 0 24 24"><path d="m18 6-12 12M6 6l12 12"/></symbol>
</svg>

<div id="auth">
 <div class="auth-card glass">
  <div class="brand"><span class="brand-mark"><svg><use href="#i-chat"/></svg></span>ChatWave</div>
  <h1 id="authTitle">Welcome back</h1>
  <p class="muted" id="authSubtitle">Sign in to continue your conversations.</p>
  <form id="authForm">
   <div id="nameWrap" class="hidden">
    <label>Your name<input id="displayName" class="field" maxlength="50" autocomplete="name" placeholder="Your name"></label>
   </div>
   <label>Email address<input id="email" class="field" type="email" required autocomplete="email" placeholder="you@example.com"></label>
   <label>Password<input id="password" class="field" type="password" required minlength="6" autocomplete="current-password" placeholder="At least 6 characters"></label>
   <button id="authSubmit" class="btn primary submit" type="submit">Sign in</button>
  </form>
  <div class="auth-switch">
   <button id="toggleAuth" class="btn" type="button">Create account</button>
   <button id="forgotBtn" class="btn" type="button">Forgot password?</button>
  </div>
  <p class="small muted">Your account uses Firebase Authentication.</p>
 </div>
</div>

<div id="app" class="hidden">
 <div class="app-shell glass" id="shell">
  <aside class="sidebar">
   <div class="side-head">
    <div class="side-brand">
     <div class="brand"><span class="brand-mark"><svg><use href="#i-chat"/></svg></span>ChatWave</div>
     <button class="icon-btn" id="newChatBtn" title="Start a chat"><svg><use href="#i-plus"/></svg></button>
    </div>
    <input id="searchChats" class="field search" placeholder="Search conversations...">
   </div>
   <div class="tabs">
    <button class="tab active" data-view="chats">Chats</button>
    <button class="tab" data-view="statuses">Statuses</button>
    <button class="tab" data-view="settings">Settings</button>
   </div>
   <div id="chatList" class="list"></div>
   <div class="side-foot">
    <div class="avatar" id="myAvatar">C</div>
    <div class="who"><div id="myName" class="person-name">My account</div><div id="myEmail" class="person-last"></div></div>
    <button class="icon-btn" id="signOutBtn" title="Sign out"><svg><use href="#i-logout"/></svg></button>
   </div>
  </aside>

  <main class="main">
   <header class="topbar">
    <button class="icon-btn" id="mobileBack" aria-label="Back"><svg><use href="#i-back"/></svg></button>
    <div class="avatar hidden" id="chatAvatar">C</div>
    <div class="top-info"><strong id="topTitle">ChatWave</strong><span class="small muted" id="topSubtitle">Connect. Chat. Share.</span></div>
    <div class="top-actions"><button class="icon-btn" id="refreshBtn" title="Refresh"><svg><use href="#i-refresh"/></svg></button></div>
   </header>
   <section class="content" id="content">
    <div class="welcome">
     <div class="hero-icon"><svg><use href="#i-chat"/></svg></div>
     <h2>Your conversations, together.</h2>
     <p class="muted">Start a chat with someone using their registered email address.</p>
     <button class="btn primary" id="welcomeNewChat"><svg><use href="#i-plus"/></svg> Start a conversation</button>
    </div>
   </section>
  </main>
 </div>
</div>
<div id="toast" class="hidden" role="status"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.0/firebase-app.js";
import {
 getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword,
 onAuthStateChanged, signOut, updateProfile, sendPasswordResetEmail
} from "https://www.gstatic.com/firebasejs/11.6.0/firebase-auth.js";
import {
 getFirestore, doc, setDoc, getDoc, collection, query, where,
 orderBy, limit, onSnapshot, addDoc, serverTimestamp, updateDoc,
 getDocs
} from "https://www.gstatic.com/firebasejs/11.6.0/firebase-firestore.js";

/* YOUR FIREBASE CONFIG */
const firebaseConfig = {
 apiKey: "AIzaSyCOfnS3DMUSR-HJpyW_tpSIjwFymrTt7w",
 authDomain: "chat-2c557.firebaseapp.com",
 projectId: "chat-2c557",
 storageBucket: "chat-2c557.firebasestorage.app",
 messagingSenderId: "74313204354",
 appId: "1:74313204354:web:c735269d502b88a39eea9b"
};

const firebaseApp = initializeApp(firebaseConfig);
const auth = getAuth(firebaseApp);
const db = getFirestore(firebaseApp);

const $ = id => document.getElementById(id);
const icon = name => `<svg><use href="#i-${name}"></use></svg>`;
const esc = value => String(value ?? "").replace(/[&<>"']/g, c => ({
 "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
}[c]));
let user = null, registering = false, activeChat = null;
let people = new Map(), chats = new Map(), unsubs = [];
let toastTimer, currentView = "chats", statusCache = [];

function toast(message) {
 const el = $("toast");
 el.textContent = message;
 el.classList.remove("hidden");
 clearTimeout(toastTimer);
 toastTimer = setTimeout(() => el.classList.add("hidden"), 4200);
}
function cleanListeners() {
 unsubs.forEach(fn => { try { fn(); } catch {} });
 unsubs = [];
}
function initials(name="C") {
 return name.trim().split(/\s+/).slice(0,2).map(s=>s[0]||"").join("").toUpperCase() || "C";
}
function showAuth() {
 $("auth").classList.remove("hidden");
 $("app").classList.add("hidden");
}
function showApp() {
 $("auth").classList.add("hidden");
 $("app").classList.remove("hidden");
}
function authMode(value) {
 registering = value;
 $("authTitle").textContent = value ? "Create your account" : "Welcome back";
 $("authSubtitle").textContent = value ? "Join ChatWave and start connecting." : "Sign in to continue your conversations.";
 $("authSubmit").textContent = value ? "Create account" : "Sign in";
 $("toggleAuth").textContent = value ? "I have an account" : "Create account";
 $("nameWrap").classList.toggle("hidden", !value);
 $("displayName").required = value;
 $("password").autocomplete = value ? "new-password" : "current-password";
}
$("toggleAuth").addEventListener("click", () => authMode(!registering));

$("authForm").addEventListener("submit", async e => {
 e.preventDefault();
 const button = $("authSubmit");
 if (button.disabled) return;
 const email = $("email").value.trim().toLowerCase();
 const password = $("password").value;
 const name = $("displayName").value.trim();
 if (registering && !name) return toast("Please enter your name.");
 button.disabled = true;
 button.textContent = registering ? "Creating account..." : "Signing in...";
 try {
  if (registering) {
   const credential = await createUserWithEmailAndPassword(auth, email, password);
   if (name) await updateProfile(credential.user, {displayName:name});
   try {
    await setDoc(doc(db,"users",credential.user.uid), {
     uid:credential.user.uid, name:name || "ChatWave User",
     email, createdAt:serverTimestamp(), updatedAt:serverTimestamp()
    });
   } catch (err) {
    console.error("User profile document could not be saved:", err);
    toast("Account created. Profile setup needs a Firestore permissions check.");
    return;
   }
   toast("Account created successfully!");
  } else {
   await signInWithEmailAndPassword(auth,email,password);
  }
 } catch(err) {
  console.error(err);
  const messages = {
   "auth/email-already-in-use":"This email already has an account. Try signing in.",
   "auth/invalid-email":"Please enter a valid email address.",
   "auth/weak-password":"Choose a password with at least 6 characters.",
   "auth/invalid-credential":"Incorrect email or password.",
   "auth/network-request-failed":"Network error. Check your internet connection.",
   "auth/too-many-requests":"Too many attempts. Please wait and try again.",
   "permission-denied":"Firestore permission denied. Check your Firebase rules."
  };
  toast(messages[err.code] || err.message || "Something went wrong.");
 } finally {
  button.disabled = false;
  button.textContent = registering ? "Create account" : "Sign in";
 }
});

$("forgotBtn").addEventListener("click", async () => {
 const email = $("email").value.trim();
 if (!email) return toast("Enter your email address first.");
 try {
  await sendPasswordResetEmail(auth,email);
  toast("Password reset email sent. Check your inbox.");
 } catch(err) { toast(err.message); }
});

onAuthStateChanged(auth, async currentUser => {
 cleanListeners();
 user = currentUser;
 activeChat = null;
 if (!user) { showAuth(); return; }
 showApp();
 $("myName").textContent = user.displayName || user.email.split("@")[0];
 $("myEmail").textContent = user.email || "";
 $("myAvatar").textContent = initials(user.displayName || user.email);
 try {
  await setDoc(doc(db,"users",user.uid), {
   uid:user.uid, email:user.email,
   name:user.displayName || user.email.split("@")[0],
   updatedAt:serverTimestamp()
  },{merge:true});
 } catch(err) { console.error("Profile sync:",err); }
 subscribeChats();
 renderWelcome();
});

$("signOutBtn").addEventListener("click", async () => {
 try { await signOut(auth); toast("Signed out."); }
 catch(err) { toast(err.message); }
});

function subscribeChats() {
 const q = query(collection(db,"chats"),where("members","array-contains",user.uid));
 unsubs.push(onSnapshot(q, snapshot => {
  chats.clear();
  snapshot.forEach(d => chats.set(d.id,{id:d.id,...d.data()}));
  renderChatList();
 }, err => {
  console.error(err);
  toast("Unable to load chats. Check Firestore permissions.");
 }));
}

function renderChatList() {
 const filter = $("searchChats").value.trim().toLowerCase();
 const entries = [...chats.values()].filter(c => {
  const otherId = (c.members || []).find(id => id !== user.uid);
  const p = people.get(otherId);
  return !filter || (p?.name || "").toLowerCase().includes(filter) ||
   (p?.email || "").toLowerCase().includes(filter) ||
   (c.lastMessage || "").toLowerCase().includes(filter);
 }).sort((a,b) => (b.updatedAt?.seconds || 0) - (a.updatedAt?.seconds || 0));

 const list = $("chatList");
 if (!entries.length) {
  list.innerHTML = `<div class="panel muted small">${filter ? "No matching conversations." : "No chats yet. Tap + to start one."}</div>`;
  return;
 }
 list.innerHTML = entries.map(c => {
  const otherId = (c.members || []).find(id => id !== user.uid);
  const p = people.get(otherId) || {name:c.memberNames?.[otherId] || "Chat member",email:""};
  return `<div class="person ${activeChat?.id===c.id?"selected":""}" data-chat="${esc(c.id)}">
   <div class="avatar">${esc(initials(p.name))}</div>
   <div class="person-info"><div class="person-name">${esc(p.name)}</div>
   <div class="person-last">${esc(c.lastMessage || p.email || "Start a conversation")}</div></div>
  </div>`;
 }).join("");
 list.querySelectorAll("[data-chat]").forEach(el => el.addEventListener("click",()=>openChat(el.dataset.chat)));
}
$("searchChats").addEventListener("input",renderChatList);

async function startChat() {
 if (!user) return;
 const email = prompt("Enter the exact email address registered on ChatWave:");
 if (!email) return;
 const targetEmail = email.trim().toLowerCase();
 if (targetEmail === user.email.toLowerCase()) return toast("You cannot start a chat with yourself.");
 try {
  const q = query(collection(db,"users"),where("email","==",targetEmail),limit(1));
  const result = await getDocs(q);
  if (result.empty) return toast("No ChatWave account found with that email.");
  const target = result.docs[0].data();
  if (!target.uid) return toast("That user profile is incomplete.");
  people.set(target.uid,target);
  const members = [user.uid,target.uid].sort();
  const chatId = members.join("_");
  const ref = doc(db,"chats",chatId);
  const existing = await getDoc(ref);
  if (!existing.exists()) {
   await setDoc(ref,{
    members,
    memberNames:{
     [user.uid]:user.displayName || user.email,
     [target.uid]:target.name || target.email
    },
    lastMessage:"",createdAt:serverTimestamp(),updatedAt:serverTimestamp()
   });
  }
  await openChat(chatId);
 } catch(err) {
  console.error(err);
  toast("Could not start chat: " + err.message);
 }
}
$("newChatBtn").addEventListener("click",startChat);
$("welcomeNewChat").addEventListener("click",startChat);

function renderWelcome() {
 activeChat = null;
 $("shell").classList.remove("chat-open");
 $("topTitle").textContent = "ChatWave";
 $("topSubtitle").textContent = "Connect. Chat. Share.";
 $("chatAvatar").classList.add("hidden");
 $("content").innerHTML = `<div class="welcome">
  <div class="hero-icon">${icon("chat")}</div>
  <h2>Your conversations, together.</h2>
  <p class="muted">Start a chat with someone using their registered email address.</p>
  <button class="btn primary" id="welcomeNewChat2">${icon("plus")} Start a conversation</button>
 </div>`;
 $("welcomeNewChat2").addEventListener("click",startChat);
 renderChatList();
}

async function openChat(chatId) {
 const chat = chats.get(chatId);
 if (!chat) return toast("Chat is still loading. Try again.");
 const otherId = (chat.members || []).find(id => id !== user.uid);
 let person = people.get(otherId);
 if (!person) {
  try {
   const p = await getDoc(doc(db,"users",otherId));
   if (p.exists()) person = p.data();
  } catch(err) { console.error(err); }
 }
 person ||= {name:chat.memberNames?.[otherId] || "Chat member",email:""};
 people.set(otherId,person);
 activeChat = {id:chatId,otherId,person};
 $("shell").classList.add("chat-open");
 $("chatAvatar").classList.remove("hidden");
 $("chatAvatar").textContent = initials(person.name);
 $("topTitle").textContent = person.name || "Chat member";
 $("topSubtitle").textContent = person.email || "ChatWave conversation";
 $("content").innerHTML = `<div class="messages" id="messages"><div class="muted small">Loading messages...</div></div>
 <form class="composer" id="messageForm">
  <textarea id="messageInput" rows="1" maxlength="5000" placeholder="Write a message..." required></textarea>
  <button class="btn primary send" type="submit" aria-label="Send message">${icon("send")}</button>
 </form>`;
 $("messageForm").addEventListener("submit",sendMessage);
 const input = $("messageInput");
 input.addEventListener("input",()=>{input.style.height="auto";input.style.height=Math.min(input.scrollHeight,130)+"px";});
 const messageQuery = query(collection(db,"chats",chatId,"messages"),orderBy("createdAt","asc"),limit(300));
 const stop = onSnapshot(messageQuery, snapshot => {
  const box = $("messages");
  if (!box || activeChat?.id !== chatId) return;
  if (snapshot.empty) {
   box.innerHTML = `<div class="muted small" style="text-align:center;margin:auto">Say hello 👋</div>`;
   return;
  }
  box.innerHTML = snapshot.docs.map(d => {
   const m = d.data();
   const mine = m.senderId === user.uid;
   const time = m.createdAt?.toDate ? m.createdAt.toDate().toLocaleTimeString([], {hour:"2-digit",minute:"2-digit"}) : "Sending…";
   return `<div class="bubble ${mine?"mine":"theirs"}">${esc(m.text).replace(/\n/g,"<br>")}<small>${esc(time)}</small></div>`;
  }).join("");
  box.scrollTop = box.scrollHeight;
 }, err => {
  console.error(err);
  toast("Unable to load messages. Check Firestore permissions.");
 });
 unsubs.push(stop);
 renderChatList();
}

async function sendMessage(e) {
 e.preventDefault();
 if (!activeChat || !user) return;
 const input = $("messageInput");
 const text = input.value.trim();
 if (!text) return;
 const chatId = activeChat.id;
 const button = $("messageForm").querySelector("button");
 button.disabled = true;
 input.disabled = true;
 try {
  await addDoc(collection(db,"chats",chatId,"messages"),{
   text,senderId:user.uid,createdAt:serverTimestamp()
  });
  await updateDoc(doc(db,"chats",chatId),{
   lastMessage:text.slice(0,150),updatedAt:serverTimestamp()
  });
  input.value = "";
  input.style.height = "auto";
 } catch(err) {
  console.error(err);
  toast("Message not sent: " + err.message);
 } finally {
  button.disabled = false;
  input.disabled = false;
  input.focus();
 }
}

$("mobileBack").addEventListener("click",renderWelcome);
$("refreshBtn").addEventListener("click",async()=>{
 if (activeChat) await openChat(activeChat.id);
 else renderWelcome();
});

document.querySelectorAll("[data-view]").forEach(button => {
 button.addEventListener("click",()=> {
  currentView = button.dataset.view;
  document.querySelectorAll("[data-view]").forEach(b=>b.classList.toggle("active",b===button));
  if (currentView==="chats") renderWelcome();
  if (currentView==="statuses") renderStatuses();
  if (currentView==="settings") renderSettings();
 });
});

async function renderStatuses() {
 activeChat = null;
 $("shell").classList.remove("chat-open");
 $("topTitle").textContent = "Statuses";
 $("topSubtitle").textContent = "Share a quick update";
 $("chatAvatar").classList.add("hidden");
 $("content").innerHTML = `<div class="panel"><h2>My status</h2>
  <form id="statusForm" class="panel-card glass">
   <label>What's happening?<textarea class="field" id="statusText" rows="3" maxlength="500" required placeholder="Share an update..."></textarea></label>
   <button class="btn primary" type="submit">Post status</button>
  </form>
  <h3>Recent statuses</h3><div id="statusList" class="panel-card glass">Loading statuses...</div></div>`;
 $("statusForm").addEventListener("submit",async e=>{
  e.preventDefault();
  const text=$("statusText").value.trim();
  if(!text)return;
  try {
   await addDoc(collection(db,"statuses"),{
    uid:user.uid,name:user.displayName||user.email,text,createdAt:serverTimestamp()
   });
   $("statusText").value="";
   toast("Status posted!");
  } catch(err){toast("Could not post status: "+err.message);}
 });
 const q=query(collection(db,"statuses"),orderBy("createdAt","desc"),limit(50));
 const stop=onSnapshot(q,snap=>{
  statusCache=snap.docs.map(d=>({id:d.id,...d.data()}));
  const list=$("statusList");
  if(!list)return;
  list.innerHTML=statusCache.map(s=>{
   const time=s.createdAt?.toDate?s.createdAt.toDate().toLocaleString():"Just now";
   return `<div class="status-item"><strong>${esc(s.name||"ChatWave user")}</strong>
    <div class="small muted">${esc(time)}</div><p>${esc(s.text)}</p>
    ${s.uid===user.uid?`<button class="btn" data-delete-status="${esc(s.id)}">${icon("close")} Delete</button>`:""}
   </div>`;
  }).join("") || `<p class="muted">No statuses yet. Post the first one.</p>`;
  list.querySelectorAll("[data-delete-status]").forEach(b=>b.addEventListener("click",async()=>{
   try {
    const {deleteDoc}=await import("https://www.gstatic.com/firebasejs/11.6.0/firebase-firestore.js");
    await deleteDoc(doc(db,"statuses",b.dataset.deleteStatus));
    toast("Status deleted.");
   }catch(err){toast("Could not delete status: "+err.message);}
  }));
 },err=>{console.error(err);toast("Could not load statuses: "+err.message);});
 unsubs.push(stop);
}

function renderSettings() {
 activeChat=null;
 $("shell").classList.remove("chat-open");
 $("topTitle").textContent="Settings";
 $("topSubtitle").textContent="Manage your account";
 $("chatAvatar").classList.add("hidden");
 $("content").innerHTML=`<div class="panel">
  <h2>Profile and settings</h2>
  <div class="panel-card glass">
   <div class="avatar" style="width:65px;height:65px">${esc(initials(user.displayName||user.email))}</div>
   <p class="muted">${esc(user.email)}</p>
   <form id="profileForm">
    <label>Display name<input class="field" id="profileName" maxlength="50" value="${esc(user.displayName||"")} " required></label>
    <button class="btn primary" type="submit">Save profile</button>
   </form>
  </div>
  <div class="panel-card glass">
   <h3>Security</h3>
   <p class="muted small">Send a password reset link to your email.</p>
   <button class="btn" id="resetPassword">Reset password</button>
   <button class="btn" id="settingsSignOut">${icon("logout")} Sign out</button>
  </div>
  <p class="muted small">ChatWave prototype. Do not use it for sensitive conversations until security rules and privacy features have been properly configured.</p>
 </div>`;
 $("profileName").value=user.displayName||"";
 $("profileForm").addEventListener("submit",async e=>{
  e.preventDefault();
  const name=$("profileName").value.trim();
  if(!name)return toast("Enter a display name.");
  try{
   await updateProfile(user,{displayName:name});
   await setDoc(doc(db,"users",user.uid),{name,updatedAt:serverTimestamp()},{merge:true});
   $("myName").textContent=name;
   $("myAvatar").textContent=initials(name);
   toast("Profile updated.");
  }catch(err){toast("Could not update profile: "+err.message);}
 });
 $("resetPassword").addEventListener("click",async()=>{
  try{await sendPasswordResetEmail(auth,user.email);toast("Password reset email sent.");}
  catch(err){toast(err.message);}
 });
 $("settingsSignOut").addEventListener("click",()=>signOut(auth));
}

authMode(false);
</script>
</body>
</html>
