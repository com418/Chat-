
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#07111f">
<title>ChatWave</title>
<style>
:root{
 --bg:#07111f;--panel:rgba(255,255,255,.07);
 --border:rgba(255,255,255,.13);--text:#f5f7ff;
 --muted:#9aa9c0;--accent:#67e8f9;--green:#42e8a3
}
*{box-sizing:border-box}
body{margin:0;background:radial-gradient(ellipse at 10% 0%,#153e58,transparent 40%),radial-gradient(ellipse at 100% 100%,#29204f,transparent 45%),var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
body.light{--bg:#eaf0f7;--panel:rgba(255,255,255,.7);--border:rgba(30,50,70,.15);--text:#172538;--muted:#617187}
button,input,textarea,select{font:inherit}
button{cursor:pointer;color:inherit}
button:disabled{opacity:.5}
svg{width:21px;height:21px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.hidden{display:none!important}
.muted{color:var(--muted)}
.small{font-size:12px}
.glass{background:var(--panel);border:1px solid var(--border);backdrop-filter:blur(28px);-webkit-backdrop-filter:blur(28px);box-shadow:0 12px 40px #0002}
.btn,.icon-btn{border:1px solid var(--border);background:var(--panel);border-radius:14px;padding:12px 15px;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.icon-btn{width:43px;height:43px;padding:0;flex-shrink:0}
.primary{background:linear-gradient(135deg,var(--accent),var(--green));color:#07151b;border:0;font-weight:750}
.field{display:block;width:100%;padding:13px 14px;margin-top:7px;border-radius:13px;background:#00000015;border:1px solid var(--border);color:var(--text);outline:none}
label{display:block;color:var(--muted);font-size:13px;margin:14px 0}
.brand{display:flex;align-items:center;gap:10px;font-size:22px;font-weight:800;min-width:0}
.logo{width:42px;height:42px;border-radius:15px;display:grid;place-items:center;background:linear-gradient(135deg,var(--accent),var(--green));color:#07151b;flex-shrink:0}
#auth{min-height:100dvh;display:grid;place-items:center;padding:20px}
.auth-card{width:min(440px,100%);padding:27px;border-radius:27px}
.auth-card h1{margin-top:25px}
.submit{width:100%;margin-top:14px}
.auth-actions{display:flex;gap:9px;margin-top:15px}
.auth-actions button{flex:1}
#app{padding:14px;min-height:100dvh}
.shell{width:min(1500px,100%);height:calc(100dvh - 28px);min-height:560px;margin:auto;border-radius:26px;overflow:hidden;display:grid;grid-template-columns:290px minmax(0,1fr)}
.sidebar{display:flex;flex-direction:column;min-width:0;border-right:1px solid var(--border)}
.side-head{padding:17px 14px 12px}
.side-brand{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:12px}
.tabs{display:flex;gap:5px;padding:0 12px 12px}
.tab{flex:1;padding:10px 2px;border:0;border-radius:12px;background:transparent;color:var(--muted);font-size:12px}
.tab.active{background:#67e8f921;color:var(--accent)}
.list{flex:1;overflow:auto;min-height:0}
.person{display:flex;align-items:center;gap:11px;padding:13px;border-bottom:1px solid #ffffff0a;cursor:pointer}
.person:hover,.person.selected{background:#67e8f912}
.avatar{width:43px;height:43px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(135deg,#215e77,#4b3d78);flex-shrink:0;font-weight:750}
.person-info{min-width:0;flex:1}
.person-name{font-weight:650;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.person-last{font-size:12px;color:var(--muted);margin-top:4px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.new-chat-footer{padding:12px;border-top:1px solid var(--border)}
.new-chat-footer button{width:100%}
.side-foot{padding:12px;display:flex;align-items:center;gap:9px;border-top:1px solid var(--border)}
.side-foot .who{flex:1;min-width:0}
.main{display:flex;flex-direction:column;min-width:0;min-height:0}
.topbar{height:72px;display:flex;align-items:center;gap:12px;padding:12px 17px;border-bottom:1px solid var(--border);flex-shrink:0}
.top-info{flex:1;min-width:0}
.top-info strong{display:block}
.content{flex:1;min-height:0;overflow:auto}
.welcome{text-align:center;margin:auto;padding:30px;max-width:480px}
.hero{width:86px;height:86px;border-radius:28px;display:grid;place-items:center;margin:0 auto 22px;background:var(--panel);color:var(--accent);border:1px solid var(--border)}
.hero svg{width:42px;height:42px}
.messages{height:calc(100% - 70px);overflow:auto;padding:20px;display:flex;flex-direction:column;gap:12px}
.bubble{max-width:82%;width:fit-content;padding:11px 13px;border:1px solid var(--border);background:var(--panel);border-radius:17px;overflow-wrap:anywhere}
.bubble.mine{align-self:flex-end;border-color:#42e8a34d;background:#42e8a31c}
.bubble small{display:block;text-align:right;font-size:10px;color:var(--muted);margin-top:6px}
.composer{display:flex;gap:8px;padding:10px;border-top:1px solid var(--border)}
.composer textarea{flex:1;min-width:0;resize:none;border:1px solid var(--border);border-radius:15px;padding:12px;background:var(--panel);color:var(--text)}
.panel{padding:22px;max-width:850px;margin:auto}
.panel h2{margin-top:0}
.section-title{font-size:12px;text-transform:uppercase;letter-spacing:1.3px;color:var(--accent);margin:22px 0 9px}
.setting-row{display:flex;align-items:center;gap:13px;padding:15px;border-bottom:1px solid var(--border)}
.setting-icon{width:40px;height:40px;flex-shrink:0;border-radius:13px;background:var(--panel);display:grid;place-items:center}
.setting-copy{flex:1;min-width:0}
.setting-copy strong{display:block;font-size:14px}
.setting-copy p{margin:5px 0 0;font-size:12px;color:var(--muted);line-height:1.5}
.setting-row input[type=checkbox]{width:20px;height:20px;accent-color:#42e8a3}
.setting-row select{max-width:145px;background:var(--bg);color:var(--text);border:1px solid var(--border);padding:8px;border-radius:10px}
.card{padding:17px;border-radius:18px;margin:12px 0}
#toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:#172637;color:white;padding:13px 17px;border-radius:14px;z-index:20;max-width:90vw}
@media(max-width:720px){
 #app{padding:0}
 .shell{height:100dvh;min-height:0;border-radius:0;grid-template-columns:1fr}
 .main{display:none}
 .shell.chat-open .sidebar{display:none}
 .shell.chat-open .main{display:flex}
 .topbar{height:65px}
 .panel{padding:17px}
 .auth-card{padding:23px}
}
@media(min-width:721px){.shell{grid-template-columns:290px minmax(0,1fr)}}
</style>
</head>
<body>

<svg style="display:none" xmlns="http://www.w3.org/2000/svg">
 <symbol id="chat" viewBox="0 0 24 24"><path d="M21 11.5a8.5 8.5 0 0 1-12.3 7.6L3 21l1.9-5.7A8.5 8.5 0 1 1 21 11.5Z"/></symbol>
 <symbol id="user" viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></symbol>
 <symbol id="lock" viewBox="0 0 24 24"><rect x="4" y="10" width="16" height="11" rx="2"/><path d="M8 10V6a4 4 0 0 1 8 0v4"/></symbol>
 <symbol id="bell" viewBox="0 0 24 24"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9M10 21h4"/></symbol>
 <symbol id="palette" viewBox="0 0 24 24"><path d="M12 3a9 9 0 1 0 0 18h1a2 2 0 0 0 1.5-3.3A2 2 0 0 1 16 14h2a4 4 0 0 0 4-4c0-4-4.5-7-10-7Z"/><path d="M7 10h.01M10 7h.01M15 7h.01M18 10h.01"/></symbol>
 <symbol id="database" viewBox="0 0 24 24"><ellipse cx="12" cy="5" rx="9" ry="3"/><path d="M3 5v14c0 1.7 4 3 9 3s9-1.3 9-3V5M3 12c0 1.7 4 3 9 3s9-1.3 9-3"/></symbol>
 <symbol id="shield" viewBox="0 0 24 24"><path d="M12 22s8-4 8-11V5l-8-3-8 3v6c0 7 8 11 8 11Z"/><path d="m9 12 2 2 4-4"/></symbol>
 <symbol id="plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
 <symbol id="send" viewBox="0 0 24 24"><path d="m22 2-7 20-4-9-9-4Z"/><path d="M22 2 11 13"/></symbol>
 <symbol id="back" viewBox="0 0 24 24"><path d="m15 18-6-6 6-6"/></symbol>
 <symbol id="logout" viewBox="0 0 24 24"><path d="M10 17l5-5-5-5M15 12H3"/><path d="M12 3h7a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-7"/></symbol>
</svg>

<div id="auth">
 <div class="auth-card glass">
  <div class="brand"><span class="logo"><svg><use href="#chat"/></svg></span>ChatWave</div>
  <h1 id="authTitle">Welcome back</h1>
  <p class="muted" id="authDesc">Sign in to continue.</p>
  <form id="authForm">
   <div id="nameWrap" class="hidden"><label>Your name<input class="field" id="name" maxlength="50" autocomplete="name"></label></div>
   <label>Email address<input class="field" id="email" type="email" required autocomplete="email"></label>
   <label>Password<input class="field" id="password" type="password" minlength="6" required autocomplete="current-password"></label>
   <button class="btn primary submit" id="authSubmit">Sign in</button>
  </form>
  <div class="auth-actions"><button class="btn" id="toggle">Create account</button><button class="btn" id="forgot">Forgot password?</button></div>
 </div>
</div>

<div id="app" class="hidden">
 <div class="shell glass" id="shell">
  <aside class="sidebar">
   <div class="side-head">
    <div class="side-brand">
     <div class="brand"><span class="logo"><svg><use href="#chat"/></svg></span>ChatWave</div>
     <button class="icon-btn" id="settingsTop" title="Settings" aria-label="Settings"><svg><use href="#palette"/></svg></button>
    </div>
    <input class="field" id="search" placeholder="Search conversations...">
   </div>

   <div class="tabs">
    <button class="tab active" data-view="chats">Chats</button>
    <button class="tab" data-view="statuses">Statuses</button>
    <button class="tab" data-view="settings">Settings</button>
   </div>

   <div class="list" id="chatList"></div>

   <div class="new-chat-footer">
    <button class="btn primary" id="newChat"><svg><use href="#plus"/></svg>New Chat</button>
   </div>

   <div class="side-foot">
    <div class="avatar" id="myAvatar">C</div>
    <div class="who"><div class="person-name" id="myName">My account</div><div class="person-last" id="myEmail"></div></div>
    <button class="icon-btn" id="logout" title="Sign out"><svg><use href="#logout"/></svg></button>
   </div>
  </aside>

  <main class="main">
   <header class="topbar">
    <button class="icon-btn hidden" id="back"><svg><use href="#back"/></svg></button>
    <div class="avatar hidden" id="chatAvatar">C</div>
    <div class="top-info"><strong id="topTitle">ChatWave</strong><span class="small muted" id="topSubtitle">Connect. Chat. Share.</span></div>
   </header>
   <section class="content" id="content"></section>
  </main>
 </div>
</div>
<div id="toast" class="hidden"></div>

<script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/11.6.0/firebase-app.js";
import{getAuth,createUserWithEmailAndPassword,signInWithEmailAndPassword,onAuthStateChanged,signOut,updateProfile,sendPasswordResetEmail}from"https://www.gstatic.com/firebasejs/11.6.0/firebase-auth.js";
import{getFirestore,doc,setDoc,getDoc,collection,query,where,orderBy,limit,onSnapshot,addDoc,serverTimestamp,updateDoc,getDocs,deleteDoc}from"https://www.gstatic.com/firebasejs/11.6.0/firebase-firestore.js";

const firebaseConfig={
 apiKey:"AIzaSyCOfNfS3DMUMSRHJpyW_tpSIjwFymrTt7w",
 authDomain:"chat-2c557.firebaseapp.com",
 databaseURL:"https://chat-2c557-default-rtdb.firebaseio.com",
 projectId:"chat-2c557",
 storageBucket:"chat-2c557.firebasestorage.app",
 messagingSenderId:"74313204354",
 appId:"1:74313204354:web:c735269d502b88a39eea9b"
};
const app=initializeApp(firebaseConfig),auth=getAuth(app),db=getFirestore(app);
const $=id=>document.getElementById(id);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const icon=id=>`<svg><use href="#${id}"/></svg>`;
const initials=s=>String(s||"C").trim().split(/\s+/).slice(0,2).map(x=>x[0]||"").join("").toUpperCase()||"C";
let user=null,registering=false,activeChat=null,chats=new Map(),people=new Map(),stops=[];

function toast(s){$("toast").textContent=s;$("toast").classList.remove("hidden");setTimeout(()=>$("toast").classList.add("hidden"),4000)}
function cleanup(){stops.forEach(f=>{try{f()}catch{}});stops=[]}
function listen(f){stops.push(f)}

function mode(create){
 registering=create;
 $("authTitle").textContent=create?"Create your account":"Welcome back";
 $("authDesc").textContent=create?"Join ChatWave and connect.":"Sign in to continue.";
 $("authSubmit").textContent=create?"Create account":"Sign in";
 $("toggle").textContent=create?"I have an account":"Create account";
 $("nameWrap").classList.toggle("hidden",!create);
 $("name").required=create;
 $("password").autocomplete=create?"new-password":"current-password";
}
$("toggle").onclick=()=>mode(!registering);

$("authForm").onsubmit=async e=>{
 e.preventDefault();
 const b=$("authSubmit");if(b.disabled)return;
 b.disabled=true;
 const wasRegistering=registering;
 b.textContent=wasRegistering?"Creating account...":"Signing in...";
 const email=$("email").value.trim().toLowerCase(),password=$("password").value,name=$("name").value.trim();
 try{
  if(wasRegistering){
   const c=await createUserWithEmailAndPassword(auth,email,password);
   if(name)await updateProfile(c.user,{displayName:name});
   await setDoc(doc(db,"users",c.user.uid),{uid:c.user.uid,name:name||email.split("@")[0],email,createdAt:serverTimestamp()},{merge:true});
   toast("Account created.");
  }else{
   await signInWithEmailAndPassword(auth,email,password);
  }
 }catch(e){
  console.error(e);
  toast(e.code==="auth/api-key-not-valid"?"Firebase rejected the API key. Check the Firebase web app configuration and API key restrictions.":e.code==="auth/email-already-in-use"?"Email already registered. Sign in instead.":e.code==="auth/invalid-credential"?"Incorrect email or password.":e.message);
 }finally{
  b.disabled=false;b.textContent=registering?"Create account":"Sign in";
 }
};

$("forgot").onclick=async()=>{
 const e=$("email").value.trim();
 if(!e)return toast("Enter your email first.");
 try{await sendPasswordResetEmail(auth,e);toast("Password reset email sent.");}
 catch(x){toast(x.message);}
};
$("logout").onclick=()=>signOut(auth);

onAuthStateChanged(auth,async u=>{
 cleanup();user=u;activeChat=null;
 if(!u){$("auth").classList.remove("hidden");$("app").classList.add("hidden");return;}
 $("auth").classList.add("hidden");$("app").classList.remove("hidden");
 $("myName").textContent=u.displayName||u.email.split("@")[0];
 $("myEmail").textContent=u.email;
 $("myAvatar").textContent=initials(u.displayName||u.email);
 try{await setDoc(doc(db,"users",u.uid),{uid:u.uid,email:u.email,name:u.displayName||u.email.split("@")[0]},{merge:true});}
 catch(e){console.error(e);}
 listen(onSnapshot(query(collection(db,"chats"),where("members","array-contains",u.uid)),s=>{
  chats.clear();s.forEach(d=>chats.set(d.id,{id:d.id,...d.data()}));renderChats();
 },e=>toast("Chat permissions error: "+e.message)));
 welcome();
});

function renderChats(){
 const q=$("search").value.toLowerCase();
 const list=[...chats.values()].filter(c=>{
  const id=(c.members||[]).find(x=>x!==user.uid),p=people.get(id);
  return !q||(p?.name||"").toLowerCase().includes(q)||(p?.email||"").toLowerCase().includes(q)||(c.lastMessage||"").toLowerCase().includes(q);
 }).sort((a,b)=>(b.updatedAt?.seconds||0)-(a.updatedAt?.seconds||0));
 $("chatList").innerHTML=list.length?list.map(c=>{
  const id=(c.members||[]).find(x=>x!==user.uid),p=people.get(id)||{name:c.memberNames?.[id]||"Chat member"};
  return `<div class="person ${activeChat?.id===c.id?"selected":""}" data-id="${esc(c.id)}"><div class="avatar">${esc(initials(p.name))}</div><div class="person-info"><div class="person-name">${esc(p.name)}</div><div class="person-last">${esc(c.lastMessage||"Start a conversation")}</div></div></div>`;
 }).join(""):'<div class="panel muted small">No chats yet. Tap New Chat to start one.</div>';
 $("chatList").querySelectorAll("[data-id]").forEach(el=>el.onclick=()=>openChat(el.dataset.id));
}
$("search").oninput=renderChats;

async function startChat(){
 const email=prompt("Enter the other user's registered email:");
 if(!email)return;
 try{
  const s=await getDocs(query(collection(db,"users"),where("email","==",email.trim().toLowerCase()),limit(1)));
  if(s.empty)return toast("No ChatWave user found.");
  const p=s.docs[0].data();
  if(p.uid===user.uid)return toast("You cannot chat with yourself.");
  people.set(p.uid,p);
  const members=[user.uid,p.uid].sort(),id=members.join("_"),r=doc(db,"chats",id);
  if(!(await getDoc(r)).exists()){
   await setDoc(r,{members,memberNames:{[user.uid]:user.displayName||user.email,[p.uid]:p.name||p.email},lastMessage:"",createdAt:serverTimestamp(),updatedAt:serverTimestamp()});
  }
  await openChat(id);
 }catch(e){console.error(e);toast("Could not start chat: "+e.message);}
}
$("newChat").onclick=startChat;

function showView(view){
 document.querySelectorAll("[data-view]").forEach(b=>b.classList.toggle("active",b.dataset.view===view));
 if(view==="chats")welcome();
 if(view==="settings")settings();
 if(view==="statuses")statuses();
}
document.querySelectorAll("[data-view]").forEach(b=>b.onclick=()=>showView(b.dataset.view));
$("settingsTop").onclick=()=>showView("settings");

function welcome(){
 activeChat=null;
 $("shell").classList.remove("chat-open");
 $("back").classList.add("hidden");
 $("chatAvatar").classList.add("hidden");
 $("topTitle").textContent="ChatWave";
 $("topSubtitle").textContent="Connect. Chat. Share.";
 $("content").innerHTML=`<div class="welcome"><div class="hero">${icon("chat")}</div><h2>Your conversations, together.</h2><p class="muted">Start a conversation with another ChatWave user.</p><button class="btn primary" id="startWelcome">${icon("plus")} New chat</button></div>`;
 $("startWelcome").onclick=startChat;
 renderChats();
}

async function openChat(id){
 const c=chats.get(id);if(!c)return;
 cleanup();
 const other=(c.members||[]).find(x=>x!==user.uid);
 let p=people.get(other);
 try{if(!p){const s=await getDoc(doc(db,"users",other));if(s.exists())p=s.data();}}
 catch(e){}
 p||={name:c.memberNames?.[other]||"Chat member"};
 people.set(other,p);activeChat={id,other,person:p};
 $("shell").classList.add("chat-open");
 $("back").classList.remove("hidden");
 $("chatAvatar").classList.remove("hidden");
 $("chatAvatar").textContent=initials(p.name);
 $("topTitle").textContent=p.name;
 $("topSubtitle").textContent=p.email||"ChatWave contact";
 $("content").innerHTML=`<div class="messages" id="messages"></div><form class="composer" id="sendForm"><textarea id="msg" rows="1" maxlength="5000" required placeholder="Write a message..."></textarea><button class="btn primary" type="submit">${icon("send")}</button></form>`;
 $("sendForm").onsubmit=async e=>{
  e.preventDefault();const text=$("msg").value.trim();if(!text)return;
  try{
   await addDoc(collection(db,"chats",id,"messages"),{text,senderId:user.uid,createdAt:serverTimestamp(),deliveredTo:[],readBy:[user.uid]});
   await updateDoc(doc(db,"chats",id),{lastMessage:text.slice(0,150),updatedAt:serverTimestamp()});
   $("msg").value="";
  }catch(x){toast("Message not sent: "+x.message);}
 };
 listen(onSnapshot(query(collection(db,"chats",id,"messages"),orderBy("createdAt","asc"),limit(300)),async s=>{
  if(activeChat?.id!==id)return;
  const box=$("messages");
  box.innerHTML=s.docs.map(d=>{
   const m=d.data(),mine=m.senderId===user.uid;
   const tm=m.createdAt?.toDate?m.createdAt.toDate().toLocaleTimeString([],{hour:"2-digit",minute:"2-digit"}):"Sending";
   const receipt=mine?((m.readBy||[]).includes(other)?" · Read ✓✓":(m.deliveredTo||[]).includes(other)?" · Delivered ✓✓":" · Sent ✓"):"";
   return `<div class="bubble ${mine?"mine":""}">${esc(m.text).replace(/\n/g,"<br>")}<small>${esc(tm+receipt)}</small></div>`;
  }).join("");
  box.scrollTop=box.scrollHeight;
  for(const d of s.docs){
   const m=d.data();if(m.senderId===user.uid)continue;
   try{
    const updates={};
    if(!(m.deliveredTo||[]).includes(user.uid))updates.deliveredTo=[...(m.deliveredTo||[]),user.uid];
    if(!(m.readBy||[]).includes(user.uid))updates.readBy=[...(m.readBy||[]),user.uid];
    if(Object.keys(updates).length)await updateDoc(doc(db,"chats",id,"messages",d.id),updates);
   }catch(e){console.error("Receipt update",e);}
  }
 },e=>toast("Message permissions error: "+e.message)));
}
$("back").onclick=welcome;

function row(symbol,title,description,control){
 return `<div class="setting-row"><div class="setting-icon">${icon(symbol)}</div><div class="setting-copy"><strong>${title}</strong><p>${description}</p></div>${control||""}</div>`;
}

function settings(){
 cleanup();
 activeChat=null;
 $("shell").classList.remove("chat-open");
 $("back").classList.add("hidden");
 $("chatAvatar").classList.add("hidden");
 $("topTitle").textContent="Settings";
 $("topSubtitle").textContent="Your account, your preferences";
 $("content").innerHTML=`<div class="panel">
 <div class="card glass"><div class="avatar" style="width:60px;height:60px">${esc(initials(user.displayName||user.email))}</div><h2>${esc(user.displayName||"ChatWave user")}</h2><p class="muted">${esc(user.email)}</p><p class="small muted">Manage your profile and preferences.</p></div>

 <div class="section-title">Account</div><div class="card glass">
 ${row("user","Profile","Change your display name and About information.",'<button class="btn" id="editProfile">Edit</button>')}
 <div id="profileEditor" class="hidden"><form id="profileForm"><label>Display name<input class="field" id="profileName" maxlength="50" required></label><label>About<input class="field" id="about" maxlength="139" placeholder="Hey there! I am using ChatWave."></label><button class="btn primary">Save profile</button></form></div>
 ${row("lock","Password","Request a password reset email.",'<button class="btn" id="passwordReset">Reset</button>')}
 </div>

 <div class="section-title">Privacy</div><div class="card glass">
 ${row("user","Last seen","Choose who can see your last-seen time.",'<select id="lastSeen"><option value="everyone">Everyone</option><option value="nobody">Nobody</option></select>')}
 ${row("user","Online status","Choose who can see your online status.",'<select id="onlinePrivacy"><option value="everyone">Everyone</option><option value="nobody">Nobody</option></select>')}
 ${row("shield","Read receipts","Show read receipts in conversations.",'<input id="readReceipts" type="checkbox" checked>')}
 <p class="small muted">Privacy selections need backend enforcement before they can restrict visibility for other users.</p>
 </div>

 <div class="section-title">Security</div><div class="card glass">
 ${row("shield","Two-step verification","Protect your account with a second authentication factor.",'<button class="btn primary" id="twoStep">Set up</button>')}
 <div id="mfaInfo" class="small muted" style="padding:10px">Two-step verification is not enabled.</div>
 <div id="mfaHelp" class="hidden"><p>Real two-factor authentication requires Firebase Authentication multi-factor enrollment and a supported second factor. This panel does not activate it by itself.</p><button class="btn" id="mfaLearn">View setup requirements</button></div>
 </div>

 <div class="section-title">Notifications</div><div class="card glass">
 ${row("bell","Browser notifications","Request permission for browser notifications.",'<button class="btn" id="notify">Enable</button>')}
 ${row("bell","Message sounds","Enable or disable notification sounds.",'<input type="checkbox" id="sound" checked>')}
 </div>

 <div class="section-title">Appearance</div><div class="card glass">
 ${row("palette","Theme","Choose your preferred appearance.",'<select id="theme"><option value="dark">Dark glass</option><option value="light">Light glass</option></select>')}
 ${row("palette","Accent color","Choose the main interface color.",'<select id="accent"><option value="#67e8f9">Ocean cyan</option><option value="#b69cff">Lavender</option><option value="#ff92b7">Rose</option><option value="#42e8a3">Mint green</option></select>')}
 </div>

 <div class="section-title">Chats and data</div><div class="card glass">
 ${row("database","Storage and data","View chat data information.",'<button class="btn" id="dataInfo">View</button>')}
 ${row("shield","Account security","Sign out of your account.",'<button class="btn" id="signOutSettings">Sign out</button>')}
 </div>
 <p class="small muted">ChatWave prototype. Configure secure Firestore rules before using it for private conversations.</p>
 </div>`;

 const profile=doc(db,"users",user.uid);
 $("editProfile").onclick=()=>{
  $("profileEditor").classList.toggle("hidden");
  $("profileName").value=user.displayName||"";
  getDoc(profile).then(s=>{$("about").value=s.data()?.about||""}).catch(()=>{});
 };
 $("profileForm").onsubmit=async e=>{
  e.preventDefault();
  const name=$("profileName").value.trim(),about=$("about").value.trim();
  if(!name)return;
  try{
   await updateProfile(user,{displayName:name});
   await setDoc(profile,{name,about},{merge:true});
   $("myName").textContent=name;$("myAvatar").textContent=initials(name);
   toast("Profile updated.");settings();
  }catch(x){toast(x.message);}
 };
 $("passwordReset").onclick=async()=>{
  try{await sendPasswordResetEmail(auth,user.email);toast("Password reset email sent.");}
  catch(x){toast(x.message);}
 };
 $("lastSeen").value=localStorage.getItem("cw_lastSeen")||"everyone";
 $("onlinePrivacy").value=localStorage.getItem("cw_onlinePrivacy")||"everyone";
 $("readReceipts").checked=localStorage.getItem("cw_readReceipts")!=="false";
 $("lastSeen").onchange=e=>{localStorage.setItem("cw_lastSeen",e.target.value);savePrivacy();};
 $("onlinePrivacy").onchange=e=>{localStorage.setItem("cw_onlinePrivacy",e.target.value);savePrivacy();};
 $("readReceipts").onchange=e=>{localStorage.setItem("cw_readReceipts",e.target.checked);savePrivacy();};
 $("theme").value=localStorage.getItem("cw_theme")||"dark";
 $("theme").onchange=e=>{localStorage.setItem("cw_theme",e.target.value);document.body.classList.toggle("light",e.target.value==="light");};
 $("accent").value=localStorage.getItem("cw_accent")||"#67e8f9";
 $("accent").onchange=e=>{localStorage.setItem("cw_accent",e.target.value);document.documentElement.style.setProperty("--accent",e.target.value);};
 document.body.classList.toggle("light",$("theme").value==="light");
 document.documentElement.style.setProperty("--accent",$("accent").value);
 $("sound").checked=localStorage.getItem("cw_sound")!=="false";
 $("sound").onchange=e=>localStorage.setItem("cw_sound",e.target.checked);
 $("notify").onclick=async()=>{
  if(!("Notification"in window))return toast("This browser does not support notifications.");
  try{const r=await Notification.requestPermission();toast(r==="granted"?"Notifications enabled for this page.":"Notification permission was not granted.");}
  catch(e){toast(e.message);}
 };
 $("twoStep").onclick=()=>{
  $("mfaHelp").classList.toggle("hidden");
  $("mfaInfo").textContent="Setup required: Firebase multi-factor authentication must be configured before two-step verification can be activated.";
  $("twoStep").textContent=$("mfaHelp").classList.contains("hidden")?"Set up":"Hide details";
 };
 $("mfaLearn").onclick=()=>window.open("https://firebase.google.com/docs/auth/web/multi-factor","_blank","noopener");
 $("dataInfo").onclick=()=>toast("Chat history is stored in Firebase. Export and deletion tools are not configured yet.");
 $("signOutSettings").onclick=()=>signOut(auth);
}

async function savePrivacy(){
 try{
  await setDoc(doc(db,"users",user.uid),{privacy:{
   lastSeen:localStorage.getItem("cw_lastSeen")||"everyone",
   online:localStorage.getItem("cw_onlinePrivacy")||"everyone",
   readReceipts:localStorage.getItem("cw_readReceipts")!=="false"
  }},{merge:true});
  toast("Privacy preferences saved.");
 }catch(e){toast("Could not save preferences: "+e.message);}
}

function statuses(){
 cleanup();activeChat=null;
 $("shell").classList.remove("chat-open");
 $("back").classList.add("hidden");$("chatAvatar").classList.add("hidden");
 $("topTitle").textContent="Statuses";$("topSubtitle").textContent="Share a quick update";
 $("content").innerHTML=`<div class="panel"><h2>My status</h2><div class="card glass"><form id="statusForm"><label>What's happening?<textarea class="field" id="statusText" maxlength="500" required></textarea></label><button class="btn primary">Post status</button></form></div><div id="statusList" class="card glass">Loading statuses...</div></div>`;
 $("statusForm").onsubmit=async e=>{
  e.preventDefault();
  try{await addDoc(collection(db,"statuses"),{uid:user.uid,name:user.displayName||user.email,text:$("statusText").value.trim(),createdAt:serverTimestamp()});$("statusText").value="";toast("Status posted.");}
  catch(x){toast(x.message);}
 };
 listen(onSnapshot(query(collection(db,"statuses"),orderBy("createdAt","desc"),limit(50)),s=>{
  $("statusList").innerHTML=s.docs.map(d=>{
   const v=d.data();
   return `<div class="setting-row"><div class="setting-copy"><strong>${esc(v.name||"ChatWave user")}</strong><p>${esc(v.text)}</p></div>${v.uid===user.uid?`<button class="btn" data-del="${esc(d.id)}">Delete</button>`:""}</div>`;
  }).join("")||"No statuses yet.";
  $("statusList").querySelectorAll("[data-del]").forEach(b=>b.onclick=async()=>{
   try{await deleteDoc(doc(db,"statuses",b.dataset.del));toast("Status deleted.");}
   catch(e){toast(e.message);}
  });
 },e=>toast("Status permissions error: "+e.message)));
}
mode(false);
</script>
</body>
</html>
