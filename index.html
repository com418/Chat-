
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#07111f">
<title>ChatWave — Connect. Chat. Share.</title>
<style>
:root{
 --bg:#07111f;--glass:rgba(255,255,255,.075);
 --border:rgba(255,255,255,.13);--text:#f5f7ff;
 --muted:#9aa9c0;--accent:#67e8f9;--green:#42e8a3;
}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;color:var(--text);
 font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
 background:radial-gradient(ellipse at 10% 0%,#153e58,transparent 40%),
 radial-gradient(ellipse at 100% 90%,#242052,transparent 42%),var(--bg)}
button,input,textarea{font:inherit}
button{cursor:pointer;color:inherit}
button:disabled{opacity:.55;cursor:wait}
svg{width:21px;height:21px;fill:none;stroke:currentColor;stroke-width:1.8;
 stroke-linecap:round;stroke-linejoin:round}
.hidden{display:none!important}
.muted{color:var(--muted)}.small{font-size:12px}
.glass{background:var(--glass);border:1px solid var(--border);
 backdrop-filter:blur(28px);-webkit-backdrop-filter:blur(28px);
 box-shadow:0 12px 40px #0002}
.btn,.icon-btn{border:1px solid var(--border);background:var(--glass);
 border-radius:14px;padding:12px 15px;display:inline-flex;
 align-items:center;justify-content:center;gap:8px}
.icon-btn{width:42px;height:42px;padding:0}
.primary{background:linear-gradient(135deg,#67e8f9,#42e8a3);
 color:#06151b;border:0;font-weight:750}
.field{display:block;width:100%;padding:14px 15px;border-radius:14px;
 background:rgba(0,0,0,.2);border:1px solid var(--border);
 color:var(--text);outline:none;margin-top:7px}
.field:focus{border-color:var(--accent)}
label{display:block;font-size:13px;color:var(--muted);margin:15px 0}
.brand{display:flex;align-items:center;gap:11px;font-size:23px;font-weight:800}
.brand-mark{width:43px;height:43px;border-radius:15px;display:grid;
 place-items:center;color:#07111f;background:linear-gradient(135deg,#67e8f9,#42e8a3)}
.brand-mark svg{width:25px;height:25px}
#auth{min-height:100vh;display:grid;place-items:center;padding:22px}
.auth-card{width:min(440px,100%);padding:30px;border-radius:28px}
.auth-card h1{font-size:29px;margin:26px 0 7px}
.submit{width:100%;margin-top:18px;padding:15px}
.auth-switch{display:flex;gap:10px;margin-top:22px}
.auth-switch button{flex:1}
#app{min-height:100vh;padding:16px}
.shell{width:min(1500px,100%);height:calc(100dvh - 32px);min-height:570px;
 margin:auto;border-radius:28px;overflow:hidden;display:grid;
 grid-template-columns:300px minmax(0,1fr)}
.sidebar{display:flex;flex-direction:column;min-width:0;
 border-right:1px solid var(--border);background:rgba(255,255,255,.025)}
.side-head{padding:20px 17px 13px}
.side-brand{display:flex;align-items:center;justify-content:space-between}
.search{margin-top:17px}
.tabs{display:flex;gap:6px;padding:0 14px 12px}
.tab{flex:1;border:0;border-radius:12px;padding:10px 3px;background:transparent;
 color:var(--muted);font-size:12px}
.tab.active{background:#67e8f91c;color:var(--accent)}
.list{overflow-y:auto;flex:1}
.person{display:flex;gap:11px;align-items:center;padding:14px 16px;
 border-bottom:1px solid #ffffff0a;cursor:pointer;min-width:0}
.person:hover,.person.selected{background:#67e8f912}
.avatar{width:45px;height:45px;flex-shrink:0;border-radius:50%;
 display:grid;place-items:center;font-weight:800;background:linear-gradient(135deg,#215e77,#4b3d78)}
.person-info{min-width:0;flex:1}
.person-name{font-weight:650;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.person-last{font-size:12px;color:var(--muted);margin-top:5px;
 overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.online-dot{display:inline-block;width:8px;height:8px;border-radius:50%;
 background:var(--green);margin-right:5px}
.side-foot{padding:13px;border-top:1px solid var(--border);
 display:flex;align-items:center;gap:10px}
.side-foot .who{flex:1;min-width:0}
.main{min-width:0;display:flex;flex-direction:column}
.topbar{height:75px;padding:13px 19px;border-bottom:1px solid var(--border);
 display:flex;align-items:center;gap:12px}
.top-info{flex:1;min-width:0}
.top-info strong{display:block;overflow:hidden;text-overflow:ellipsis}
.top-actions{display:flex;gap:8px}
.content{flex:1;min-height:0;display:flex;flex-direction:column}
.welcome{margin:auto;text-align:center;padding:30px;max-width:470px}
.hero-icon{width:90px;height:90px;border-radius:30px;display:grid;place-items:center;
 margin:0 auto 25px;background:var(--glass);border:1px solid var(--border);color:var(--accent)}
.hero-icon svg{width:45px;height:45px}
.messages{flex:1;overflow-y:auto;padding:22px;display:flex;flex-direction:column;gap:12px}
.bubble{max-width:min(80%,560px);width:fit-content;padding:11px 13px;
 border-radius:18px;background:#ffffff12;border:1px solid var(--border);overflow-wrap:anywhere}
.bubble.mine{align-self:flex-end;background:#42e8a31c;border-color:#42e8a333;border-bottom-right-radius:5px}
.bubble.theirs{align-self:flex-start;border-bottom-left-radius:5px}
.bubble small{display:block;color:var(--muted);font-size:10px;margin-top:7px;text-align:right}
.composer{padding:13px 17px calc(13px + env(safe-area-inset-bottom));
 display:flex;align-items:flex-end;gap:9px;border-top:1px solid var(--border)}
.composer textarea{flex:1;resize:none;max-height:130px;min-height:45px;
 padding:13px 15px;border-radius:17px;background:#ffffff08;
 border:1px solid var(--border);color:var(--text);outline:none}
.send{height:45px;width:48px;padding:0}
.panel{padding:23px;overflow:auto}
.panel h2{margin-top:0}
.panel-card{padding:18px;border-radius:19px;margin:15px 0}
.status-item{padding:15px 0;border-bottom:1px solid var(--border)}
.status-item p{white-space:pre-wrap;overflow-wrap:anywhere}
#toast{position:fixed;bottom:25px;left:50%;transform:translateX(-50%);
 z-index:50;background:#172637;border:1px solid var(--border);border-radius:14px;
 padding:13px 18px;max-width:90vw;box-shadow:0 10px 35px #0005}
@media(max-width:760px){
 #app{padding:0}.shell{height:100dvh;min-height:0;border-radius:0;grid-template-columns:1fr}
 .main{display:none}.shell.chat-open .sidebar{display:none}
 .shell.chat-open .main{display:flex}#mobileBack{display:grid}
 .topbar{height:68px;padding:10px 12px}.messages{padding:15px}
 .composer{padding:10px 10px calc(10px + env(safe-area-inset-bottom))}
 .bubble{max-width:90%}.auth-card{padding:25px}
}
</style>
</head>
<body>
<svg xmlns="http://www.w3.org/2000/svg" style="display:none">
 <symbol id="chat" viewBox="0 0 24 24"><path d="M21 11.5a8.5 8.5 0 0 1-12.3 7.6L3 21l1.9-5.7A8.5 8.5 0 1 1 21 11.5Z"/></symbol>
 <symbol id="send" viewBox="0 0 24 24"><path d="m22 2-7 20-4-9-9-4Z"/><path d="M22 2 11 13"/></symbol>
 <symbol id="plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
 <symbol id="search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></symbol>
 <symbol id="back" viewBox="0 0 24 24"><path d="m15 18-6-6 6-6"/></symbol>
 <symbol id="logout" viewBox="0 0 24 24"><path d="M10 17l5-5-5-5M15 12H3"/><path d="M12 3h7a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-7"/></symbol>
</svg>

<div id="auth">
 <div class="auth-card glass">
  <div class="brand"><span class="brand-mark"><svg><use href="#chat"/></svg></span>ChatWave</div>
  <h1 id="authTitle">Welcome back</h1>
  <p class="muted" id="authSubtitle">Sign in to continue your conversations.</p>
  <form id="authForm">
   <div id="nameWrap" class="hidden"><label>Your name
    <input id="displayName" class="field" maxlength="50" autocomplete="name" placeholder="Your name"></label></div>
   <label>Email address<input id="email" class="field" type="email" required autocomplete="email" placeholder="you@example.com"></label>
   <label>Password<input id="password" class="field" type="password" required minlength="6" autocomplete="current-password" placeholder="At least 6 characters"></label>
   <button id="authSubmit" class="btn primary submit" type="submit">Sign in</button>
  </form>
  <div class="auth-switch"><button id="toggleAuth" class="btn" type="button">Create account</button>
   <button id="forgotBtn" class="btn" type="button">Forgot password?</button></div>
  <p class="small muted">Powered by Firebase.</p>
 </div>
</div>

<div id="app" class="hidden"><div class="shell glass" id="shell">
 <aside class="sidebar">
  <div class="side-head"><div class="side-brand">
   <div class="brand"><span class="brand-mark"><svg><use href="#chat"/></svg></span>ChatWave</div>
   <button class="icon-btn" id="newChatBtn" title="New chat"><svg><use href="#plus"/></svg></button>
  </div><input id="searchChats" class="field search" placeholder="Search conversations..."></div>
  <div class="tabs">
   <button class="tab active" data-view="chats">Chats</button>
   <button class="tab" data-view="statuses">Statuses</button>
   <button class="tab" data-view="settings">Settings</button>
  </div>
  <div id="chatList" class="list"></div>
  <div class="side-foot"><div class="avatar" id="myAvatar">C</div>
   <div class="who"><div id="myName" class="person-name">My account</div><div id="myEmail" class="person-last"></div></div>
   <button class="icon-btn" id="signOutBtn" title="Sign out"><svg><use href="#logout"/></svg></button>
  </div>
 </aside>
 <main class="main">
  <header class="topbar"><button class="icon-btn hidden" id="mobileBack"><svg><use href="#back"/></svg></button>
   <div class="avatar hidden" id="chatAvatar">C</div>
   <div class="top-info"><strong id="topTitle">ChatWave</strong><span class="small muted" id="topSubtitle">Connect. Chat. Share.</span></div>
  </header>
  <section class="content" id="content"></section>
 </main>
</div></div>
<div id="toast" class="hidden" role="status"></div>

<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/11.6.0/firebase-app.js";
import {
 getAuth,createUserWithEmailAndPassword,signInWithEmailAndPassword,
 onAuthStateChanged,signOut,updateProfile,sendPasswordResetEmail
} from "https://www.gstatic.com/firebasejs/11.6.0/firebase-auth.js";
import {
 getFirestore,doc,setDoc,getDoc,collection,query,where,orderBy,
 limit,onSnapshot,addDoc,serverTimestamp,updateDoc,getDocs
} from "https://www.gstatic.com/firebasejs/11.6.0/firebase-firestore.js";
import {
 getDatabase,ref as dbRef,set as dbSet,onValue,onDisconnect,
 serverTimestamp as dbTimestamp
} from "https://www.gstatic.com/firebasejs/11.6.0/firebase-database.js";

/* EXACT CONFIGURATION PROVIDED FROM YOUR FIREBASE CONSOLE */
const firebaseConfig = {
 apiKey: "AIzaSyCOfNfS3DMUMSRHJpyW_tpSIjwFymrTt7w",
 authDomain: "chat-2c557.firebaseapp.com",
 databaseURL: "https://chat-2c557-default-rtdb.firebaseio.com",
 projectId: "chat-2c557",
 storageBucket: "chat-2c557.firebasestorage.app",
 messagingSenderId: "74313204354",
 appId: "1:74313204354:web:c735269d502b88a39eea9b"
};

const app=initializeApp(firebaseConfig);
const auth=getAuth(app),db=getFirestore(app),rtdb=getDatabase(app);
const $=id=>document.getElementById(id);
const icon=id=>`<svg><use href="#${id}"></use></svg>`;
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const initials=s=>String(s||"C").trim().split(/\s+/).slice(0,2).map(x=>x[0]||"").join("").toUpperCase()||"C";

let user=null,registering=false,activeChat=null;
let chats=new Map(),people=new Map(),presence=new Map(),unsubs=[];
let toastTimer,view="chats",presenceUnsub=null,chatUnsub=null,receiptUnsub=null;
const stops=[];
function toast(s){$("toast").textContent=s;$("toast").classList.remove("hidden");clearTimeout(toastTimer);toastTimer=setTimeout(()=>$("toast").classList.add("hidden"),4500)}
function listen(stop){if(typeof stop==="function")unsubs.push(stop)}
function cleanup(){unsubs.forEach(f=>{try{f()}catch{}});unsubs=[];if(presenceUnsub){presenceUnsub();presenceUnsub=null}}
function showAuth(){$("auth").classList.remove("hidden");$("app").classList.add("hidden")}
function showApp(){$("auth").classList.add("hidden");$("app").classList.remove("hidden")}
function authMode(create){
 registering=create;$("authTitle").textContent=create?"Create your account":"Welcome back";
 $("authSubtitle").textContent=create?"Join ChatWave and start connecting.":"Sign in to continue your conversations.";
 $("authSubmit").textContent=create?"Create account":"Sign in";
 $("toggleAuth").textContent=create?"I have an account":"Create account";
 $("nameWrap").classList.toggle("hidden",!create);$("displayName").required=create;
 $("password").autocomplete=create?"new-password":"current-password";
}
$("toggleAuth").onclick=()=>authMode(!registering);
$("authForm").addEventListener("submit",async e=>{
 e.preventDefault();const b=$("authSubmit");if(b.disabled)return;
 const email=$("email").value.trim().toLowerCase(),password=$("password").value,name=$("displayName").value.trim();
 if(registering&&!name)return toast("Enter your name.");
 b.disabled=true;b.textContent=registering?"Creating account...":"Signing in...";
 try{
  if(registering){
   const cred=await createUserWithEmailAndPassword(auth,email,password);
   if(name)await updateProfile(cred.user,{displayName:name});
   await setDoc(doc(db,"users",cred.user.uid),{uid:cred.user.uid,name:name||"ChatWave User",email,createdAt:serverTimestamp(),updatedAt:serverTimestamp()},{merge:true});
   toast("Account created!");
  }else await signInWithEmailAndPassword(auth,email,password);
 }catch(err){
  console.error(err);
  const errors={
   "auth/api-key-not-valid.-please-pass-a-valid-api-key.":"Firebase rejected the API key. Check Google Cloud API key settings.",
   "auth/email-already-in-use":"This email already has an account. Sign in instead.",
   "auth/invalid-email":"Enter a valid email address.",
   "auth/weak-password":"Use at least 6 characters for your password.",
   "auth/invalid-credential":"Incorrect email or password.",
   "auth/network-request-failed":"Network error. Check your internet connection.",
   "auth/too-many-requests":"Too many attempts. Please wait and try again.",
   "permission-denied":"Firestore permission denied. Check Firestore rules."
  };
  toast(errors[err.code]||err.message||"Authentication failed.");
 }finally{b.disabled=false;b.textContent=registering?"Create account":"Sign in"}
});
$("forgotBtn").onclick=async()=>{
 const email=$("email").value.trim();if(!email)return toast("Enter your email address first.");
 try{await sendPasswordResetEmail(auth,email);toast("Password reset email sent.");}catch(e){toast(e.message)}
};
$("signOutBtn").onclick=()=>signOut(auth);

onAuthStateChanged(auth,async current=>{
 cleanup();user=current;activeChat=null;
 if(!user){showAuth();return}
 showApp();
 $("myName").textContent=user.displayName||user.email.split("@")[0];
 $("myEmail").textContent=user.email||"";$("myAvatar").textContent=initials(user.displayName||user.email);
 try{
  await setDoc(doc(db,"users",user.uid),{uid:user.uid,email:user.email,name:user.displayName||user.email.split("@")[0],updatedAt:serverTimestamp()},{merge:true});
 }catch(e){console.error(e);toast("Could not update user profile in Firestore.")}
 startPresence();subscribeChats();renderWelcome();
});

/* ONLINE PRESENCE AND LAST SEEN */
function startPresence(){
 const myStatus=dbRef(rtdb,`status/${user.uid}`);
 const connected=dbRef(rtdb,".info/connected");
 presenceUnsub=onValue(connected,async snap=>{
  if(snap.val()!==true)return;
  try{
   await onDisconnect(myStatus).set({state:"offline",lastChanged:dbTimestamp()});
   await dbSet(myStatus,{state:"online",lastChanged:dbTimestamp()});
  }catch(e){console.error("Presence setup:",e);toast("Presence setup failed. Check Realtime Database rules.")}
 });
 const allStatus=dbRef(rtdb,"status");
 listen(onValue(allStatus,snap=>{
  presence.clear();snap.forEach(child=>presence.set(child.key,child.val()));
  renderChatList();
  if(activeChat)updateHeaderPresence();
 },err=>{console.error(err);toast("Could not load online status. Check database rules.")}));
}
function statusText(uid){
 const p=presence.get(uid);
 if(p?.state==="online")return `<span class="online-dot"></span>Online`;
 if(p?.lastChanged){
  const date=new Date(p.lastChanged);
  return `Last seen ${date.toLocaleString([], {month:"short",day:"numeric",hour:"2-digit",minute:"2-digit"})}`;
 }
 return "Offline";
}
function updateHeaderPresence(){
 if(activeChat)$("topSubtitle").innerHTML=statusText(activeChat.otherId);
}

function subscribeChats(){
 listen(onSnapshot(query(collection(db,"chats"),where("members","array-contains",user.uid)),snap=>{
  chats.clear();snap.forEach(d=>chats.set(d.id,{id:d.id,...d.data()}));renderChatList();
 },err=>{console.error(err);toast("Could not load chats. Check Firestore rules.")}));
}
function renderChatList(){
 const term=$("searchChats").value.trim().toLowerCase();
 const entries=[...chats.values()].filter(c=>{
  const other=(c.members||[]).find(x=>x!==user.uid),p=people.get(other);
  return !term||(p?.name||"").toLowerCase().includes(term)||(p?.email||"").toLowerCase().includes(term)||(c.lastMessage||"").toLowerCase().includes(term);
 }).sort((a,b)=>(b.updatedAt?.seconds||0)-(a.updatedAt?.seconds||0));
 $("chatList").innerHTML=entries.length?entries.map(c=>{
  const other=(c.members||[]).find(x=>x!==user.uid),p=people.get(other)||{name:c.memberNames?.[other]||"Chat member"};
  const online=presence.get(other)?.state==="online";
  return `<div class="person ${activeChat?.id===c.id?"selected":""}" data-chat="${esc(c.id)}">
   <div class="avatar">${esc(initials(p.name))}</div><div class="person-info">
   <div class="person-name">${esc(p.name)} ${online?'<span class="online-dot"></span>':""}</div>
   <div class="person-last">${esc(c.lastMessage||statusText(other))}</div></div></div>`;
 }).join(""):`<div class="panel muted small">${term?"No matching conversations.":"No chats yet. Tap + to start one."}</div>`;
 $("chatList").querySelectorAll("[data-chat]").forEach(el=>el.onclick=()=>openChat(el.dataset.chat));
}
$("searchChats").addEventListener("input",renderChatList);

async function startChat(){
 if(!user)return;
 const email=prompt("Enter the exact email address registered on ChatWave:");
 if(!email)return;
 const targetEmail=email.trim().toLowerCase();
 if(targetEmail===user.email.toLowerCase())return toast("You cannot chat with yourself.");
 try{
  const result=await getDocs(query(collection(db,"users"),where("email","==",targetEmail),limit(1)));
  if(result.empty)return toast("No ChatWave account found with that email.");
  const target=result.docs[0].data();if(!target.uid)return toast("That profile is incomplete.");
  people.set(target.uid,target);
  const members=[user.uid,target.uid].sort(),chatId=members.join("_"),chatRef=doc(db,"chats",chatId);
  const existing=await getDoc(chatRef);
  if(!existing.exists())await setDoc(chatRef,{
   members,memberNames:{[user.uid]:user.displayName||user.email,[target.uid]:target.name||target.email},
   lastMessage:"",createdAt:serverTimestamp(),updatedAt:serverTimestamp()
  });
  await openChat(chatId);
 }catch(e){console.error(e);toast("Could not start chat: "+e.message)}
}
$("newChatBtn").onclick=startChat;

function renderWelcome(){
 activeChat=null;$("shell").classList.remove("chat-open");
 $("mobileBack").classList.add("hidden");$("topTitle").textContent="ChatWave";
 $("topSubtitle").textContent="Connect. Chat. Share.";$("chatAvatar").classList.add("hidden");
 $("content").innerHTML=`<div class="welcome"><div class="hero-icon">${icon("chat")}</div>
 <h2>Your conversations, together.</h2><p class="muted">Start a conversation with another registered user.</p>
 <button class="btn primary" id="welcomeNewChat">${icon("plus")} Start a conversation</button></div>`;
 $("welcomeNewChat").onclick=startChat;renderChatList();
}
async function openChat(chatId){
 const chat=chats.get(chatId);if(!chat)return toast("Chat is still loading. Try again.");
 if(chatUnsub){chatUnsub();chatUnsub=null}
 if(receiptUnsub){receiptUnsub();receiptUnsub=null}
 activeChat=null;
 const otherId=(chat.members||[]).find(x=>x!==user.uid);
 let p=people.get(otherId);
 try{if(!p){const snap=await getDoc(doc(db,"users",otherId));if(snap.exists())p=snap.data()}}catch(e){console.error(e)}
 p ||= {name:chat.memberNames?.[otherId]||"Chat member",email:""};
 people.set(otherId,p);activeChat={id:chatId,otherId,person:p};
 $("shell").classList.add("chat-open");$("mobileBack").classList.remove("hidden");
 $("chatAvatar").classList.remove("hidden");$("chatAvatar").textContent=initials(p.name);
 $("topTitle").textContent=p.name||"Chat member";updateHeaderPresence();
 $("content").innerHTML=`<div class="messages" id="messages"><div class="muted small">Loading messages...</div></div>
 <form class="composer" id="messageForm"><textarea id="messageInput" rows="1" maxlength="5000" placeholder="Write a message..." required></textarea>
 <button class="btn primary send" type="submit" aria-label="Send">${icon("send")}</button></form>`;
 $("messageForm").onsubmit=sendMessage;
 const input=$("messageInput");
 input.addEventListener("input",()=>{input.style.height="auto";input.style.height=Math.min(input.scrollHeight,130)+"px"});
 const messagesRef=collection(db,"chats",chatId,"messages");
 chatUnsub=onSnapshot(query(messagesRef,orderBy("createdAt","asc"),limit(300)),async snap=>{
  if(!activeChat||activeChat.id!==chatId)return;
  const box=$("messages");if(!box)return;
  if(snap.empty){box.innerHTML='<div class="muted small" style="text-align:center;margin:auto">Say hello 👋</div>';return}
  const docs=snap.docs;
  box.innerHTML=docs.map(d=>{
   const m=d.data(),mine=m.senderId===user.uid;
   const time=m.createdAt?.toDate?m.createdAt.toDate().toLocaleTimeString([],{hour:"2-digit",minute:"2-digit"}):"Sending…";
   let receipt="";
   if(mine){
    const read=(m.readBy||[]).includes(otherId),delivered=(m.deliveredTo||[]).includes(otherId);
    receipt=read?" · Read ✓✓":delivered?" · Delivered ✓✓":" · Sent ✓";
   }
   return `<div class="bubble ${mine?"mine":"theirs"}">${esc(m.text).replace(/\n/g,"<br>")}<small>${esc(time+receipt)}</small></div>`;
  }).join("");
  box.scrollTop=box.scrollHeight;
  /* Mark messages from the other user as delivered and read. */
  for(const d of docs){
   const m=d.data();if(m.senderId===user.uid)continue;
   try{
    const updates={};
    if(!(m.deliveredTo||[]).includes(user.uid))updates.deliveredTo=[...(m.deliveredTo||[]),user.uid];
    if(!(m.readBy||[]).includes(user.uid))updates.readBy=[...(m.readBy||[]),user.uid];
    if(Object.keys(updates).length)await updateDoc(doc(db,"chats",chatId,"messages",d.id),updates);
   }catch(e){console.error("Receipt update:",e)}
  }
 },err=>{console.error(err);toast("Unable to load messages: "+err.message)});
 renderChatList();
}
async function sendMessage(e){
 e.preventDefault();if(!activeChat||!user)return;
 const input=$("messageInput"),text=input.value.trim();if(!text)return;
 const chatId=activeChat.id,otherId=activeChat.otherId,button=$("messageForm").querySelector("button");
 button.disabled=true;input.disabled=true;
 try{
  await addDoc(collection(db,"chats",chatId,"messages"),{
   text,senderId:user.uid,createdAt:serverTimestamp(),
   deliveredTo:[],readBy:[user.uid]
  });
  await updateDoc(doc(db,"chats",chatId),{lastMessage:text.slice(0,150),updatedAt:serverTimestamp()});
  input.value="";input.style.height="auto";
  /* Browser notification when the recipient is currently online.
     Background push requires Firebase Cloud Messaging setup. */
  if(presence.get(otherId)?.state==="online"&&Notification.permission==="granted"){
   new Notification("Message sent",{body:"Your message was sent to "+(activeChat?.person.name||"your contact")});
  }
 }catch(e){console.error(e);toast("Message not sent: "+e.message)}
 finally{button.disabled=false;input.disabled=false;input.focus()}
}
$("mobileBack").onclick=renderWelcome;

document.querySelectorAll("[data-view]").forEach(b=>b.onclick=()=>{
 view=b.dataset.view;
 document.querySelectorAll("[data-view]").forEach(x=>x.classList.toggle("active",x===b));
 if(view==="chats")renderWelcome();
 if(view==="statuses")renderStatuses();
 if(view==="settings")renderSettings();
});

async function renderStatuses(){
 activeChat=null;$("shell").classList.remove("chat-open");$("mobileBack").classList.add("hidden");
 $("topTitle").textContent="Statuses";$("topSubtitle").textContent="Share a quick update";$("chatAvatar").classList.add("hidden");
 $("content").innerHTML=`<div class="panel"><h2>My status</h2>
 <form id="statusForm" class="panel-card glass"><label>What's happening?
 <textarea class="field" id="statusText" rows="3" maxlength="500" required placeholder="Share an update..."></textarea></label>
 <button class="btn primary" type="submit">Post status</button></form><h3>Recent statuses</h3>
 <div id="statusList" class="panel-card glass">Loading statuses...</div></div>`;
 $("statusForm").onsubmit=async e=>{
  e.preventDefault();const text=$("statusText").value.trim();if(!text)return;
  try{await addDoc(collection(db,"statuses"),{uid:user.uid,name:user.displayName||user.email,text,createdAt:serverTimestamp()});$("statusText").value="";toast("Status posted!")}
  catch(err){toast("Could not post status: "+err.message)}
 };
 listen(onSnapshot(query(collection(db,"statuses"),orderBy("createdAt","desc"),limit(50)),snap=>{
  const list=$("statusList");if(!list)return;
  list.innerHTML=snap.docs.map(d=>{
   const s=d.data(),time=s.createdAt?.toDate?s.createdAt.toDate().toLocaleString():"Just now";
   return `<div class="status-item"><strong>${esc(s.name||"ChatWave user")}</strong><div class="small muted">${esc(time)}</div><p>${esc(s.text)}</p>
   ${s.uid===user.uid?`<button class="btn" data-delete="${esc(d.id)}">Delete</button>`:""}</div>`;
  }).join("")||'<p class="muted">No statuses yet.</p>';
  list.querySelectorAll("[data-delete]").forEach(b=>b.onclick=async()=>{
   try{const {deleteDoc}=await import("https://www.gstatic.com/firebasejs/11.6.0/firebase-firestore.js");await deleteDoc(doc(db,"statuses",b.dataset.delete));toast("Status deleted")}
   catch(err){toast(err.message)}
  });
 },err=>toast("Could not load statuses: "+err.message)));
}
function renderSettings(){
 activeChat=null;$("shell").classList.remove("chat-open");$("mobileBack").classList.add("hidden");
 $("topTitle").textContent="Settings";$("topSubtitle").textContent="Manage your account";$("chatAvatar").classList.add("hidden");
 $("content").innerHTML=`<div class="panel"><h2>Profile and settings</h2>
 <div class="panel-card glass"><p class="muted">${esc(user.email)}</p>
 <form id="profileForm"><label>Display name<input class="field" id="profileName" maxlength="50" required></label>
 <button class="btn primary" type="submit">Save profile</button></form></div>
 <div class="panel-card glass"><h3>Notifications</h3><p class="muted small">Allow notifications while ChatWave is open.</p>
 <button class="btn" id="enableNotifications">Enable notifications</button></div>
 <div class="panel-card glass"><h3>Security</h3><button class="btn" id="resetPassword">Reset password</button>
 <button class="btn" id="settingsSignOut">Sign out</button></div>
 <p class="muted small">Background push notifications require Firebase Cloud Messaging and service-worker setup.</p></div>`;
 $("profileName").value=user.displayName||"";
 $("profileForm").onsubmit=async e=>{
  e.preventDefault();const name=$("profileName").value.trim();if(!name)return;
  try{await updateProfile(user,{displayName:name});await setDoc(doc(db,"users",user.uid),{name,updatedAt:serverTimestamp()},{merge:true});
   $("myName").textContent=name;$("myAvatar").textContent=initials(name);toast("Profile updated")}
  catch(err){toast(err.message)}
 };
 $("enableNotifications").onclick=async()=>{
  if(!("Notification" in window))return toast("This browser does not support notifications.");
  try{const p=await Notification.requestPermission();toast(p==="granted"?"Notifications enabled while the page is open.": "Notification permission was not granted.")}
  catch(e){toast(e.message)}
 };
 $("resetPassword").onclick=async()=>{try{await sendPasswordResetEmail(auth,user.email);toast("Password reset email sent")}catch(e){toast(e.message)}};
 $("settingsSignOut").onclick=()=>signOut(auth);
}
authMode(false);
renderWelcome();
</script>
