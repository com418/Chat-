
<!DOCTYPE html>

<title>ChatWave — Connect. Chat. Share.</title>

<style>
:root{color-scheme:dark;--bg:#091727;--glass:rgba(255,255,255,.075);--line:rgba(255,255,255,.14);--muted:#a7b9cc;--mint:#52e5ce;--blue:#48a7f4;--text:#f5f8ff}
*{box-sizing:border-box}
body{margin:0;min-height:100dvh;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--text);background:radial-gradient(ellipse at 15% 5%,#17436c 0,transparent 42%),radial-gradient(ellipse at 90% 90%,#07504e 0,transparent 38%),var(--bg)}
button,input,textarea{font:inherit}button{color:inherit;cursor:pointer}button:disabled{opacity:.5;cursor:not-allowed}
.hidden{display:none!important}.app{max-width:760px;margin:auto;min-height:100dvh;display:flex;flex-direction:column}
header{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:12px;padding:calc(env(safe-area-inset-top) + 14px) 18px 14px;background:rgba(16,39,63,.72);backdrop-filter:blur(25px);border-bottom:1px solid var(--line)}
.logo{width:46px;height:46px;border-radius:16px;display:grid;place-items:center;background:linear-gradient(135deg,var(--mint),var(--blue));color:#062238}
.brand{font-weight:850;font-size:23px;letter-spacing:-.7px}.brand span{color:var(--mint)}
.icon{width:23px;height:23px;display:block;flex-shrink:0}.icon-sm{width:18px;height:18px}.icon-lg{width:29px;height:29px}
.icon-btn{width:44px;height:44px;display:grid;place-items:center;border:1px solid var(--line);border-radius:15px;background:var(--glass);flex-shrink:0}
.header-action{margin-left:auto}
main{flex:1;padding:18px 16px 26px;min-width:0}
.panel{background:var(--glass);border:1px solid var(--line);border-radius:22px;padding:17px;backdrop-filter:blur(20px);margin-bottom:14px}
h2{font-size:24px;margin:3px 0 16px}h3{font-size:16px;margin:0 0 12px}
.muted{color:var(--muted)}.small{font-size:13px}
.field,.search{width:100%;padding:14px 15px;border-radius:16px;background:rgba(255,255,255,.07);border:1px solid var(--line);color:var(--text);outline:none}
.field{margin:6px 0 12px}.search{margin-bottom:17px}
.primary{border:0;background:linear-gradient(120deg,var(--mint),var(--blue));color:#072039;border-radius:15px;padding:13px 17px;font-weight:800}
.secondary{border:1px solid var(--line);background:var(--glass);border-radius:15px;padding:12px 15px}
.danger{border:1px solid rgba(255,100,115,.5);background:rgba(255,70,90,.12);color:#ffb0ba;border-radius:15px;padding:13px 15px}
.full{width:100%}.row{display:flex;align-items:center;gap:12px}.grow{flex:1;min-width:0}
.avatar{width:53px;height:53px;flex-shrink:0;border-radius:50%;display:grid;place-items:center;background:linear-gradient(135deg,rgba(82,229,206,.25),rgba(72,167,244,.3));border:1px solid rgba(255,255,255,.2);color:var(--mint);font-weight:800}
.person-name{font-weight:750;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.preview{color:var(--muted);font-size:14px;margin-top:5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chat-row{display:flex;align-items:center;gap:13px;padding:13px 5px;border-bottom:1px solid rgba(255,255,255,.08);cursor:pointer}
.chat-row:last-child{border-bottom:0}.unread{background:var(--mint);color:#07312e;border-radius:999px;min-width:23px;height:23px;padding:0 7px;display:grid;place-items:center;font-size:12px;font-weight:900}
.badge{display:inline-flex;background:var(--mint);color:#062b29;border-radius:999px;padding:3px 8px;font-size:11px;font-weight:900}
.bottom-nav{position:sticky;bottom:0;z-index:5;display:flex;justify-content:space-around;gap:8px;padding:9px 12px calc(env(safe-area-inset-bottom) + 9px);background:rgba(20,43,65,.83);backdrop-filter:blur(26px);border-top:1px solid var(--line)}
.nav-item{flex:1;border:0;background:transparent;color:var(--muted);padding:9px 4px;border-radius:15px;font-size:12px;display:flex;align-items:center;justify-content:center;gap:5px;flex-direction:column;position:relative}
.nav-item.active{color:var(--mint);background:rgba(255,255,255,.06)}
.nav-icon{width:23px;height:23px}.nav-item .badge{position:absolute;top:2px;right:calc(50% - 28px)}
.auth-wrap{width:100%;max-width:440px;margin:auto;padding:24px 20px}
.auth-logo{width:72px;height:72px;border-radius:24px;display:grid;place-items:center;margin:0 auto 16px;background:linear-gradient(135deg,var(--mint),var(--blue));color:#062238}
.auth-title{text-align:center;font-size:29px;font-weight:850;margin:0 0 8px}.auth-sub{text-align:center;color:var(--muted);margin:0 0 26px}
#conversation{position:fixed;inset:0;z-index:10;background:radial-gradient(ellipse at 10% 10%,#17436c 0,transparent 45%),radial-gradient(ellipse at 100% 95%,#07504e 0,transparent 42%),var(--bg);display:flex;flex-direction:column;width:100%;height:100dvh}
.chat-header{display:flex;align-items:center;gap:10px;padding:calc(env(safe-area-inset-top) + 10px) 14px 12px;background:rgba(20,47,75,.75);backdrop-filter:blur(24px);border-bottom:1px solid var(--line)}
.messages{flex:1;overflow-y:auto;padding:18px 14px 20px;display:flex;flex-direction:column;gap:13px;overscroll-behavior:contain}
.message{max-width:82%;padding:12px 14px;border:1px solid var(--line);border-radius:21px;background:rgba(255,255,255,.12);align-self:flex-start;overflow-wrap:anywhere}
.message.mine{align-self:flex-end;background:linear-gradient(135deg,rgba(76,220,196,.92),rgba(67,151,238,.95));color:#062238;border-color:transparent;border-bottom-right-radius:6px}
.message:not(.mine){border-bottom-left-radius:6px}.message-time{font-size:11px;opacity:.72;margin-top:6px;text-align:right}
.composer{display:flex;align-items:flex-end;gap:9px;padding:10px 12px calc(env(safe-area-inset-bottom) + 12px);background:rgba(24,48,72,.92);backdrop-filter:blur(24px);border-top:1px solid var(--line)}
.composer textarea{resize:none;max-height:130px;min-height:48px;flex:1;border:1px solid var(--line);border-radius:23px;background:rgba(255,255,255,.08);padding:13px 15px;color:var(--text);outline:none}
.send{height:48px;width:50px;display:grid;place-items:center;flex-shrink:0;border:0;border-radius:17px;background:linear-gradient(135deg,var(--mint),var(--blue));color:#062238}
.setting-row{display:flex;align-items:center;gap:13px;padding:15px 3px;border-bottom:1px solid rgba(255,255,255,.08);cursor:pointer}
.setting-row:last-child{border-bottom:0}.setting-icon{width:42px;height:42px;border-radius:14px;display:grid;place-items:center;background:var(--glass);border:1px solid var(--line);color:var(--mint)}
.empty{text-align:center;color:var(--muted);padding:35px 12px}.empty-icon{margin:0 auto 12px;color:var(--muted)}
hr{border:0;border-top:1px solid var(--line);margin:18px 0}
.toast{position:fixed;z-index:30;bottom:calc(env(safe-area-inset-bottom) + 25px);left:50%;transform:translateX(-50%);max-width:90%;padding:12px 17px;border:1px solid var(--line);border-radius:15px;background:#193b55;box-shadow:0 8px 35px #0005}
.modal-shade{position:fixed;inset:0;z-index:20;background:#0009;display:flex;align-items:flex-end;justify-content:center;padding:12px}
.modal-card{width:100%;max-width:520px;max-height:85dvh;overflow:auto;background:#142a40}
@media(min-width:761px){body{padding:18px 0}.app{min-height:calc(100dvh - 36px);border:1px solid var(--line);border-radius:28px;overflow:hidden}#conversation{top:18px;bottom:18px;height:calc(100dvh - 36px);max-width:760px;border:1px solid var(--line);border-radius:28px;overflow:hidden}}
</style>
</head>
<body>

<div id="authScreen" class="auth-wrap">
  <div class="auth-logo" id="authLogo"></div>
  <h1 class="auth-title">Chat<span style="color:var(--mint)">Wave</span></h1>
  <p class="auth-sub">Connect. Chat. Share.</p>
  <section class="panel">
    <h2 id="authTitle">Welcome back</h2>
    <p class="muted">Sign in or create your account.</p>
    <form id="authForm">
      <div id="nameWrap" class="hidden"><label class="small muted" for="authName">Username</label><input id="authName" class="field" autocomplete="nickname" maxlength="40" placeholder="Choose a username"></div>
      <label class="small muted" for="authEmail">Email address</label>
      <input id="authEmail" class="field" type="email" autocomplete="email" required placeholder="you@example.com">
      <label class="small muted" for="authPassword">Password</label>
      <input id="authPassword" class="field" type="password" minlength="6" autocomplete="current-password" required placeholder="At least 6 characters">
      <div id="codeWrap" class="hidden"><label class="small muted" for="authCode">Email verification code</label><input id="authCode" class="field" inputmode="numeric" maxlength="6" placeholder="6-digit code"></div>
      <button id="authSubmit" class="primary full" type="submit">Sign In</button>
    </form>
    <button id="authSwitch" class="secondary full" style="margin-top:12px">Create an account</button>
    <button id="forgotBtn" class="secondary full" style="margin-top:10px">Forgot password?</button>
  </section>
</div>

<div id="appScreen" class="app hidden">
  <header>
    <div class="logo" id="appLogo"></div>
    <div class="brand">Chat<span>Wave</span></div>
    <button id="newChatBtn" class="icon-btn header-action" aria-label="New chat"></button>
  </header>
  <main id="main"></main>
  <nav id="bottomNav" class="bottom-nav">
    <button class="nav-item active" data-page="chats"><span class="nav-icon" data-icon="chats"></span>Chats <span id="navUnread" class="badge hidden">0</span></button>
    <button class="nav-item" data-page="calls"><span class="nav-icon" data-icon="calls"></span>Calls</button>
    <button class="nav-item" data-page="settings"><span class="nav-icon" data-icon="settings"></span>Settings</button>
  </nav>
</div>

<div id="conversation" class="hidden">
  <div class="chat-header">
    <button id="backChat" class="icon-btn" aria-label="Back to chats"></button>
    <div id="chatAvatar" class="avatar"></div>
    <div class="grow"><div id="chatTitle" class="person-name">Conversation</div><div id="chatSubtitle" class="preview">ChatWave</div></div>
    <button id="chatMore" class="icon-btn" aria-label="Conversation options"></button>
  </div>
  <div id="messages" class="messages"></div>
  <form id="composer" class="composer">
    <textarea id="messageInput" rows="1" placeholder="Write a message..." aria-label="Message" required></textarea>
    <button class="send" aria-label="Send message" type="submit" id="sendIcon"></button>
  </form>
</div>
<div id="modalHost"></div>
<div id="toast" class="toast hidden" role="status"></div>

<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/11.6.0/firebase-app.js";
import {
 getAuth,onAuthStateChanged,createUserWithEmailAndPassword,signInWithEmailAndPassword,
 sendPasswordResetEmail,updateProfile,deleteUser
} from "https://www.gstatic.com/firebasejs/11.6.0/firebase-auth.js";
import {
 getFirestore,doc,setDoc,getDoc,updateDoc,collection,query,where,
 onSnapshot,addDoc,serverTimestamp,orderBy,deleteDoc
} from "https://www.gstatic.com/firebasejs/11.6.0/firebase-firestore.js";

/* Firebase configuration */
const firebaseConfig={
 apiKey:"AIzaSyCOfNfS3DMUMSRHJpyW_tpSIjwFymrTt7w",
 authDomain:"chat-2c557.firebaseapp.com",
 databaseURL:"https://chat-2c557-default-rtdb.firebaseio.com",
 projectId:"chat-2c557",
 storageBucket:"chat-2c557.firebasestorage.app",
 messagingSenderId:"74313204354",
 appId:"1:74313204354:web:c735269d502b88a39eea9b"
};

/* EmailJS configuration */
const EMAILJS_PUBLIC_KEY="OxtLjZnoiYd3ih6cm";
const EMAILJS_SERVICE_ID="service_1h2qcyj";
const EMAILJS_TEMPLATE_ID="template_g5knl87";

const app=initializeApp(firebaseConfig),auth=getAuth(app),db=getFirestore(app);
emailjs.init({publicKey:EMAILJS_PUBLIC_KEY});

const paths={
 logo:'<path d="M5 5.5A3.5 3.5 0 0 1 8.5 2h7A3.5 3.5 0 0 1 19 5.5v5a3.5 3.5 0 0 1-3.5 3.5H12l-4 3v-3.1a3.5 3.5 0 0 1-3-3.4z"/><path d="M9 7h6M9 10h4"/>',
 chats:'<path d="M21 11.5a8.4 8.4 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.4 8.4 0 0 1-3.8-.9L3 21l1.9-5.7a8.4 8.4 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.4 8.4 0 0 1 3.8-.9h.5a8.5 8.5 0 0 1 8 8z"/>',
 calls:'<path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.4 19.4 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7l.5 2.7a2 2 0 0 1-.6 1.9L7.7 9.6a16 16 0 0 0 6 6l1.3-1.3a2 2 0 0 1 1.9-.6l2.7.5a2 2 0 0 1 1.7 2z"/>',
 settings:'<circle cx="12" cy="12" r="3"/><path d="m19.4 15 .1.1a1.7 1.7 0 1 1-2.4 2.4l-.1-.1a1.7 1.7 0 0 0-2.9 1.2v.3a1.7 1.7 0 1 1-3.4 0v-.2A1.7 1.7 0 0 0 8 17.5l-.1.1a1.7 1.7 0 1 1-2.4-2.4l.1-.1a1.7 1.7 0 0 0-1.2-2.9h-.3a1.7 1.7 0 1 1 0-3.4h.2A1.7 1.7 0 0 0 5.5 6l-.1-.1a1.7 1.7 0 1 1 2.4-2.4l.1.1a1.7 1.7 0 0 0 2.9-1.2v-.3a1.7 1.7 0 1 1 3.4 0v.2A1.7 1.7 0 0 0 17 3.5l.1-.1a1.7 1.7 0 1 1 2.4 2.4l-.1.1a1.7 1.7 0 0 0 1.2 2.9h.3a1.7 1.7 0 1 1 0 3.4h-.2a1.7 1.7 0 0 0-1.3 2.8z"/>',
 plus:'<path d="M12 5v14M5 12h14"/>',
 back:'<path d="m15 18-6-6 6-6"/>',
 more:'<circle cx="5" cy="12" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/>',
 send:'<path d="m22 2-7 20-4-9-9-4z"/><path d="M22 2 11 13"/>',
 account:'<circle cx="12" cy="8" r="4"/><path d="M5 21a7 7 0 0 1 14 0"/>',
 privacy:'<rect x="4" y="10" width="16" height="11" rx="2"/><path d="M8 10V7a4 4 0 1 1 8 0v3"/>',
 notification:'<path d="M18 8a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9M10 21h4"/>',
 help:'<circle cx="12" cy="12" r="10"/><path d="M9.1 9a3 3 0 0 1 5.8 1c0 2-3 3-3 3m.1 4h.01"/>',
 edit:'<path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L9 17l-4 1 1-4z"/>',
 close:'<path d="m18 6-12 12M6 6l12 12"/>',
 lock:'<rect x="4" y="10" width="16" height="11" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/>',
 search:'<circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/>',
 check:'<path d="m5 12 4 4L19 6"/>',
 trash:'<path d="M3 6h18M8 6V4h8v2m3 0-1 14H6L5 6m4 4v6m6-6v6"/>',
 userPlus:'<path d="M16 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2M10 11a4 4 0 1 0 0-8 4 4 0 0 0 0 8M19 8v6M16 11h6"/>',
 info:'<circle cx="12" cy="12" r="10"/><path d="M12 11v5m0-9h.01"/>'
};
function svg(name,cls="icon"){
 return `<svg class="${cls}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${paths[name]||paths.info}</svg>`;
}
function initials(name="C"){return(name.trim().split(/\s+/).map(s=>s[0]).join("").slice(0,2)||"C").toUpperCase();}
$("authLogo").innerHTML=svg("logo","icon-lg");
$("appLogo").innerHTML=svg("logo","icon-lg");
$("newChatBtn").innerHTML=svg("plus");
$("backChat").innerHTML=svg("back");
$("chatMore").innerHTML=svg("more");
$("sendIcon").innerHTML=svg("send");
document.querySelectorAll("[data-icon]").forEach(el=>el.innerHTML=svg(el.dataset.icon));

const $=id=>document.getElementById(id);
let me=null,profile=null,page="chats",authMode="login",pendingCode=null;
let chats=[],people=[],currentChat=null,unsubChats=null,unsubPeople=null,unsubMessages=null;
let messageCache=[],toastTimer=null,chatOpen=false,submitting=false;

function esc(s=""){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}
function toast(s){$("toast").textContent=s;$("toast").classList.remove("hidden");clearTimeout(toastTimer);toastTimer=setTimeout(()=>$("toast").classList.add("hidden"),3200);}
function errText(e){return(e?.message||"Something went wrong.").replace("Firebase: ","").replace(/\(auth\/[^)]+\)\.?/g,"").replace(/\.$/,"");}
function timeText(t){try{const d=t?.toDate?t.toDate():t?new Date(t):null;return d&&!isNaN(d)?d.toLocaleTimeString([],{hour:"2-digit",minute:"2-digit"}):"";}catch{return"";}}
function unread(c){return Number(c.unreadCounts?.[me.uid]||0);}
function chatName(c){if(c.name)return c.name;const other=(c.members||[]).find(id=>id!==me.uid);const p=people.find(x=>x.uid===other);return p?.username||p?.email||"ChatWave user";}
function latest(c){return c.lastMessage||"Start a conversation";}
function cleanListeners(){unsubChats?.();unsubPeople?.();unsubMessages?.();unsubChats=unsubPeople=unsubMessages=null;}
function showAuth(){cleanListeners();$("authScreen").classList.remove("hidden");$("appScreen").classList.add("hidden");$("conversation").classList.add("hidden");chatOpen=false;}
function showApp(){$("authScreen").classList.add("hidden");$("appScreen").classList.remove("hidden");$("conversation").classList.add("hidden");chatOpen=false;renderPage();listenData();}
function listenData(){
 cleanListeners();
 unsubPeople=onSnapshot(collection(db,"users"),s=>{people=s.docs.map(d=>({uid:d.id,...d.data()}));if(!chatOpen)renderPage();},e=>toast("Users: "+errText(e)));
 unsubChats=onSnapshot(query(collection(db,"chats"),where("members","array-contains",me.uid)),s=>{
  chats=s.docs.map(d=>({id:d.id,...d.data()}));
  chats.sort((a,b)=>(b.updatedAt?.toMillis?.()||0)-(a.updatedAt?.toMillis?.()||0));
  updateUnreadBadge();if(!chatOpen)renderPage();
 },e=>toast("Chats: "+errText(e)));
}
function updateUnreadBadge(){
 const count=chats.reduce((sum,c)=>sum+unread(c),0);
 $("navUnread").textContent=count>99?"99+":String(count);
 $("navUnread").classList.toggle("hidden",count===0);
}
function setPage(p){page=p;document.querySelectorAll(".nav-item").forEach(b=>b.classList.toggle("active",b.dataset.page===p));$("newChatBtn").classList.toggle("hidden",p!=="chats");renderPage();}
function renderPage(){
 if(!me||chatOpen)return;
 const main=$("main");
 if(page==="chats"){
  const total=chats.reduce((sum,c)=>sum+unread(c),0);
  main.innerHTML=`<input id="chatSearch" class="search" placeholder="Search conversations..." autocomplete="off"><div class="row" style="margin:3px 0 14px"><h3 style="margin:0">MESSAGES</h3><span class="badge">${total} unread</span></div><section id="chatList"></section>`;
  renderChatList();$("chatSearch").addEventListener("input",renderChatList);
 }else if(page==="calls"){
  main.innerHTML=`<h2>Calls</h2><section class="panel"><div class="empty"><div class="empty-icon">${svg("calls","icon-lg")}</div>No calls yet</div><p class="muted small">Real voice and video calling require WebRTC signalling or a calling provider. This screen is a placeholder.</p></section>`;
 }else{
  main.innerHTML=`<h2>Settings</h2>
   <section class="panel"><div class="row"><div class="avatar">${esc(initials(profile?.username||me.email))}</div><div class="grow"><div class="person-name">${esc(profile?.username||me.displayName||"ChatWave user")}</div><div class="preview">${esc(me.email||"")}</div></div><button class="icon-btn" id="editProfile" aria-label="Edit profile">${svg("edit","icon-sm")}</button></div></section>
   <section class="panel">
   ${settingRow("account","Account","Email, security and delete account")}
   ${settingRow("privacy","Privacy","Privacy preferences")}
   ${settingRow("chats","Chats","Conversation preferences")}
   ${settingRow("notifications","Notifications","Notification preferences")}
   ${settingRow("help","Help","About ChatWave")}
   </section>`;
  $("editProfile").onclick=editProfile;
  main.querySelectorAll("[data-setting]").forEach(el=>el.onclick=()=>openSettings(el.dataset.setting));
 }
}
function settingRow(key,title,desc){
 const icons={account:"account",privacy:"privacy",chats:"chats",notifications:"notification",help:"help"};
 return `<div class="setting-row" data-setting="${key}"><div class="setting-icon">${svg(icons[key],"icon")}</div><div class="grow"><div class="person-name">${title}</div><div class="preview">${desc}</div></div><span class="muted">${svg("back","icon-sm")}</span></div>`;
}
function renderChatList(){
 const host=$("chatList");if(!host)return;
 const term=($("chatSearch")?.value||"").trim().toLowerCase();
 const list=chats.filter(c=>(chatName(c)+" "+latest(c)).toLowerCase().includes(term));
 if(!list.length){host.innerHTML=`<div class="empty"><div class="empty-icon">${svg(term?"search":"chats","icon-lg")}</div>${term?"No matching conversations.":"No conversations yet. Tap + to start a chat."}</div>`;return;}
 host.innerHTML=list.map(c=>{const n=chatName(c),u=unread(c);return `<div class="chat-row" data-chat="${esc(c.id)}"><div class="avatar">${esc(initials(n))}</div><div class="grow"><div class="person-name">${esc(n)}</div><div class="preview">${esc(latest(c))}</div></div><div style="text-align:right;display:flex;flex-direction:column;align-items:flex-end;gap:8px"><span class="small muted">${esc(timeText(c.updatedAt))}</span>${u?`<span class="unread">${u>99?"99+":u}</span>`:""}</div></div>`;}).join("");
 host.querySelectorAll("[data-chat]").forEach(el=>el.onclick=()=>openChat(el.dataset.chat));
}
async function editProfile(){
 const name=prompt("Choose your ChatWave username:",profile?.username||me.displayName||"");if(name===null)return;
 const username=name.trim();if(username.length<2){toast("Enter at least 2 characters.");return;}
 try{await updateProfile(me,{displayName:username});await setDoc(doc(db,"users",me.uid),{username,email:me.email,updatedAt:serverTimestamp()},{merge:true});profile={...profile,username};renderPage();toast("Profile updated.");}catch(e){toast(errText(e));}
}
function modal(title,body){
 $("modalHost").innerHTML=`<div id="modalShade" class="modal-shade"><section class="panel modal-card"><div class="row"><h2 class="grow">${esc(title)}</h2><button id="closeModal" class="icon-btn" aria-label="Close">${svg("close","icon-sm")}</button></div>${body}</section></div>`;
 $("closeModal").onclick=()=>$("modalHost").innerHTML="";
 $("modalShade").onclick=e=>{if(e.target.id==="modalShade")$("modalHost").innerHTML="";};
}
function openSettings(which){
 const titles={account:"Account",privacy:"Privacy",chats:"Chats",notifications:"Notifications",help:"Help"};let body="";
 if(which==="account"){
  body=`<p class="muted small">Signed in as</p><p>${esc(me.email||"")}</p><button class="secondary full" id="resetPassword">Send password reset email</button><hr><h3>Delete account</h3><p class="muted small">This removes your Firebase login and profile document. Conversation records and messages may need separate cleanup. This action cannot be undone.</p><button class="danger full" id="deleteAccount">${svg("trash","icon-sm")} Delete my account</button>`;
 }else if(which==="privacy"){
  body=`<p class="muted">Privacy preferences are not enforced until matching Firebase security rules and server-side controls are configured.</p>`;
 }else if(which==="chats"){
  body=`<p class="muted">Unread counts update from Firestore. Opening a conversation marks it read.</p>`;
 }else if(which==="notifications"){
  body=`<p class="muted">Push notifications are not configured in this version.</p>`;
 }else{
  body=`<div class="row">${svg("logo","icon-lg")}<div><b>ChatWave</b><p class="muted small">Connect. Chat. Share.</p></div></div><p class="muted">For account or data issues, contact your app administrator.</p>`;
 }
 modal(titles[which]||"Settings",body);
 $("resetPassword")?.addEventListener("click",async()=>{try{await sendPasswordResetEmail(auth,me.email);toast("Password reset email sent.");}catch(e){toast(errText(e));}});
 $("deleteAccount")?.addEventListener("click",confirmDeleteAccount);
}
async function confirmDeleteAccount(){
 if(!confirm("Permanently delete your ChatWave account?"))return;
 if(prompt('Type DELETE to confirm account deletion.')!=="DELETE"){toast("Deletion cancelled.");return;}
 try{
  await deleteDoc(doc(db,"users",me.uid));
  await deleteUser(me);
  $("modalHost").innerHTML="";
  toast("Account deleted.");
 }catch(e){toast("Could not delete account: "+errText(e)+". You may need to sign in again.");}
}
async function startNewChat(){
 const email=prompt("Enter the other person's registered email address:");if(email===null)return;
 const target=email.trim().toLowerCase();if(!target||target===me.email?.toLowerCase()){toast("Enter another user's email address.");return;}
 try{
  const user=people.find(p=>p.email?.toLowerCase()===target);
  if(!user){toast("User not found. They must register first.");return;}
  const members=[me.uid,user.uid].sort(),id=members.join("_"),ref=doc(db,"chats",id),existing=await getDoc(ref);
  if(!existing.exists())await setDoc(ref,{members,name:"",createdAt:serverTimestamp(),updatedAt:serverTimestamp(),lastMessage:"Start a conversation",unreadCounts:{[me.uid]:0,[user.uid]:0}});
  await openChat(id);
 }catch(e){toast("Could not start chat: "+errText(e));}
}
async function openChat(id){
 const c=chats.find(x=>x.id===id);if(!c){toast("Conversation not found.");return;}
 currentChat=c;chatOpen=true;$("appScreen").classList.add("hidden");$("conversation").classList.remove("hidden");
 $("chatTitle").textContent=chatName(c);$("chatAvatar").textContent=initials(chatName(c));
 const other=(c.members||[]).find(uid=>uid!==me.uid);
 $("chatSubtitle").textContent=people.find(p=>p.uid===other)?.username||"ChatWave";
 $("messages").innerHTML=`<div class="empty">Loading messages...</div>`;
 unsubMessages?.();
 unsubMessages=onSnapshot(query(collection(db,"chats",id,"messages"),orderBy("createdAt","asc")),snap=>{messageCache=snap.docs.map(d=>({id:d.id,...d.data()}));renderMessages();},e=>toast("Messages: "+errText(e)));
 try{await updateDoc(doc(db,"chats",id),{[`unreadCounts.${me.uid}`]:0});}catch(e){console.warn("Could not clear unread count",e);}
}
function renderMessages(){
 const host=$("messages");
 if(!messageCache.length){host.innerHTML=`<div class="empty"><div class="empty-icon">${svg("chats","icon-lg")}</div>No messages yet. Send the first message.</div>`;return;}
 host.innerHTML=messageCache.map(m=>{const mine=m.senderId===me.uid;return `<div class="message ${mine?"mine":""}">${esc(m.text||"")}<div class="message-time">${esc(timeText(m.createdAt))}${mine?" · You":""}</div></div>`;}).join("");
 host.scrollTop=host.scrollHeight;
}
$("composer").addEventListener("submit",async e=>{
 e.preventDefault();const text=$("messageInput").value.trim();if(!text||!currentChat)return;
 const input=$("messageInput");input.value="";input.style.height="auto";
 try{
  const ref=doc(db,"chats",currentChat.id),snap=await getDoc(ref);
  if(!snap.exists())throw new Error("Conversation no longer exists.");
  const data=snap.data();
  await addDoc(collection(db,"chats",currentChat.id,"messages"),{text,senderId:me.uid,createdAt:serverTimestamp()});
  const counts={...(data.unreadCounts||{})};
  for(const uid of(data.members||[])){if(uid!==me.uid)counts[uid]=(Number(counts[uid])||0)+1;}
  counts[me.uid]=0;
  await updateDoc(ref,{lastMessage:text,updatedAt:serverTimestamp(),unreadCounts:counts});
 }catch(e){input.value=text;toast("Message not sent: "+errText(e));}
});
$("messageInput").addEventListener("input",e=>{e.target.style.height="auto";e.target.style.height=Math.min(e.target.scrollHeight,130)+"px";});
$("backChat").onclick=()=>{chatOpen=false;currentChat=null;unsubMessages?.();unsubMessages=null;$("conversation").classList.add("hidden");$("appScreen").classList.remove("hidden");renderPage();updateUnreadBadge();};
$("chatMore").onclick=()=>{
 if(!currentChat)return;
 modal("Conversation",`<button id="clearUnread" class="secondary full">Mark as read</button><button id="closeConversation" class="secondary full" style="margin-top:10px">Close conversation</button>`);
 $("clearUnread").onclick=async()=>{try{await updateDoc(doc(db,"chats",currentChat.id),{[`unreadCounts.${me.uid}`]:0});$("modalHost").innerHTML="";toast("Marked as read.");}catch(e){toast(errText(e));}};
 $("closeConversation").onclick=()=>{$("modalHost").innerHTML="";$("backChat").click();};
};
$("newChatBtn").onclick=startNewChat;
document.querySelectorAll(".nav-item").forEach(b=>b.addEventListener("click",()=>setPage(b.dataset.page)));

function setAuthMode(mode){
 authMode=mode;pendingCode=null;
 $("authTitle").textContent=mode==="login"?"Welcome back":"Create your account";
 $("nameWrap").classList.toggle("hidden",mode!=="register");$("codeWrap").classList.add("hidden");$("authCode").required=false;
 $("authSubmit").textContent=mode==="login"?"Sign In":"Send verification code";
 $("authSwitch").textContent=mode==="login"?"Create an account":"I already have an account";
 $("forgotBtn").classList.toggle("hidden",mode!=="login");
}
$("authSwitch").onclick=()=>setAuthMode(authMode==="login"?"register":"login");
$("forgotBtn").onclick=async()=>{const email=$("authEmail").value.trim();if(!email){toast("Enter your email address first.");return;}try{await sendPasswordResetEmail(auth,email);toast("Password reset email sent.");}catch(e){toast(errText(e));}};
$("authForm").addEventListener("submit",async e=>{
 e.preventDefault();if(submitting)return;
 const email=$("authEmail").value.trim().toLowerCase(),password=$("authPassword").value,username=$("authName").value.trim();
 submitting=true;$("authSubmit").disabled=true;
 try{
  if(authMode==="register"&&!pendingCode){
   if(username.length<2)throw new Error("Please enter a username with at least 2 characters.");
   const code=String(Math.floor(100000+Math.random()*900000));
   await emailjs.send(EMAILJS_SERVICE_ID,EMAILJS_TEMPLATE_ID,{to_email:email,verification_code:code,app_name:"ChatWave"});
   pendingCode={code,email,expires:Date.now()+10*60*1000};
   $("codeWrap").classList.remove("hidden");$("authCode").required=true;$("authSubmit").textContent="Verify code and create account";
   toast("Verification code sent. Check your email.");return;
  }
  if(authMode==="register"){
   if(!pendingCode||pendingCode.email!==email||Date.now()>pendingCode.expires)throw new Error("Verification code expired. Switch to login and try registration again.");
   if($("authCode").value.trim()!==pendingCode.code)throw new Error("Verification code is incorrect.");
   const cred=await createUserWithEmailAndPassword(auth,email,password);
   await updateProfile(cred.user,{displayName:username});
   await setDoc(doc(db,"users",cred.user.uid),{username,email,createdAt:serverTimestamp(),updatedAt:serverTimestamp()});
   pendingCode=null;
  }else{await signInWithEmailAndPassword(auth,email,password);}
 }catch(e){toast(errText(e));}
 finally{submitting=false;$("authSubmit").disabled=false;}
});
onAuthStateChanged(auth,async user=>{
 if(!user){me=null;profile=null;cleanListeners();showAuth();return;}
 me=user;
 try{
  const snap=await getDoc(doc(db,"users",user.uid));
  profile=snap.exists()?snap.data():{username:user.displayName||user.email?.split("@")[0]||"ChatWave user",email:user.email};
  if(!snap.exists())await setDoc(doc(db,"users",user.uid),{username:profile.username,email:user.email,createdAt:serverTimestamp()},{merge:true});
  showApp();
 }catch(e){toast("Profile could not load: "+errText(e));showApp();}
});
setAuthMode("login");
</script>
</body>
</html>
