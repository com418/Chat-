<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#07111f">
<title>ChatWave — Connect. Chat. Share.</title>
<style>
:root{color-scheme:dark;--bg:#07111f;--panel:rgba(17,31,51,.88);--line:rgba(255,255,255,.12);--text:#f5f8ff;--muted:#92a2b9;--accent:#7c9cff;--accent2:#8b5cf6;--good:#62dfb2;--danger:#ff7188}
*{box-sizing:border-box}
body{margin:0;min-height:100dvh;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:radial-gradient(ellipse at 12% 0%,#17284c,transparent 40%),radial-gradient(ellipse at 100% 70%,#241c4a,transparent 38%),var(--bg);color:var(--text)}
button,input,textarea,select{font:inherit}
button{cursor:pointer}
button:disabled{opacity:.55;cursor:not-allowed}
.hidden{display:none!important}
.muted{color:var(--muted)}
.app{min-height:100dvh;display:flex;align-items:center;justify-content:center;padding:18px}
.shell{width:min(1200px,100%);height:min(900px,calc(100dvh - 36px));min-height:580px;display:grid;grid-template-columns:280px 1fr;overflow:hidden;border:1px solid var(--line);border-radius:28px;background:rgba(7,17,31,.8);box-shadow:0 28px 90px #0007;backdrop-filter:blur(28px)}
.sidebar{display:flex;flex-direction:column;min-width:0;border-right:1px solid var(--line);background:#ffffff05}
.brand{display:flex;align-items:center;gap:12px;padding:24px 20px}
.logo{width:42px;height:42px;display:grid;place-items:center;border-radius:15px;background:linear-gradient(140deg,var(--accent),var(--accent2));font-weight:900}
.brand h1{font-size:19px;margin:0}
.brand p{font-size:12px;color:var(--muted);margin:4px 0 0}
.nav{display:flex;flex-direction:column;gap:6px;padding:0 12px 16px}
.nav button{display:flex;align-items:center;gap:10px;text-align:left;padding:12px;border:1px solid transparent;border-radius:13px;background:transparent;color:var(--muted)}
.nav button.active,.nav button:hover{background:#7c9cff18;border-color:#7c9cff35;color:var(--text)}
.nav svg{width:19px;height:19px}
.side-extra{padding:14px;overflow:auto;border-top:1px solid var(--line)}
.side-extra h3{font-size:12px;text-transform:uppercase;letter-spacing:1px;color:var(--muted)}
.side-extra p{font-size:12px;overflow-wrap:anywhere}
.workspace{display:flex;flex-direction:column;min-width:0;min-height:0}
.topbar{height:72px;flex-shrink:0;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:0 22px;border-bottom:1px solid var(--line)}
.topbar h2{font-size:17px;margin:0}
.topbar p{font-size:12px;color:var(--muted);margin:4px 0 0}
.content{flex:1;min-height:0;overflow:auto;padding:24px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:13px;padding:12px 16px;background:linear-gradient(135deg,var(--accent),var(--accent2));color:white;font-weight:700}
.btn.secondary{border:1px solid var(--line);background:#ffffff08;color:var(--text)}
.btn.danger{background:#ff718818;border:1px solid #ff718855;color:#ff9aaa}
input,textarea,select{width:100%;padding:12px 14px;border:1px solid var(--line);border-radius:13px;background:#ffffff08;color:var(--text);outline:none}
textarea{resize:vertical;min-height:100px}
label{display:block;font-size:13px;color:#c0ccdc;margin:14px 0 7px}
.card{border:1px solid var(--line);border-radius:18px;padding:18px;background:#ffffff05;margin-bottom:14px}
.card h3{margin:0 0 8px;font-size:15px}
.card p{color:var(--muted);font-size:13px;line-height:1.6}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.ticket{display:block;width:100%;text-align:left;color:var(--text);border:1px solid var(--line);border-radius:15px;padding:15px;background:#ffffff05;margin:9px 0}
.ticket:hover{background:#ffffff0c}
.ticket strong{display:block;margin-bottom:7px}
.ticket small{color:var(--muted)}
.pill{display:inline-block;border-radius:20px;padding:4px 9px;font-size:11px;background:#7c9cff20;color:#b8c9ff}
.pill.open{background:#62dfb21b;color:#8ce8c5}
.pill.closed{background:#ffffff15;color:#bdc6d5}
.message{padding:13px;border:1px solid var(--line);border-radius:14px;background:#ffffff06;margin:10px 0;overflow-wrap:anywhere}
.message.mine{background:#7c9cff18;border-color:#7c9cff35}
.message small{display:block;color:var(--muted);font-size:11px;margin-bottom:7px}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.notice{padding:12px;border:1px solid var(--line);border-radius:12px;font-size:13px;margin:12px 0;line-height:1.5}
.notice.error{color:#ffb2bf;border-color:#ff718855}
.notice.success{color:#9cf2d3;border-color:#62dfb255}
.empty{text-align:center;padding:35px 12px;color:var(--muted);line-height:1.6}
.auth-wrap{width:min(430px,100%);margin:auto}
.auth-card{width:100%;padding:30px;border:1px solid var(--line);border-radius:25px;background:#0c182ae8;box-shadow:0 25px 80px #0005}
.auth-card h2{margin:0 0 8px}
.auth-card p{color:var(--muted);font-size:13px;line-height:1.5}
.auth-card label{margin-top:15px}
.auth-card .btn{width:100%;margin-top:12px}
.link{border:0;background:none;color:#a9bbff;padding:8px 0}
#toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);max-width:90%;padding:13px 18px;background:#192943;border:1px solid var(--line);border-radius:14px;z-index:99;box-shadow:0 10px 40px #0008}
@media(max-width:760px){
 .app{padding:0}.shell{height:100dvh;min-height:0;border:0;border-radius:0;grid-template-columns:1fr}
 .sidebar{border-right:0;border-bottom:1px solid var(--line)}
 .brand{padding:calc(12px + env(safe-area-inset-top)) 16px 12px}
 .nav{flex-direction:row;overflow-x:auto;padding:0 10px 10px}
 .nav button{white-space:nowrap;flex:1;justify-content:center;padding:10px 7px;font-size:12px}
 .side-extra{display:none}.topbar{height:66px;padding:0 15px}.content{padding:15px}
 .grid{grid-template-columns:1fr}
}
</style>
</head>
<body>
<div id="authScreen" class="app">
 <div class="auth-wrap">
  <div class="auth-card">
   <div class="brand" style="padding:0 0 20px">
    <div class="logo">CW</div><div><h1>ChatWave</h1><p>Connect. Chat. Share.</p></div>
   </div>
   <div id="authPanel">
    <h2>Welcome back</h2>
    <p>Sign in to access your ChatWave account.</p>
    <form id="loginForm">
     <label for="email">Email address</label>
     <input id="email" type="email" autocomplete="email" required placeholder="you@example.com">
     <label for="password">Password</label>
     <input id="password" type="password" autocomplete="current-password" minlength="6" required>
     <button class="btn" id="loginBtn" type="submit">Sign in</button>
    </form>
    <button class="link" id="forgotBtn" type="button">Forgot password?</button>
    <div id="authNotice" class="notice hidden"></div>
   </div>
  </div>
 </div>
</div>

<div id="appScreen" class="app hidden">
 <div class="shell">
  <aside class="sidebar">
   <div class="brand"><div class="logo">CW</div><div><h1>ChatWave</h1><p>Connect. Chat. Share.</p></div></div>
   <nav class="nav" id="navigation">
    <button data-page="home" class="active"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M21 11.5a8 8 0 0 1-8 8 8 8 0 0 1-4-1L3 21l2-5a8 8 0 1 1 16-4.5z"/></svg> Messages</button>
    <button data-page="support"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="9"/><path d="M9.5 9a2.5 2.5 0 1 1 4.3 1.8c-1.2 1-1.8 1.3-1.8 3.2M12 17h.01"/></svg> Support</button>
    <button data-page="reports"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 3 3 20h18L12 3z"/><path d="M12 9v5m0 3h.01"/></svg> Report a problem</button>
    <button data-page="mytickets"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 4h16v16H4zM8 9h8M8 13h8M8 17h4"/></svg> My tickets</button>
    <button data-page="settings"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="3"/><path d="m19 13 2 1-2 4-2-1-2 1v2H9v-2l-2-1-2 1-2-4 2-1v-2l-2-1 2-4 2 1 2-1V4h6v2l2 1 2-1 2 4-2 1z"/></svg> Settings</button>
    <button id="adminNav" data-page="admin" class="hidden"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M8 9h8M8 13h8M8 17h4"/></svg> Admin reports</button>
   </nav>
   <div class="side-extra"><h3>Signed in</h3><p id="sideEmail"></p><p class="muted">Your support conversations are private to your account and authorized administrators.</p></div>
  </aside>
  <main class="workspace">
   <header class="topbar"><div><h2 id="pageTitle">Messages</h2><p id="pageSubtitle">Your ChatWave workspace</p></div></header>
   <section class="content" id="content"><div class="empty">Welcome to ChatWave.</div></section>
  </main>
 </div>
</div>
<div id="toast" class="hidden" role="status"></div>

<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/11.6.0/firebase-app.js";
import {getAuth,onAuthStateChanged,signInWithEmailAndPassword,sendPasswordResetEmail} from "https://www.gstatic.com/firebasejs/11.6.0/firebase-auth.js";
import {
 getFirestore,doc,getDoc,setDoc,collection,addDoc,query,where,
 orderBy,onSnapshot,serverTimestamp,getDocs,updateDoc
} from "https://www.gstatic.com/firebasejs/11.6.0/firebase-firestore.js";

const firebaseConfig={
 apiKey:"AIzaSyCOfnS3DMUMSRHJpyW_tpSIjwFymrTt7w",
 authDomain:"chat-2c557.firebaseapp.com",
 databaseURL:"https://chat-2c557-default-rtdb.firebaseio.com",
 projectId:"chat-2c557",
 storageBucket:"chat-2c557.firebasestorage.app",
 messagingSenderId:"74313204354",
 appId:"1:74313204354:web:c735269d502b88a39eea9b"
};

const app=initializeApp(firebaseConfig);
const auth=getAuth(app);
const db=getFirestore(app);
const $=id=>document.getElementById(id);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
let currentUser=null,profile={},currentPage="home";
let stopMyTickets=null,stopAdminTickets=null,stopTicketMessages=null;
let currentTicket=null,myTickets=[],adminTickets=[];

function toast(msg){
 $("toast").textContent=msg;
 $("toast").classList.remove("hidden");
 setTimeout(()=>$("toast").classList.add("hidden"),3500);
}
function notice(id,msg,type=""){
 const el=$(id);
 el.textContent=msg;
 el.className="notice "+type;
}
function friendlyError(e){
 const c=e?.code||"";
 const map={
  "auth/invalid-credential":"Email or password is incorrect.",
  "auth/user-not-found":"No account was found for that email.",
  "auth/wrong-password":"Email or password is incorrect.",
  "auth/too-many-requests":"Too many attempts. Try again later.",
  "auth/network-request-failed":"Check your internet connection.",
  "permission-denied":"Firebase denied this action. Check your Firestore security rules.",
  "unavailable":"Firebase is temporarily unavailable. Try again."
 };
 return map[c]||e?.message||"Something went wrong.";
}
function dateLabel(v){
 try{return v?.toDate?v.toDate().toLocaleString(): "Just now"}catch{return "Just now"}
}
function statusPill(status){
 const s=status||"open";
 return `<span class="pill ${s==="closed"?"closed":"open"}">${esc(s.replaceAll("_"," "))}</span>`;
}
function page(title,subtitle,html){
 $("pageTitle").textContent=title;
 $("pageSubtitle").textContent=subtitle;
 $("content").innerHTML=html;
 currentPage=title.toLowerCase();
 document.querySelectorAll("#navigation button[data-page]").forEach(b=>b.classList.toggle("active",b.dataset.page===({
  "messages":"home","support":"support","report a problem":"reports","my tickets":"mytickets","settings":"settings","admin reports":"admin"
 })[currentPage]));
}
function stopListeners(){
 if(stopMyTickets){stopMyTickets();stopMyTickets=null}
 if(stopAdminTickets){stopAdminTickets();stopAdminTickets=null}
 if(stopTicketMessages){stopTicketMessages();stopTicketMessages=null}
}
function isAdmin(){return profile.role==="admin"||profile.isAdmin===true}

function renderHome(){
 page("Messages","Your ChatWave workspace",`
  <div class="card"><h3>Welcome to ChatWave</h3>
  <p>Your messaging area is ready. Use Support if you need help with your account, messages, or a technical issue. Use Report a problem to submit a safety or abuse report.</p>
  <button class="btn" id="homeSupport">Open Support Center</button></div>
  <div class="grid">
   <div class="card"><h3>Support Center</h3><p>Get help with login, verification, account access, or technical issues.</p><button class="btn secondary" id="homeHelp">Get support</button></div>
   <div class="card"><h3>Report a user or issue</h3><p>Report spam, harassment, scams, impersonation, or other problems.</p><button class="btn secondary" id="homeReport">Make a report</button></div>
  </div>`);
 $("homeSupport").onclick=renderSupport;
 $("homeHelp").onclick=renderSupport;
 $("homeReport").onclick=renderReportForm;
}

function renderSupport(){
 page("Support","Contact the ChatWave support team",`
  <div class="card"><h3>How can we help?</h3>
   <p>Send a private support ticket to the ChatWave team. Replies will appear inside ChatWave under My tickets.</p>
   <form id="supportForm">
    <label for="supportCategory">What do you need help with?</label>
    <select id="supportCategory" required>
     <option value="Account access">Account access</option>
     <option value="Email verification">Email verification</option>
     <option value="Messages">Messages not sending or loading</option>
     <option value="Profile">Profile or account settings</option>
     <option value="Bug report">Technical issue or bug</option>
     <option value="Other">Other</option>
    </select>
    <label for="supportSubject">Subject</label>
    <input id="supportSubject" maxlength="120" required placeholder="Briefly describe the problem">
    <label for="supportBody">Tell us more</label>
    <textarea id="supportBody" maxlength="5000" required placeholder="Explain what happened and what you need help with."></textarea>
    <button class="btn" id="submitSupport" type="submit">Submit support ticket</button>
   </form>
   <div id="supportNotice" class="notice hidden"></div>
  </div>
  <div class="card"><h3>What happens next?</h3><p>Your ticket receives a reference number. You can reopen it under My tickets to read replies and continue the conversation.</p></div>`);
 $("supportForm").onsubmit=e=>submitTicket(e,"support");
}

function renderReportForm(){
 page("Report a problem","Report an account, user, or safety issue",`
  <div class="card"><h3>Submit a report</h3>
   <p>Give enough detail for the support team to review the situation. Please do not include passwords or verification codes.</p>
   <form id="reportForm">
    <label for="reportType">What are you reporting?</label>
    <select id="reportType" required>
     <option value="Harassment or bullying">Harassment or bullying</option>
     <option value="Spam">Spam or unwanted messages</option>
     <option value="Scam or fraud">Scam or fraud</option>
     <option value="Impersonation">Impersonation or fake account</option>
     <option value="Threats">Threats or safety concern</option>
     <option value="Inappropriate content">Inappropriate content</option>
     <option value="Technical issue">Technical issue</option>
     <option value="Other">Other</option>
    </select>
    <label for="reportedUser">Username or email of the user (optional)</label>
    <input id="reportedUser" maxlength="180" placeholder="Who are you reporting?">
    <label for="reportSubject">Subject</label>
    <input id="reportSubject" maxlength="120" required placeholder="Brief summary">
    <label for="reportBody">Describe what happened</label>
    <textarea id="reportBody" maxlength="5000" required placeholder="Include relevant details, dates, and message context."></textarea>
    <button class="btn" id="submitReport" type="submit">Submit report</button>
   </form>
   <div id="reportNotice" class="notice hidden"></div>
  </div>
  <div class="card"><h3>Your privacy</h3><p>Reports are intended for review by authorized ChatWave administrators. Submitting a report does not automatically block the reported user.</p></div>`);
 $("reportForm").onsubmit=e=>submitTicket(e,"report");
}

async function submitTicket(e,type){
 e.preventDefault();
 const form=e.currentTarget;
 const button=form.querySelector('button[type="submit"]');
 const subject=$(type==="support"?"supportSubject":"reportSubject").value.trim();
 const body=$(type==="support"?"supportBody":"reportBody").value.trim();
 const category=$(type==="support"?"supportCategory":"reportType").value;
 const reportedUser=type==="report"?$("reportedUser").value.trim():"";
 const noticeId=type==="support"?"supportNotice":"reportNotice";
 if(!subject||!body){notice(noticeId,"Please complete all required fields.","error");return}
 button.disabled=true;button.textContent="Submitting…";
 try{
  const ticketRef=await addDoc(collection(db,"supportTickets"),{
   ownerUid:currentUser.uid,
   ownerEmail:currentUser.email||"",
   category,
   subject,
   body,
   reportedUser,
   type,
   status:"open",
   createdAt:serverTimestamp(),
   updatedAt:serverTimestamp(),
   lastReplyAt:null
  });
  notice(noticeId,"Submitted successfully. Your reference number is "+ticketRef.id+". Open My tickets to view replies.","success");
  form.reset();
  toast("Your ticket has been submitted.");
 }catch(err){
  notice(noticeId,friendlyError(err),"error");
 }finally{
  button.disabled=false;
  button.textContent=type==="support"?"Submit support ticket":"Submit report";
 }
}

function watchMyTickets(){
 if(stopMyTickets)stopMyTickets();
 const q=query(collection(db,"supportTickets"),where("ownerUid","==",currentUser.uid));
 stopMyTickets=onSnapshot(q,snap=>{
  myTickets=snap.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>(b.createdAt?.seconds||0)-(a.createdAt?.seconds||0));
  if(currentPage==="my tickets")renderMyTickets();
 },err=>toast(friendlyError(err)));
}

function renderMyTickets(){
 page("My tickets","View your support requests and replies",`
  <div id="myTicketList"><div class="empty">Loading your tickets…</div></div>
  <div id="ticketDetail" class="hidden"></div>`);
 const list=$("myTicketList");
 if(!myTickets.length){
  list.innerHTML='<div class="card empty">You have not submitted any tickets yet.</div>';
  return;
 }
 list.innerHTML=myTickets.map(t=>`
  <button class="ticket" data-ticket="${esc(t.id)}">
   <div class="row"><strong>${esc(t.subject||"Untitled ticket")}</strong>${statusPill(t.status)}</div>
   <small>${esc(t.category||t.type||"Support")} · ${esc(dateLabel(t.createdAt))}</small>
   <p>${esc((t.body||"").slice(0,130))}</p>
   <small>Reference: ${esc(t.id)}</small>
  </button>`).join("");
 list.querySelectorAll("[data-ticket]").forEach(b=>b.onclick=()=>openTicket(b.dataset.ticket,false));
}

function renderAdminTickets(){
 if(!isAdmin()){
  page("Admin reports","Restricted access",'<div class="card"><h3>Access denied</h3><p>This page is only available to authorized administrators.</p></div>');
  return;
 }
 page("Admin reports","Review support tickets and user reports",`
  <div class="grid">
   <div class="card"><h3>Open tickets</h3><div id="adminOpenCount">—</div></div>
   <div class="card"><h3>Total tickets</h3><div id="adminTotalCount">—</div></div>
  </div>
  <div id="adminTicketList"><div class="empty">Loading tickets…</div></div>
  <div id="ticketDetail" class="hidden"></div>`);
 const list=$("adminTicketList");
 $("adminOpenCount").textContent=adminTickets.filter(t=>t.status!=="closed").length;
 $("adminTotalCount").textContent=adminTickets.length;
 if(!adminTickets.length){
  list.innerHTML='<div class="card empty">No tickets found.</div>';
  return;
 }
 list.innerHTML=adminTickets.map(t=>`
  <button class="ticket" data-ticket="${esc(t.id)}">
   <div class="row"><strong>${esc(t.subject||"Untitled ticket")}</strong>${statusPill(t.status)}</div>
   <small>${esc(t.type||"support")} · ${esc(t.category||"")} · ${esc(t.ownerEmail||"")}</small>
   <p>${esc((t.body||"").slice(0,140))}</p>
   <small>${esc(dateLabel(t.createdAt))} · ${esc(t.id)}</small>
  </button>`).join("");
 list.querySelectorAll("[data-ticket]").forEach(b=>b.onclick=()=>openTicket(b.dataset.ticket,true));
}

function watchAdminTickets(){
 if(!isAdmin())return;
 if(stopAdminTickets)stopAdminTickets();
 const q=query(collection(db,"supportTickets"),orderBy("createdAt","desc"));
 stopAdminTickets=onSnapshot(q,snap=>{
  adminTickets=snap.docs.map(d=>({id:d.id,...d.data()}));
  if(currentPage==="admin reports")renderAdminTickets();
 },err=>{
  console.error(err);
  toast("Could not load admin tickets: "+friendlyError(err));
 });
}

async function openTicket(id,admin){
 const ticket=(admin?adminTickets:myTickets).find(t=>t.id===id);
 if(!ticket){toast("Ticket not found. Refresh and try again.");return}
 currentTicket=ticket;
 const host=$("ticketDetail");
 host.classList.remove("hidden");
 host.innerHTML=`
  <div class="card">
   <div class="row"><h3>${esc(ticket.subject||"Ticket")}</h3>${statusPill(ticket.status)}</div>
   <p>Reference: ${esc(ticket.id)}</p>
   <p>Category: ${esc(ticket.category||"Support")}</p>
   ${admin?`<p>Submitted by: ${esc(ticket.ownerEmail||ticket.ownerUid)}</p>`:""}
   ${ticket.reportedUser?`<p>Reported user: ${esc(ticket.reportedUser)}</p>`:""}
   <div class="message"><small>Original message · ${esc(dateLabel(ticket.createdAt))}</small>${esc(ticket.body||"")}</div>
   <div id="ticketReplies"><div class="empty">Loading replies…</div></div>
   ${ticket.status!=="closed"?(admin?`
    <form id="replyForm">
     <label for="replyText">Reply to user</label>
     <textarea id="replyText" maxlength="5000" required placeholder="Write your response…"></textarea>
     <div class="row"><button class="btn" type="submit">Send reply</button><button class="btn secondary" type="button" id="closeTicket">Close ticket</button></div>
    </form>`:`
    <form id="replyForm">
     <label for="replyText">Add a message</label>
     <textarea id="replyText" maxlength="5000" required placeholder="Add more details to your ticket…"></textarea>
     <button class="btn" type="submit">Send message</button>
    </form>`):`<p>This ticket is closed. If you still need help, submit a new ticket.</p>`}
   <div id="ticketNotice" class="notice hidden"></div>
  </div>`;
 const replyQ=query(collection(db,"supportTickets",id,"replies"),orderBy("createdAt","asc"));
 if(stopTicketMessages){stopTicketMessages();stopTicketMessages=null}
 stopTicketMessages=onSnapshot(replyQ,snap=>{
  const target=$("ticketReplies");if(!target)return;
  if(snap.empty){target.innerHTML='<p class="muted">No replies yet.</p>';return}
  target.innerHTML=snap.docs.map(d=>{
   const r=d.data(),mine=r.senderUid===currentUser.uid;
   return `<div class="message ${mine?"mine":""}"><small>${esc(r.senderName||r.senderEmail||"ChatWave Support")} · ${esc(dateLabel(r.createdAt))}</small>${esc(r.text||"")}</div>`;
  }).join("");
 },err=>{$("ticketReplies").innerHTML='<div class="notice error">'+esc(friendlyError(err))+'</div>'});
 const form=$("replyForm");
 if(form)form.onsubmit=async e=>{
  e.preventDefault();
  const text=$("replyText").value.trim();
  if(!text)return;
  const btn=form.querySelector("button[type='submit']");
  if(btn){btn.disabled=true;btn.textContent="Sending…"}
  try{
   await addDoc(collection(db,"supportTickets",id,"replies"),{
    text,
    senderUid:currentUser.uid,
    senderEmail:currentUser.email||"",
    senderName:admin?"ChatWave Support":(profile.displayName||profile.name||currentUser.email||"User"),
    isAdmin:admin,
    createdAt:serverTimestamp()
   });
   await updateDoc(doc(db,"supportTickets",id),{
    updatedAt:serverTimestamp(),
    lastReplyAt:serverTimestamp(),
    lastReplyBy:admin?"support":currentUser.uid,
    status:admin?"in_progress":"open"
   });
   $("replyText").value="";
   notice("ticketNotice","Reply sent.","success");
  }catch(err){notice("ticketNotice",friendlyError(err),"error")}
  finally{if(btn){btn.disabled=false;btn.textContent=admin?"Send reply":"Send message"}}
 };
 if(admin&&ticket.status!=="closed"){
  $("closeTicket").onclick=async()=>{
   try{
    await updateDoc(doc(db,"supportTickets",id),{status:"closed",updatedAt:serverTimestamp()});
    toast("Ticket closed.");
   }catch(e){toast(friendlyError(e))}
  };
 }
 host.scrollIntoView({behavior:"smooth",block:"start"});
}

function renderSettings(){
 page("Settings","Your ChatWave account",`
  <div class="card"><h3>Account</h3><p>Email: ${esc(currentUser.email||"Not available")}</p><p>Display name: ${esc(profile.displayName||profile.name||"ChatWave user")}</p></div>
  <div class="card"><h3>Support and privacy</h3><p>Support tickets and reports are linked to your account. Only you and authorized support administrators should be able to access your ticket conversations.</p><button class="btn secondary" id="settingsSupport">Contact support</button></div>
  <div class="card"><h3>Sign-in security</h3><p>Use a strong password and never share your password or verification codes with anyone claiming to be support.</p><button class="btn secondary" id="resetPassword">Send password reset email</button></div>`);
 $("settingsSupport").onclick=renderSupport;
 $("resetPassword").onclick=async()=>{
  try{await sendPasswordResetEmail(auth,currentUser.email);toast("If the account exists, a reset email has been sent.")}
  catch(e){toast(friendlyError(e))}
 };
}

function openPage(name){
 if(stopTicketMessages){stopTicketMessages();stopTicketMessages=null}
 if(name==="home")renderHome();
 if(name==="support")renderSupport();
 if(name==="reports")renderReportForm();
 if(name==="mytickets")renderMyTickets();
 if(name==="settings")renderSettings();
 if(name==="admin")renderAdminTickets();
}
document.querySelectorAll("#navigation button[data-page]").forEach(b=>{
 b.addEventListener("click",()=>openPage(b.dataset.page));
});

$("loginForm").addEventListener("submit",async e=>{
 e.preventDefault();
 const btn=$("loginBtn");btn.disabled=true;btn.textContent="Signing in…";
 $("authNotice").className="notice hidden";
 try{
  await signInWithEmailAndPassword(auth,$("email").value.trim().toLowerCase(),$("password").value);
 }catch(err){
  notice("authNotice",friendlyError(err),"error");
 }finally{
  btn.disabled=false;btn.textContent="Sign in";
 }
});
$("forgotBtn").addEventListener("click",async()=>{
 const email=$("email").value.trim();
 if(!email){notice("authNotice","Enter your email address first.","error");return}
 try{
  await sendPasswordResetEmail(auth,email);
  notice("authNotice","If an account exists for that address, a password reset email has been sent.","success");
 }catch(e){notice("authNotice",friendlyError(e),"error")}
});

onAuthStateChanged(auth,async user=>{
 currentUser=user;
 stopListeners();
 if(!user){
  profile={};myTickets=[];adminTickets=[];
  $("appScreen").classList.add("hidden");
  $("authScreen").classList.remove("hidden");
  return;
 }
 $("authScreen").classList.add("hidden");
 $("appScreen").classList.remove("hidden");
 $("sideEmail").textContent=user.email||"";
 try{
  const snap=await getDoc(doc(db,"users",user.uid));
  profile=snap.exists()?snap.data():{};
  if(!snap.exists()){
   profile={uid:user.uid,email:user.email||"",displayName:user.displayName||user.email?.split("@")[0]||"ChatWave user",role:"user",createdAt:serverTimestamp()};
   await setDoc(doc(db,"users",user.uid),profile,{merge:true});
  }
 }catch(e){
  console.error(e);
  toast("Your account loaded, but the profile could not be read: "+friendlyError(e));
 }
 $("adminNav").classList.toggle("hidden",!isAdmin());
 watchMyTickets();
 if(isAdmin())watchAdminTickets();
 openPage("home");
});
</script>
</body>
</html>
